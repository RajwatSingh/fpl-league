<style>
/* ── Palette ───────────────────────────────────────────────────────────
   Neutrals carry a blue-violet cast (hue 285) at low chroma; accents sit
   at near-constant lightness and are separated by hue angle, each with
   exactly one job.

   That last property means the accent set is a syntax theme, NOT a chart
   palette: run through the CVD validator, blue and purple are 0.4 ΔE
   apart for a deuteranope. So nothing here encodes a value by hue alone.
   State uses a hue plus a glyph.

   n0 sits well below n1 rather than the portfolio's 0.04 step: this page
   is one big table, and at that step the table dissolved into the page
   instead of sitting on it. The deeper ground is what gives every raised
   surface - strip, inputs, rows, cards - an edge to read against.        */
:root {
  --n0: oklch(0.15 0.016 285); /* page ground: deliberately below n1 */
  --n1: oklch(0.23 0.020 285);
  --n2: oklch(0.27 0.022 285);
  --n3: oklch(0.32 0.022 285);
  --n4: oklch(0.42 0.022 285);  /* hairline: furniture, not signal */
  --n5: oklch(0.594 0.020 285); /* interactive edges, inputs */
  --n6: oklch(0.74 0.016 285);
  --n7: oklch(0.84 0.012 285);
  --n8: oklch(0.95 0.008 285);

  /* One job each. Cyan was retired: it encoded "players left to play",
     which is a potential rather than a good outcome, so a positive-coded
     hue misread it - that number is neutral now and the live dot carries
     the in-progress signal instead. */
  --blue:   oklch(0.78 0.11 255);
  --purple: oklch(0.78 0.13 300);
  --green:  oklch(0.80 0.15 150);
  --orange: oklch(0.80 0.13 65);
  --rose:   oklch(0.75 0.13 15);
  --gold:   oklch(0.83 0.15 95); /* the league leader only - a real table's one gilt edge */

  --radius: 0.25rem;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --mono: "Martian Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
html {
  scrollbar-width: thin; scrollbar-color: var(--n3) transparent;
  -webkit-text-size-adjust: 100%;
}
body {
  margin: 0;
  background: var(--n0);
  color: var(--n8);
  font-family: var(--sans);
  font-size: 0.9375rem;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 2px; }

.skip {
  position: absolute; left: -9999px; top: 0; z-index: 10;
  background: var(--n2); color: var(--n8); padding: 0.5rem 0.75rem;
  font-family: var(--mono); font-size: 0.75rem;
}
.skip:focus { left: 0.75rem; top: 0.75rem; }

.wrap { max-width: 78rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

/* ── Status strip ──────────────────────────────────────────────────────
   The portfolio's systemctl-style header: a dot, the subject, the state.
   This is a machine reporting on itself, so it stays in the mono voice. */
.strip {
  display: flex; align-items: center; gap: 0.625rem; flex-wrap: wrap;
  border: 1px solid var(--n5);
  border-radius: var(--radius);
  padding: 0.625rem 0.875rem;
  font-family: var(--mono);
  font-size: 0.75rem;
  background: var(--n1);
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex: none; }
.dot.stale { background: var(--n5); }
.dot.err { background: var(--rose); }
.strip .subject { color: var(--n8); font-weight: 500; }
.strip .dash { color: var(--n4); }
.strip .state { color: var(--n6); }
.strip .right { margin-left: auto; color: var(--n6); }

/* ── Controls ──────────────────────────────────────────────────────────
   Inputs get the strong border step: an edge you are meant to click must
   read at a glance, unlike a hairline rule.                             */
.controls {
  display: flex; gap: 0.75rem; align-items: flex-end; flex-wrap: wrap;
  margin: 1.5rem 0 2rem;
}
.field { display: flex; flex-direction: column; gap: 0.375rem; min-width: 0; }
.field label, .field .lbl {
  font-family: var(--mono); font-size: 0.6875rem; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--n6);
}
input[type="number"], select {
  font-family: var(--mono); font-size: 0.8125rem;
  background: var(--n1); color: var(--n8);
  border: 1px solid var(--n5); border-radius: var(--radius);
  padding: 0.5rem 0.625rem; min-width: 8.5rem;
  line-height: 1.4;
  transition: border-color 180ms var(--ease);
}
/* The popup a <select> opens is a separate surface and does NOT inherit the
   select's font-size — it has to be set on the options themselves, or the
   list renders at the browser default and comes out tiny next to the
   control that opened it. Chrome and Firefox honour these; Safari styles
   the popup itself and ignores most of them, which is fine because Safari's
   default is already legible. */
select option {
  font-family: var(--sans);
  font-size: 1rem;
  background: var(--n1);
  color: var(--n8);
  padding: 0.5rem 0.625rem;
}

input[type="number"]:hover, select:hover { border-color: var(--n6); }
input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; }

button {
  font-family: var(--mono); font-size: 0.8125rem; font-weight: 500;
  background: var(--n2); color: var(--n8);
  border: 1px solid var(--n5); border-radius: var(--radius);
  padding: 0.5rem 0.9rem; cursor: pointer;
  transition: background 180ms var(--ease), border-color 180ms var(--ease);
}
button:hover:not(:disabled) { background: var(--n3); border-color: var(--n6); }
button:disabled { opacity: 0.5; cursor: default; }

/* Refresh is the one action on the page that isn't reachable any other
   way: every filter beside it already refetches on change, so this exists
   for the live gameweek case - pull the scores again, now. It gets the
   only filled control treatment so the hierarchy tells the truth. */
#go {
  background: color-mix(in oklch, var(--blue) 20%, var(--n2));
  border-color: color-mix(in oklch, var(--blue) 55%, transparent);
  color: var(--n8);
}
#go:hover:not(:disabled) {
  background: color-mix(in oklch, var(--blue) 32%, var(--n2));
  border-color: var(--blue);
}

.sortrow { display: flex; gap: 0.375rem; }
.sortrow select { min-width: 9rem; }
.sortrow button { min-width: 2.25rem; padding: 0.5rem 0; font-size: 0.875rem; }

/* Selection and hover have to be different channels, not two steps on the
   same neutral ramp - at n3 for both, a hovered tab was indistinguishable
   from the selected one. Selection is a lighter fill plus an accent rule
   along the bottom; hover stays a plain neutral lift. */
.toggle {
  display: flex; position: relative;
  border: 1px solid var(--n5); border-radius: var(--radius); overflow: hidden;
}
.toggle button {
  border: 0; border-radius: 0; background: transparent; color: var(--n6);
  white-space: nowrap;
  transition: background 180ms var(--ease), color 180ms var(--ease);
}
.toggle button + button { border-left: 1px solid var(--n5); }
.toggle button[aria-selected="true"],
.toggle button[aria-selected="true"]:hover {
  background: var(--n4); color: var(--n8);
}

.phase-status {
  font-family: var(--mono); font-size: 0.625rem; font-weight: 500;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--n4);
  margin-left: 0.5rem;
}

/* ── Section eyebrow ───────────────────────────────────────────────────
   Same idiom as the portfolio's fpl-status heading.                     */
.eyebrow {
  display: flex; align-items: center; gap: 0.75rem;
  font-family: var(--mono); font-size: 0.6875rem; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--n6);
  margin: 2.25rem 0 0.875rem;
}
.eyebrow::after { content: ""; height: 1px; flex: 1; background: var(--n4); }

/* ── Table ─────────────────────────────────────────────────────────────*/
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
thead th {
  font-family: var(--mono); font-size: 0.625rem; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--n6);
  text-align: right; padding: 0 0.6rem 0.55rem; white-space: nowrap;
  border-bottom: 1px solid var(--n4);
}
thead th:nth-child(-n+2) { text-align: left; }
thead th.sortable { cursor: pointer; }
thead th.sortable:hover { color: var(--blue); }
thead th[aria-sort] { color: var(--blue); }
thead th .caret { opacity: 0.7; }

tbody td {
  padding: 0.5rem 0.6rem; text-align: right; white-space: nowrap;
  border-bottom: 1px solid color-mix(in oklch, var(--n4) 45%, transparent);
}
tbody td:nth-child(-n+2) { text-align: left; }
tbody tr { transition: background 150ms var(--ease); }
tbody tr.row:hover { background: var(--n1); }

.rank { font-family: var(--mono); color: var(--n6); font-size: 0.8125rem; }
.rankcell { display: flex; flex-direction: column; gap: 0.1rem; }
.rankline { display: flex; align-items: center; gap: 0.35rem; }
/* Points behind the leader - the thing a rank number alone doesn't say. */
.gap { font-family: var(--mono); font-size: 0.6875rem; color: var(--n5); }
.who { display: flex; flex-direction: column; line-height: 1.3; }
.who .name { color: var(--n8); }
.who .team { font-size: 0.75rem; color: var(--n6); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.dim { color: var(--n6); }
.faint { color: var(--n4); }
/* Orange is this palette's numeral hue. It goes on the gameweek score and
   nothing else in the table: that is the figure people refresh to watch,
   and it is what the flash below animates, so hue and motion point at the
   same number. Total is the anchor rather than the drama - brightest
   neutral, so it still reads first among the plain columns without
   competing with the live score at either end of the row. */
.gwpts { font-weight: 500; color: var(--orange); }
.total { color: var(--n8); font-weight: 500; }
.hit { color: var(--rose); }

/* A live score changing between loads gets one green pulse - motion that
   depicts the thing that actually happened, rather than decoration. */
@keyframes flashpulse {
  from { background: color-mix(in oklch, var(--green) 35%, transparent); }
  to { background: transparent; }
}
.gwpts.flash { animation: flashpulse 1.8s var(--ease) both; border-radius: 3px; padding: 0 0.25rem; margin: 0 -0.25rem; }

/* Rank movement. Green/rose are 4.6 ΔE apart for a deuteranope, which is
   below even the conditional floor — so the arrow is load-bearing, not
   decoration, and the colour is a second channel on top of it. */
.move { font-family: var(--mono); font-size: 0.75rem; }
.move.up { color: var(--green); }
.move.down { color: var(--rose); }
.move.flat { color: var(--n4); }

/* ── Table drama ───────────────────────────────────────────────────────
   A league table's whole point is the gap between people. The leader gets
   this site's one gilt edge - a real table's convention, not a trophy
   emoji - as an inset shadow so it costs no layout. */
tbody tr.row.leader { box-shadow: inset 3px 0 0 0 var(--gold); }
tbody tr.row.leader .rank { color: var(--gold); }

/* Chips are categorical, but four hues from this palette would not
   survive CVD. One hue, and the two-letter label does the identifying. */
.chip {
  font-family: var(--mono); font-size: 0.6875rem; font-weight: 500;
  color: var(--purple);
  border: 1px solid color-mix(in oklch, var(--purple) 35%, transparent);
  border-radius: 2px; padding: 0.1rem 0.3rem;
}

/* ── Weekly honours ───────────────────────────────────────────────────
   Two tallies, and they must not be told apart by hue alone: each badge
   carries its own word, and the season columns carry a count. Green is
   the win (success, per the palette contract); orange is the bench,
   matching the meter directly beside it in the same table.            */
.badge {
  font-family: var(--mono); font-size: 0.625rem; font-weight: 600;
  letter-spacing: 0.06em; border-radius: 2px; padding: 0.05rem 0.28rem;
  white-space: nowrap;
}
.badge.win {
  color: var(--green);
  border: 1px solid color-mix(in oklch, var(--green) 35%, transparent);
}
.badge.benchwin {
  color: var(--orange);
  border: 1px solid color-mix(in oklch, var(--orange) 35%, transparent);
}
.badges { display: inline-flex; gap: 0.3rem; margin-left: 0.4rem; vertical-align: 1px; }
.tally { display: inline-flex; align-items: center; gap: 0.35rem; justify-content: flex-end; }
.tally .n { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tally .n.zero { color: var(--n4); }

/* Season tallies, carried beside the team name - the football convention
   of stars over a crest, where the count is the honours rather than this
   week's result. One shared treatment, deliberately borderless so they
   read as annotations on the name rather than more badges competing with
   the week's ★ WIN / ▬ BENCH beside them; the glyph says which tally and
   the hue says whether it is worth having.

   Gold for wins, the same statement as the leader's gilt edge: a standing
   achievement. Rose for the bench, because most-points-benched is a tally
   of points thrown away - the palette's "went wrong" hue, the same one
   carrying hits and rank drops. Deliberately not the ▬ BENCH badge's
   orange: orange is the numeral hue now and belongs to the live score, so
   reusing it here would put the loudest colour on the page next to a name
   for the least flattering reason.                                      */
.honour {
  font-family: var(--mono); font-size: 0.6875rem; font-weight: 600;
  white-space: nowrap; margin-left: 0.45rem;
  font-variant-numeric: tabular-nums;
}
.honour + .honour { margin-left: 0.3rem; }
.honour .s { margin-left: 0.1rem; }
.honour-gw { color: var(--gold); }
.honour-bench { color: color-mix(in oklch, var(--rose) 80%, var(--n5)); }

/* ── Bench meter ───────────────────────────────────────────────────────
   Magnitude across one series: one hue, length carries the value. Thin
   mark, rounded data-end, anchored to a baseline shared by every row so
   the lengths are comparable down the column.                           */
.bench { display: flex; align-items: center; gap: 0.5rem; justify-content: flex-end; }
.bench .val { min-width: 1.75rem; text-align: right; }
.meter { width: 3.5rem; height: 5px; background: var(--n2); border-radius: 3px; overflow: hidden; flex: none; }
.meter > i { display: block; height: 100%; background: var(--orange); border-radius: 3px; }
.derived { color: var(--orange); font-size: 0.75rem; }

/* ── Transfer detail ───────────────────────────────────────────────────*/
.tf-list { display: flex; flex-wrap: wrap; gap: 0.4rem 1.25rem; font-family: var(--mono); font-size: 0.75rem; color: var(--n7); }
.tf-list .out { color: var(--n6); }
.tf-list .arrow { color: var(--n4); margin: 0 0.3rem; }
.tf-none { font-size: 0.75rem; color: var(--n6); font-style: italic; }

/* ── Manager options ──────────────────────────────────────────────────
   Inside the dialog a manager opens onto four questions, and the answer
   to each arrives with the same staggered fade+blur entrance the
   portfolio's team sheet uses for a squad appearing line by line.     */
@keyframes cardin {
  from { opacity: 0; transform: translateY(10px); filter: blur(3px); }
  to { opacity: 1; transform: none; filter: blur(0); }
}
.opt-menu { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.opt-btn {
  font-family: var(--mono); font-size: 0.75rem; font-weight: 500;
  background: var(--n2); color: var(--n7);
  border: 1px solid var(--n5); border-radius: var(--radius);
  padding: 0.45rem 0.8rem; cursor: pointer;
  animation: cardin 280ms var(--ease) both; animation-delay: calc(var(--i) * 40ms);
  transition: background 150ms var(--ease), border-color 150ms var(--ease), color 150ms var(--ease);
}
.opt-btn:hover { border-color: var(--n6); color: var(--n8); }
/* At this size a tinted background and a coloured border weren't enough to
   find the selected pill at a glance, so selection flips the fill and the
   text instead - the one inversion on the page, and unmistakable.

   The :hover half is not redundant: the generic button:hover rule above is
   (0,2,1) and would otherwise outrank a bare [aria-selected] at (0,2,0),
   repainting the selected pill as merely hovered - which is its state
   almost every time anyone looks at it, having just clicked it. */
.opt-btn[aria-selected="true"],
.opt-btn[aria-selected="true"]:hover {
  background: var(--blue); border-color: var(--blue); color: var(--n0); font-weight: 600;
}

.opt-content { margin-top: 0.9rem; }
.opt-loading, .opt-error { font-family: var(--mono); font-size: 0.8125rem; color: var(--n6); }
.opt-error { color: var(--rose); }

.squad-group { margin-bottom: 0.85rem; }
.squad-group:last-child { margin-bottom: 0; }
.squad-label {
  font-family: var(--mono); font-size: 0.625rem; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--n5); margin-bottom: 0.4rem;
}
.squad-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }

.pcard {
  display: flex; align-items: center; gap: 0.4rem;
  background: var(--n1); border: 1px solid var(--n4); border-radius: var(--radius);
  padding: 0.35rem 0.55rem; font-size: 0.8125rem;
  animation: cardin 320ms var(--ease) both; animation-delay: calc(var(--i) * 35ms);
}
.pcard.bench { opacity: 0.7; }
.pcard .pname { color: var(--n8); }
.pcard .pteam { color: var(--n6); font-size: 0.6875rem; font-family: var(--mono); }
.pcard .ppts { font-family: var(--mono); color: var(--orange); font-variant-numeric: tabular-nums; margin-left: 0.1rem; }
.pcard .ctag {
  font-family: var(--mono); font-size: 0.625rem; font-weight: 700; line-height: 1;
  color: var(--n0); background: var(--orange); border-radius: 2px; padding: 0.15rem 0.3rem;
}
.pcard .ctag.vtag { background: var(--n5); }

.fx-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.fx-dot.upcoming { background: var(--n5); }
.fx-dot.live { background: var(--green); animation: fxpulse 1.4s ease-in-out infinite; }
.fx-dot.finished, .fx-dot.none { background: var(--n3); }
/* Shallow on purpose: up to fifteen of these pulse at once in a squad, and
   a deeper trough read as twitching rather than as "live". */
@keyframes fxpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

.toplay-stats { display: flex; gap: 1.75rem; margin-bottom: 0.9rem; }
.toplay-stat {
  animation: cardin 280ms var(--ease) both; animation-delay: calc(var(--i) * 60ms);
}
.toplay-stat .n { font-family: var(--mono); font-size: 1.375rem; color: var(--n8); }
.toplay-stat .l { font-family: var(--mono); font-size: 0.625rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--n6); }

/* ── Messages ──────────────────────────────────────────────────────────
   The portfolio renders nothing when the FPL API is down, because no
   reader of a portfolio needs to know. A tool inverts that: the person
   here is trying to get an answer, and the failure is the answer.       */
.msg { border: 1px solid var(--n4); border-radius: var(--radius); padding: 1rem 1.1rem; margin-top: 1.5rem; font-size: 0.875rem; }
.msg.error { border-color: color-mix(in oklch, var(--rose) 45%, transparent); }
.msg.error .m-head { color: var(--rose); font-family: var(--mono); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; }
.msg .m-body { color: var(--n7); margin-top: 0.4rem; font-family: var(--mono); font-size: 0.8125rem; word-break: break-word; }
.msg.empty { color: var(--n6); }

.notes { margin-top: 1.25rem; font-size: 0.8125rem; color: var(--n6); display: grid; gap: 0.3rem; }
.notes b { color: var(--n7); font-weight: 500; }
.provisional { color: var(--n7); }

/* ── Legend ────────────────────────────────────────────────────────────
   Every mark here is the real thing, rendered from the same classes the
   table uses rather than drawn as a facsimile - so it stays correct when
   a colour or a glyph changes, and the eye can match it against a row
   directly. The one-line label says what the mark is; the full sentence
   lives in the tooltip, which keeps the grid scannable instead of turning
   back into the wall of prose this replaced.                            */
.legend {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
  gap: 0.15rem 1.5rem; margin-top: 0.25rem;
}
.lg-item {
  display: flex; align-items: baseline; gap: 0.6rem;
  font-size: 0.8125rem; color: var(--n6);
  padding: 0.3rem 0; cursor: help; /* the affordance for "there is more on hover" */
  border-bottom: 1px solid transparent;
  transition: color 150ms var(--ease);
}
.lg-item:hover, .lg-item:focus-visible { color: var(--n8); }
.lg-mark {
  flex: none; min-width: 5rem; display: inline-flex;
  align-items: center; gap: 0.3rem;
}
/* The leader's gilt edge is a row treatment, so it has no inline mark of
   its own - this is the only swatch in the legend that is a stand-in. */
.lg-edge {
  display: inline-block; width: 3px; height: 0.95rem;
  background: var(--gold); border-radius: 1px;
}

/* ── Tooltip ───────────────────────────────────────────────────────────
   Replaces title= everywhere a mark needs a sentence. The native attribute
   was doing the job badly: a delay you can't tune, no styling, no line
   breaks, and nothing at all on a touch screen - which meant every legend
   entry on a phone was a glyph with no explanation beside it.

   One element for the whole page, moved and refilled, rather than one per
   trigger. render() rewrites the table's innerHTML on every sort and every
   open, so anything bound per-trigger would be destroyed a dozen times a
   session; the listener sits on the document and reads data-tip off
   whatever it lands on.                                                  */
#tip {
  position: fixed; inset: auto; top: 0; left: 0; margin: 0; z-index: 60;
  width: max-content; max-width: 20rem; pointer-events: none;
  background: var(--n2); color: var(--n8);
  border: 1px solid var(--n5); border-radius: var(--radius);
  padding: 0.4rem 0.55rem;
  font-size: 0.75rem; line-height: 1.45;
  box-shadow: 0 8px 24px -8px rgb(0 0 0 / 0.7);
  opacity: 0;
  transition: opacity 120ms var(--ease), overlay 120ms allow-discrete, display 120ms allow-discrete;
}
#tip:popover-open, #tip.show { opacity: 1; }
@starting-style { #tip:popover-open { opacity: 0; } }
/* ── Toasts ────────────────────────────────────────────────────────────
   For a failure that happens while the table is already on screen. The
   in-page .msg block below is still the right answer when the panel is
   empty - a dismissible corner card must never be the only record that
   the page has nothing on it - so these two split the job by whether
   there is anything left to read.                                       */
#toaster {
  position: fixed; z-index: 70; right: 1rem; bottom: 1rem;
  width: min(23rem, calc(100vw - 2rem));
  display: flex; flex-direction: column-reverse; gap: 0.5rem;
  pointer-events: none;
}
@keyframes toastin { from { opacity: 0; transform: translateY(14px) scale(0.97); } }
@keyframes toastout { to { opacity: 0; transform: translateY(6px) scale(0.98); } }
.toast {
  pointer-events: auto;
  display: grid; grid-template-columns: 1fr auto; gap: 0 0.75rem;
  background: var(--n1); border: 1px solid var(--n5); border-radius: var(--radius);
  padding: 0.7rem 0.8rem;
  box-shadow: 0 14px 34px -14px rgb(0 0 0 / 0.85);
  animation: toastin 260ms var(--ease) both;
}
.toast.out { animation: toastout 170ms var(--ease) both; }
.toast.err { border-color: color-mix(in oklch, var(--rose) 45%, transparent); }
.t-head {
  font-family: var(--mono); font-size: 0.6875rem; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--n6);
}
.toast.err .t-head { color: var(--rose); }
.t-body { grid-column: 1; margin-top: 0.3rem; font-size: 0.8125rem; color: var(--n7); word-break: break-word; }
.t-actions { grid-column: 1 / -1; display: flex; gap: 0.4rem; margin-top: 0.6rem; }
.t-actions button { font-size: 0.75rem; padding: 0.32rem 0.65rem; }
.t-close {
  grid-row: 1; grid-column: 2; align-self: start;
  background: none; border: 0; padding: 0 0 0 0.25rem; line-height: 1;
  color: var(--n5); font-size: 0.9rem; cursor: pointer;
}
/* :not(:disabled) is not decoration - the generic button:hover rule is
   (0,2,1) and would otherwise repaint this flat button with a fill. */
.t-close:hover:not(:disabled) { background: none; color: var(--n8); }

/* ── Skeleton ──────────────────────────────────────────────────────────
   A league report is dozens of upstream calls, so the wait is real and
   the old blank panel gave no shape to it. These are the table that is
   coming, at its real geometry, so nothing jumps when the rows land.

   The pulse is staggered down the rows on the same 18ms step as the row
   entrance, so the wait and the arrival read as one gesture rather than
   two unrelated animations.                                             */
@keyframes skpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
.sk {
  display: inline-block; height: 0.6875rem; border-radius: 3px;
  background: var(--n2); vertical-align: middle;
  animation: skpulse 1.6s var(--ease) infinite;
  animation-delay: calc(var(--i, 0) * 18ms);
}
.sk.tall { height: 1.9rem; border-radius: var(--radius); }
tbody.skeleton td { border-bottom-color: color-mix(in oklch, var(--n4) 30%, transparent); }
/* A refresh that has something to keep on screen keeps it, dimmed, rather
   than replacing a full table with a full skeleton - the numbers on screen
   are a minute old, not wrong. */
.table-scroll.loading { opacity: 0.45; pointer-events: none; transition: opacity 200ms var(--ease); }

/* ── Dialog / sheet ────────────────────────────────────────────────────
   A manager used to open as a row inside the table, which meant fifteen
   player cards were laid out against a ten-column table's width instead
   of the screen's, held in place by a sticky wrapper measured in JS on
   every render. Stepping out of the table gets the full width for free
   and takes the measuring machinery with it.

   It is the native element rather than a div: showModal() carries the
   focus trap, Escape, the inert background and top-layer stacking, all of
   which a hand-rolled overlay gets subtly and invisibly wrong.

   Entry and exit are the discrete-transition idiom (@starting-style plus
   allow-discrete) rather than a class flipped from JS. Where a browser
   lacks it the dialog simply appears, which is the correct degradation:
   the animation was never the thing carrying meaning.                   */
dialog.dlg {
  border: 0; padding: 0; background: transparent; color: inherit;
  width: 100%; max-width: min(52rem, calc(100vw - 2rem));
  max-height: calc(100dvh - 4rem);
  overflow: visible;
  opacity: 0; transform: translateY(10px) scale(0.985);
  transition: opacity 220ms var(--ease), transform 220ms var(--ease),
              overlay 220ms allow-discrete, display 220ms allow-discrete;
}
dialog.dlg[open] { opacity: 1; transform: none; }
@starting-style { dialog.dlg[open] { opacity: 0; transform: translateY(10px) scale(0.985); } }

dialog.dlg::backdrop {
  background: color-mix(in oklch, var(--n0) 74%, transparent);
  backdrop-filter: blur(3px);
  opacity: 0;
  transition: opacity 220ms var(--ease), overlay 220ms allow-discrete, display 220ms allow-discrete;
}
dialog.dlg[open]::backdrop { opacity: 1; }
@starting-style { dialog.dlg[open]::backdrop { opacity: 0; } }

/* A sheet is the same element anchored to the bottom edge and entering
   along it. On a phone the manager dialog becomes one too, so there is a
   single "more, from down here" gesture on the page rather than two. */
dialog.sheet {
  margin: auto auto 0; max-width: 100%;
  max-height: 88dvh;
  transform: translateY(100%);
}
@starting-style { dialog.sheet[open] { transform: translateY(100%); } }

html.locked { overflow: hidden; }

.dlg-panel {
  display: flex; flex-direction: column;
  max-height: inherit; overflow: hidden;
  background: var(--n1);
  border: 1px solid var(--n5);
  border-radius: calc(var(--radius) * 2);
  box-shadow: 0 24px 60px -20px rgb(0 0 0 / 0.8);
}
dialog.sheet .dlg-panel {
  border-radius: calc(var(--radius) * 3) calc(var(--radius) * 3) 0 0;
  border-bottom: 0;
}
/* The grab bar is the affordance, not a control: it says which edge this
   came from. Dismissal is the backdrop, Escape and the close button. */
.sheet-grip {
  display: none;
  width: 2.25rem; height: 3px; border-radius: 3px; background: var(--n4);
  margin: 0.6rem auto 0; flex: none;
}
dialog.sheet .sheet-grip { display: block; }

.dlg-head { padding: 1rem 1.1rem 0.9rem; border-bottom: 1px solid var(--n4); flex: none; }
.dlg-id { display: flex; align-items: flex-start; gap: 0.85rem; }
.dlg-rank {
  font-family: var(--mono); font-size: 1.6rem; line-height: 1.1;
  font-variant-numeric: tabular-nums; color: var(--n6); flex: none;
}
.dlg-rank.leader { color: var(--gold); }
.dlg-titles { min-width: 0; }
.dlg-entry { font-size: 1rem; font-weight: 500; color: var(--n8); line-height: 1.3; }
.dlg-manager { font-size: 0.8125rem; color: var(--n6); }
.dlg-close {
  margin-left: auto; flex: none;
  padding: 0.3rem 0.55rem; font-size: 0.9rem; line-height: 1;
  background: transparent; border-color: var(--n4); color: var(--n6);
}
.dlg-close:hover:not(:disabled) { color: var(--n8); }
/* The row's own numbers, carried into the dialog so the squad below is
   read against the score it produced rather than in isolation. */
.dlg-stats { display: flex; flex-wrap: wrap; gap: 0.9rem 1.5rem; margin-top: 0.95rem; }
.dlg-stat .n { font-family: var(--mono); font-size: 1.05rem; color: var(--n8); font-variant-numeric: tabular-nums; line-height: 1.2; }
.dlg-stat .n.gwpts { color: var(--orange); }
.dlg-stat .n.hit { color: var(--rose); }
.dlg-stat .l { font-family: var(--mono); font-size: 0.625rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--n6); }
.dlg-body { padding: 1rem 1.1rem 1.25rem; overflow-y: auto; overscroll-behavior: contain; }

/* ── Tab indicator ─────────────────────────────────────────────────────
   The selected rule used to be an inset shadow on each button, so moving
   between views was a cut. One shared bar that travels instead makes the
   switch depict the thing it does, and it is the only element on the page
   whose position is animated rather than its opacity.                    */
.tabind {
  position: absolute; bottom: 0; left: 0; height: 2px; width: 0;
  background: var(--blue); pointer-events: none;
  transition: transform 260ms var(--ease), width 260ms var(--ease);
}
/* Before the first measurement there is nothing to slide from, so the bar
   arrives in place rather than sweeping in from the left edge. */
.tabind.init { transition: none; }

/* ── Motion ────────────────────────────────────────────────────────────
   One entrance, and what it staggers is a league table arriving row by
   row — the motion depicts its subject rather than decorating it.

   It is scoped to .fresh, which render() only sets when new data has just
   landed. render() rewrites the table's innerHTML on every sort, every row
   expand and every option tab, and without that gate each of those replayed
   a 25-row staggered entrance - half a second of wobble on interactions
   that should feel instant.                                              */
@keyframes rowin { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
tbody.fresh tr.row { animation: rowin 320ms var(--ease) both; animation-delay: calc(var(--i) * 18ms); }

/* Reorder. When the standings change, rows slide past each other rather
   than teleporting - the one piece of motion here that depicts the thing
   the whole page is about. Applied by flipRows() as a transform that is
   then released; see the JS for why it can't be a CSS transition alone. */
tbody tr.row.sliding { transition: transform 520ms var(--ease); }
/* ── Phone ─────────────────────────────────────────────────────────────
   The controls were a wrapping flex row with 8.5rem minimums, which on a
   390px screen collapsed into cramped half-width dropdowns. They become a
   two-column grid instead, with the league id, sort and view rows spanning
   the full width.

   The important number here is the 16px font on inputs and selects. Below
   16px, iOS Safari zooms the whole page in when a control takes focus and
   does not zoom back out — the single most common cause of a form feeling
   broken on an iPhone. Everything also gets a 44px minimum height, which
   is Apple's minimum touch target; the old 0.5rem padding gave 34px.     */
/* The filters toggle only exists as a mobile affordance — on desktop the
   form is always visible and this stays display:none. */
.filters-toggle { display: none; }

@media (max-width: 640px) {
  .wrap { padding: 1.25rem 0.875rem 3rem; }

  /* The form used to occupy the entire first screen, pushing the table
     below the fold on every load. It moves into a bottom sheet instead
     (see placeControls), so results are visible immediately and this
     button is the way back in to change league/gameweek/sort.

     A sheet rather than the in-place collapse it replaces: the form is
     eight controls tall, so expanding it inline pushed the table off
     screen again and left the page scrolled to nothing. */
  .filters-toggle {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; margin-top: 1.25rem;
    font-family: var(--mono); font-size: 0.75rem; font-weight: 500;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--n7);
    background: var(--n1); border: 1px solid var(--n5); border-radius: var(--radius);
    padding: 0.65rem 0.875rem; min-height: 2.75rem;
  }
  .filters-toggle .ft-caret { color: var(--n5); transition: transform 200ms var(--ease); }
  .filters-toggle[aria-expanded="true"] .ft-caret { transform: rotate(180deg); }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem 0.625rem;
    align-items: end;
    margin: 0;
  }
  .f-league, .f-sort, .f-month, .f-view, #go { grid-column: 1 / -1; }

  /* The manager dialog becomes a sheet too, so both "more, from down here"
     gestures on a phone are the same gesture. */
  dialog.dlg { max-width: 100%; margin: auto auto 0; max-height: 88dvh; transform: translateY(100%); }
  @starting-style { dialog.dlg[open] { transform: translateY(100%); } }
  .dlg-panel { border-radius: calc(var(--radius) * 3) calc(var(--radius) * 3) 0 0; border-bottom: 0; }
  .dlg-head, .dlg-body { padding-left: 0.875rem; padding-right: 0.875rem; }
  .sheet-grip { display: block; }
  .dlg-stats { gap: 0.75rem 1.1rem; }

  /* Full-bleed and above the home indicator, and never wider than the
     screen - the toaster's fixed right inset would otherwise put an
     action button under a thumb reaching for the scroll edge. */
  #toaster { right: 0.75rem; left: 0.75rem; bottom: 0.75rem; width: auto; }
  .toggle button { font-size: 0.8125rem; padding: 0.5rem 0.3rem; }

  input[type="number"], select, button {
    font-size: 1rem;              /* 16px: below this iOS zooms on focus */
    min-height: 2.75rem;          /* 44px touch target */
    min-width: 0;
    width: 100%;
    padding: 0.5rem 0.7rem;
  }
  .field label, .field .lbl { font-size: 0.75rem; }

  .sortrow select { min-width: 0; flex: 1; }
  .sortrow button { width: 2.75rem; min-width: 2.75rem; flex: none; padding: 0; }

  /* Otherwise inherits the generic mobile button rule's width:100%, which
     as a flex-basis forces every option onto its own full-width row. */
  .opt-btn { width: auto; min-height: 2.375rem; padding: 0.4rem 0.65rem; }
  .dlg-close, .t-close, .t-actions button { width: auto; min-width: 0; }
  .dlg-close { min-height: 2.25rem; }

  .toggle { width: 100%; }
  .toggle button { flex: 1; }

  /* The table keeps all ten columns and scrolls sideways rather than
     hiding data; tightening the cells buys a couple of columns per screen. */
  table { font-size: 0.8125rem; }
  tbody td, thead th { padding-left: 0.45rem; padding-right: 0.45rem; }
  .strip { font-size: 0.6875rem; }

  /* Rank and manager pin to the left edge while the rest of the row scrolls
     underneath, so a name never disappears off-screen while you're reading
     its numbers - the single biggest complaint with a wide sideways table. */
  .table-scroll { position: relative; }
  thead th:nth-child(1), thead th:nth-child(2),
  tbody td:nth-child(1), tbody td:nth-child(2) {
    position: sticky; background: var(--n0); z-index: 1;
  }
  thead th:nth-child(1), tbody td:nth-child(1) { left: 0; min-width: 3rem; }
  thead th:nth-child(2), tbody td:nth-child(2) { left: 3rem; box-shadow: 1px 0 0 var(--n4); }
  tbody tr.row:hover td:nth-child(1), tbody tr.row:hover td:nth-child(2) { background: var(--n1); }

  /* A right-edge shadow signals there is more to scroll to; a gradient into
     the matching background colour would be invisible here, so this darkens
     the edge directly instead. It clears once scrolled to the end. */
  .table-scroll.has-overflow {
    box-shadow: inset -1.75rem 0 1rem -1rem rgba(0, 0, 0, 0.6);
    transition: box-shadow 150ms var(--ease);
  }
  .table-scroll.has-overflow.at-end { box-shadow: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<a class="skip" href="#results">Skip to results</a>
<div class="wrap">

  <header class="strip" id="strip">
    <span class="dot stale" id="dot" role="img" aria-label="status"></span>
    <span class="subject" id="subject">fpl-league-rank</span>
    <span class="dash">—</span>
    <span class="state" id="state">idle</span>
    <span class="right" id="count"></span>
  </header>

  <button type="button" class="filters-toggle" id="filters-toggle" aria-expanded="true" aria-controls="controls">
    <span>Filters</span><span class="ft-caret" aria-hidden="true">▾</span>
  </button>

  <div id="controls-slot">
  <form class="controls" id="controls">
    <div class="field f-league">
      <label for="league">League ID</label>
      <input type="number" id="league" name="league" min="1" placeholder="580906" required>
    </div>
    <div class="field f-gw">
      <label for="gw">Gameweek</label>
      <select id="gw" name="gw"><option value="0">Current</option></select>
    </div>
    <div class="field f-max" id="max-field">
      <label for="max">Managers</label>
      <select id="max" name="max">
        <option value="50">First 50</option>
        <option value="100">First 100</option>
        <option value="0">All</option>
      </select>
    </div>
    <div class="field f-month" id="month-field">
      <label for="month">Month</label>
      <select id="month"></select>
    </div>
    <div class="field f-sort" id="sort-field">
      <label for="sort">Sort by</label>
      <div class="sortrow">
        <select id="sort"></select>
        <button type="button" id="sortdir" data-tip="Reverse the sort">↓</button>
      </div>
    </div>
    <div class="field f-view">
      <span class="lbl" id="view-label">View</span>
      <div class="toggle" role="tablist" id="view-tabs" aria-labelledby="view-label">
        <button type="button" role="tab" id="view-gw" aria-selected="true" aria-controls="panel">Gameweek</button>
        <button type="button" role="tab" id="view-season" aria-selected="false" aria-controls="panel" tabindex="-1">Season</button>
        <button type="button" role="tab" id="view-monthly" aria-selected="false" aria-controls="panel" tabindex="-1">Monthly</button>
        <span class="tabind init" id="view-ind" aria-hidden="true"></span>
      </div>
    </div>
    <button type="submit" id="go" data-tip="Fetch the latest scores from the FPL API">Refresh</button>
  </form>
  </div>

  <main id="results">
    <div id="panel" role="tabpanel" aria-labelledby="view-gw" tabindex="0"></div>
  </main>
</div>

<!-- On a phone the form lives in here instead; placeControls() moves the one
     element between the two homes rather than keeping two copies in sync. -->
<dialog class="dlg sheet" id="filters-sheet" aria-labelledby="filters-title">
  <div class="dlg-panel">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="dlg-head">
      <div class="dlg-id">
        <div class="dlg-titles">
          <div class="dlg-entry" id="filters-title">Filters</div>
          <div class="dlg-manager">League, gameweek, sort and view</div>
        </div>
        <button type="button" class="dlg-close" data-close aria-label="Close filters">✕</button>
      </div>
    </div>
    <div class="dlg-body" id="sheet-body"></div>
  </div>
</dialog>

<dialog class="dlg" id="manager-dialog" aria-labelledby="mgr-entry">
  <div class="dlg-panel" id="mgr-panel"></div>
</dialog>

<div id="toaster" role="region" aria-live="polite" aria-label="Notifications"></div>
<div id="tip" popover="manual" role="tooltip"></div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
// The league this tool is for. Deliberately the only fallback: an earlier
// version also remembered the last league in localStorage, which meant one
// mistyped id (58006 is a real 2-manager league, so it loaded fine and was
// saved) silently replaced the default on every later visit with nothing on
// screen to explain it. An explicit ?league= still overrides.
const DEFAULT_LEAGUE = 580906;

const state = {
  view: "gw", sort: { key: "leagueRank", dir: 1 }, report: null,
  // The manager whose dialog is open, or null. One at a time: the dialog is
  // modal, which is the whole reason the squad gets the width it needs.
  dialog: null,
  // Which option (transfers/team/captain/toplay) that manager last had
  // showing - remembered per manager, so reopening a row lands where you
  // left it - and the /api/team responses backing team/captain/toplay,
  // cached by "entryId:gw" so switching tabs back and forth doesn't refetch.
  tab: new Map(), teamCache: new Map(),
  // entryIds whose GW score changed since the last load - set just before
  // the one render() that should flash them, then cleared, so re-sorting or
  // reopening a row afterwards doesn't replay the animation.
  flashed: null,
};

// ── status strip ──────────────────────────────────────────────────────
function setStatus(kind, subject, text, right) {
  $("dot").className = "dot" + (kind === "ok" ? "" : kind === "err" ? " err" : " stale");
  $("subject").textContent = subject;
  $("state").textContent = text;
  $("count").textContent = right || "";
}

// Only meaningful before a deadline - once it's passed there's nothing left
// to count down to, so this returns null rather than "0m to deadline".
function deadlineCountdown(iso) {
  const ms = new Date(iso) - Date.now();
  if (!isFinite(ms) || ms <= 0) return null;
  const totalMin = Math.floor(ms / 60000);
  const days = Math.floor(totalMin / 1440);
  const hours = Math.floor((totalMin % 1440) / 60);
  const mins = totalMin % 60;
  if (days > 0) return `${days}d ${hours}h to deadline`;
  if (hours > 0) return `${hours}h ${mins}m to deadline`;
  return `${mins}m to deadline`;
}

// ── tooltip ───────────────────────────────────────────────────────────
// One element for the page. Everything with data-tip is a trigger, found
// by delegation rather than by binding, because render() destroys and
// rebuilds every trigger inside the table on each sort and each open.
const TIP_DELAY = 160;
let tipTimer = 0, tipFor = null;

function tipPlace(target) {
  const el = $("tip");
  const r = target.getBoundingClientRect();
  const t = el.getBoundingClientRect();
  const M = 8;
  // Above by preference: the trigger is usually a table cell with the row's
  // other numbers to its right, and a tip below would cover the next row.
  let top = r.top - t.height - 6;
  if (top < M) top = r.bottom + 6;
  let left = r.left + r.width / 2 - t.width / 2;
  left = Math.max(M, Math.min(left, innerWidth - t.width - M));
  el.style.left = Math.round(left) + "px";
  el.style.top = Math.round(top) + "px";
}

// popover() where it exists, a class where it doesn't - the class path
// stacks below a dialog, which is the correct amount of wrong for a browser
// that is already several years behind.
function tipToggle(el, show) {
  if (!el.showPopover) return el.classList.toggle("show", show);
  try { show ? el.showPopover() : el.hidePopover(); } catch {}
}

function tipShow(target) {
  const text = target.getAttribute("data-tip");
  if (!text) return;
  const el = $("tip");
  tipFor = target;
  el.textContent = text;
  tipToggle(el, true);
  target.setAttribute("aria-describedby", "tip");
  // Measured after the text is in, so the box is its final size before it
  // is positioned - otherwise the first show lands half a line off.
  tipPlace(target);
}

function tipHide() {
  clearTimeout(tipTimer);
  if (tipFor) { tipFor.removeAttribute("aria-describedby"); tipFor = null; }
  tipToggle($("tip"), false);
}

function tipEnter(e) {
  const t = e.target.closest && e.target.closest("[data-tip]");
  if (!t || t === tipFor) return;
  tipHide();
  // Keyboard focus is deliberate, so it gets no delay; a pointer sweeping
  // across a table of ten tooltipped cells needs one.
  if (e.type === "focusin") return tipShow(t);
  tipTimer = setTimeout(() => tipShow(t), TIP_DELAY);
}

document.addEventListener("pointerover", tipEnter);
document.addEventListener("focusin", tipEnter);
document.addEventListener("pointerout", (e) => {
  if (tipFor && !(e.relatedTarget && tipFor.contains(e.relatedTarget))) tipHide();
});
document.addEventListener("focusout", tipHide);
document.addEventListener("pointerdown", tipHide);
// Fixed positioning is measured against the viewport, so any scroll leaves
// the tip behind its trigger. Cheaper to drop it than to track it.
addEventListener("scroll", tipHide, true);
addEventListener("resize", tipHide);
addEventListener("keydown", (e) => { if (e.key === "Escape") tipHide(); });

// ── toasts ────────────────────────────────────────────────────────────
// For a failure that arrives while there is still a table to read. When the
// panel is empty the in-page message is used instead: a card you can dismiss
// must never be the only thing saying the page has nothing on it.
const MAX_TOASTS = 3;
const liveToasts = new Map(); // key -> element, so a repeat replaces rather than stacks

function dismissToast(el) {
  if (!el.isConnected || el.classList.contains("out")) return;
  for (const [k, v] of liveToasts) if (v === el) liveToasts.delete(k);
  el.classList.add("out");
  el.addEventListener("animationend", () => el.remove(), { once: true });
  setTimeout(() => el.remove(), 400); // reduced motion kills the animation
}

function toast({ title, body, kind, actions, duration, key }) {
  const host = $("toaster");
  if (key && liveToasts.has(key)) dismissToast(liveToasts.get(key));

  const el = document.createElement("div");
  el.className = "toast" + (kind === "err" ? " err" : "");
  el.setAttribute("role", kind === "err" ? "alert" : "status");

  const head = document.createElement("div");
  head.className = "t-head";
  head.textContent = title;

  const close = document.createElement("button");
  close.type = "button";
  close.className = "t-close";
  close.setAttribute("aria-label", "Dismiss");
  close.textContent = "✕";
  close.addEventListener("click", () => dismissToast(el));

  el.append(head, close);
  if (body) {
    const b = document.createElement("div");
    b.className = "t-body";
    b.textContent = body;
    el.append(b);
  }
  if (actions && actions.length) {
    const bar = document.createElement("div");
    bar.className = "t-actions";
    for (const a of actions) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = a.label;
      btn.addEventListener("click", () => { dismissToast(el); a.run(); });
      bar.append(btn);
    }
    el.append(bar);
  }

  host.append(el);
  if (key) liveToasts.set(key, el);
  while (host.children.length > MAX_TOASTS) dismissToast(host.firstElementChild);
  // An error has no timer: it stays until it is read and dismissed.
  if (duration) setTimeout(() => dismissToast(el), duration);
  return el;
}

// ── dialogs ───────────────────────────────────────────────────────────
// Native <dialog>, so the focus trap, Escape, the inert background and the
// top layer come from the platform rather than from code here that would
// get one of them subtly wrong.
function openDialog(dlg) {
  if (dlg.open) return;
  tipHide();
  dlg.showModal();
  document.documentElement.classList.add("locked");
}

function closeDialog(dlg) {
  if (dlg.open) dlg.close();
}

for (const dlg of document.querySelectorAll("dialog.dlg")) {
  // A click that lands on the dialog element itself landed on the backdrop:
  // the panel inside covers every pixel of the box.
  dlg.addEventListener("click", (e) => { if (e.target === dlg) closeDialog(dlg); });
  dlg.addEventListener("close", () => {
    if (!document.querySelector("dialog.dlg[open]")) {
      document.documentElement.classList.remove("locked");
    }
  });
}
document.addEventListener("click", (e) => {
  const btn = e.target.closest && e.target.closest("[data-close]");
  if (btn) closeDialog(btn.closest("dialog"));
});

// ── tabs ──────────────────────────────────────────────────────────────
// Roving tabindex: one stop for the whole set, arrows to move within it.
// Activation follows focus, which is what a tab set that only re-renders
// what is already loaded should do.
function wireTabs(list, onSelect) {
  const tabs = [...list.querySelectorAll('[role="tab"]')];
  const pick = (tab) => {
    if (tab.getAttribute("aria-selected") === "true") return;
    onSelect(tab);
  };
  tabs.forEach((tab, i) => {
    tab.addEventListener("click", () => pick(tab));
    tab.addEventListener("keydown", (e) => {
      const step = { ArrowRight: 1, ArrowLeft: -1, Home: -Infinity, End: Infinity }[e.key];
      if (step === undefined) return;
      e.preventDefault();
      const next = tabs[step === -Infinity ? 0 : step === Infinity ? tabs.length - 1
        : (i + step + tabs.length) % tabs.length];
      next.focus();
      pick(next);
    });
  });
}

// The travelling bar under the view tabs. Measured rather than declared,
// because the three labels are different widths and the set reflows into a
// full-width row on a phone.
function moveIndicator(list, instant) {
  const ind = list.querySelector(".tabind");
  const sel = list.querySelector('[role="tab"][aria-selected="true"]');
  if (!ind || !sel || !sel.offsetWidth) return;
  if (instant) ind.classList.add("init");
  ind.style.width = sel.offsetWidth + "px";
  ind.style.transform = `translateX(${sel.offsetLeft}px)`;
  if (instant) requestAnimationFrame(() => ind.classList.remove("init"));
}

// ── skeleton ──────────────────────────────────────────────────────────
// The shape of the table that is coming, at its real geometry, so nothing
// jumps when the rows land. Widths vary per cell on a fixed rule rather
// than at random: a fresh set of widths on every re-render would read as
// content changing rather than as content still loading.
const SK_ROWS = 12;
const skJitter = (i, j) => 0.75 + ((i * 7 + j * 13) % 5) * 0.1;

function skBar(w, i) { return `<span class="sk" style="width:${w}rem;--i:${i}"></span>`; }

function skeletonTable(view) {
  const heads = view === "monthly"
    ? [{ label: "#" }, { label: "Team" }, { label: "Points" }]
    : columnsFor(view);
  const head = heads.map((c) => `<th scope="col">${esc(c.label)}</th>`).join("");
  const body = Array.from({ length: SK_ROWS }, (_, i) =>
    `<tr>${heads.map((c, j) => {
      if (j === 0) return `<td>${skBar(1.1, i)}</td>`;
      if (j === 1) return `<td><span class="who">${skBar(7 * skJitter(i, j), i)}${skBar(4.5 * skJitter(i, j + 1), i)}</span></td>`;
      return `<td>${skBar(2 * skJitter(i, j), i)}</td>`;
    }).join("")}</tr>`).join("");
  return `<div class="table-scroll"><table><thead><tr>${head}</tr></thead>
    <tbody class="skeleton">${body}</tbody></table></div>`;
}

// The squad behind an option tab is one request, so its wait gets the same
// treatment at the shape of the thing being fetched.
function skeletonSquad() {
  return ["GKP", "DEF", "MID", "FWD"].map((pos, g) => `
    <div class="squad-group"><div class="squad-label">${pos}</div><div class="squad-row">${
      Array.from({ length: [1, 4, 4, 2][g] }, (_, i) =>
        `<span class="sk tall" style="width:${7 * skJitter(g, i)}rem;--i:${g * 4 + i}"></span>`).join("")
    }</div></div>`).join("");
}

// ── formatting ────────────────────────────────────────────────────────
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function movement(rank, lastRank) {
  if (!lastRank || !rank || lastRank === rank) return '<span class="move flat" aria-hidden="true">·</span>';
  const d = lastRank - rank;
  // The glyph carries the meaning; colour is the second channel only.
  return d > 0
    ? `<span class="move up">↑${d}</span>`
    : `<span class="move down">↓${-d}</span>`;
}

function meter(value, max) {
  const pct = max > 0 ? Math.round((value / max) * 100) : 0;
  return `<span class="meter" aria-hidden="true"><i style="width:${pct}%"></i></span>`;
}

// The rank number alone says a position; it doesn't say the margin. Every
// row but the leader's gets how many points behind they are - the number
// that actually carries a league table's stakes.
function rankCell(r, ctx, extra) {
  const gap = r.leagueRank === 1 || ctx.leaderTotal == null
    ? ""
    : `<span class="gap">−${ctx.leaderTotal - r.total}</span>`;
  return `<span class="rankcell"><span class="rankline"><span class="rank">${r.leagueRank}</span>${extra ? " " + extra : ""}</span>${gap}</span>`;
}

// ── column definitions ────────────────────────────────────────────────
const gwCols = [
  { key: "leagueRank", label: "#", sortLabel: "League rank", cell: (r, ctx) => rankCell(r, ctx, movement(r.leagueRank, r.lastRank)) },
  { key: "manager", label: "Team", cell: (r) =>
      `<span class="who"><span class="name">${esc(r.entry)}${weekBadges(r)}</span><span class="team">${esc(r.manager)}</span></span>` },
  { key: "netPoints", label: "GW", sortLabel: "GW points", num: true, cell: (r) => r.played
      ? `<span class="num gwpts${state.flashed && state.flashed.has(r.entryId) ? " flash" : ""}">${r.netPoints}</span>`
      : '<span class="faint">—</span>',
    title: (r) => r.played ? `${r.grossPoints} scored${r.hit ? ` − ${r.hit} hit` : ""} = ${r.netPoints}` : "not in this gameweek" },
  { key: "hit", label: "Hit", num: true, cell: (r) => r.hit ? `<span class="num hit">−${r.hit}</span>` : '<span class="faint">·</span>' },
  { key: "bench", label: "Bench", num: true, cell: (r) => r.played
      ? `<span class="num val">${r.bench}</span>${r.benchDerived ? '<span class="derived" data-tip="Bench Boost week: the API reports 0, so this is recomputed from picks + live points">*</span>' : ""}`
      : '<span class="faint">—</span>' },
  { key: "chip", label: "Chip", cell: (r) => r.chip ? `<span class="chip">${esc(r.chip)}</span>` : '<span class="faint">·</span>' },
  { key: "transfers", label: "TF", sortLabel: "Transfers", num: true, cell: (r) => r.transfers ? `<span class="num dim">${r.transfers}</span>` : '<span class="faint">·</span>' },
  { key: "captain", label: "Captain", cell: (r) => r.captain ? `<span class="dim">${esc(r.captain)}</span>` : '<span class="faint">—</span>' },
  { key: "toPlay", label: "To play", num: true, cell: (r) => r.played
      ? `<span class="num${r.toPlay ? "" : " dim"}">${r.toPlay}</span>`
      : '<span class="faint">—</span>',
    title: (r) => r.played ? `${r.toPlay} yet to play · ${r.playingNow} playing now · ${r.finishedPlaying} finished (of ${r.squadCount})` : "not in this gameweek" },
  { key: "total", label: "Total", num: true, cell: (r) => `<span class="num total">${r.total}</span>` },
];

const seasonCols = [
  { key: "leagueRank", label: "#", sortLabel: "League rank", cell: (r, ctx) => rankCell(r, ctx) },
  { key: "manager", label: "Team", cell: (r) => `<span class="who"><span class="name">${esc(r.entry)}</span><span class="team">${esc(r.manager)}</span></span>` },
  { key: "total", label: "Total", num: true, cell: (r) => `<span class="num gwpts">${r.total}</span>` },
  { key: "gwWins", label: "Wins", sortLabel: "Gameweek wins", num: true, cell: (r) =>
      seasonTally(r.gwWins, "win", "★", r.gwWinWeeks && r.gwWinWeeks.map((w) => "GW" + w), "Gameweek wins:") },
  { key: "monthWins", label: "Months", sortLabel: "Month wins", num: true, cell: (r) =>
      seasonTally(r.monthWins, "win", "◆", r.monthWinNames, "Months won:") },
  { key: "benchTotal", label: "Benched", num: true, cell: (r, ctx) => `<span class="bench">${meter(r.benchTotal, ctx.maxBench)}<span class="num val">${r.benchTotal}</span></span>` },
  { key: "hitsTotal", label: "Hits", num: true, cell: (r) => r.hitsTotal ? `<span class="num hit">−${r.hitsTotal}</span>` : '<span class="faint">·</span>' },
  { key: "transfersTotal", label: "TF", sortLabel: "Transfers", num: true, cell: (r) => `<span class="num dim">${r.transfersTotal}</span>` },
  { key: "bestGwPoints", label: "Best GW", num: true, cell: (r) => r.bestGw ? `<span class="num">${r.bestGwPoints}</span> <span class="dim">GW${r.bestGw}</span>` : '<span class="faint">—</span>' },
  { key: "benchWins", label: "Bench wins", sortLabel: "Bench wins", num: true, cell: (r) =>
      seasonTally(r.benchWins, "benchwin", "▬", r.benchWinWeeks && r.benchWinWeeks.map((w) => "GW" + w), "Bench wins:") },
  { key: "chips", label: "Chips used", nosort: true, cell: (r) => (r.chipsUsed && r.chipsUsed.length)
      ? r.chipsUsed.map((c) => `<span class="chip">${esc(chipLabel(c.name))}<span class="dim"> ${c.event}</span></span>`).join(" ")
      : '<span class="faint">·</span>' },
];

// Rank columns sort ascending (1 is best); every other column is a magnitude
// where the interesting end is the top. One definition, used by both the
// dropdown and the column headers.
function defaultDir(key) {
  return key === "leagueRank" ? 1 : -1;
}

function setSort(key) {
  state.sort = key === state.sort.key
    ? { key, dir: -state.sort.dir }
    : { key, dir: defaultDir(key) };
  render();
}

function columnsFor(view) {
  return view === "season" ? seasonCols : gwCols;
}

// Rebuilds the dropdown when the view changes, since the two views expose
// different columns. Keeps the current key if it exists in the new view.
function fillSortOptions() {
  const cols = columnsFor(state.view).filter((c) => !c.nosort);
  if (!cols.some((c) => c.key === state.sort.key)) {
    state.sort = { key: "leagueRank", dir: 1 };
  }
  $("sort").innerHTML = cols
    .map((c) => `<option value="${c.key}">${esc(c.sortLabel || c.label)}</option>`)
    .join("");
  $("sort").value = state.sort.key;
}

// Ties are shared, so both badges can appear on more than one row in a week.
function weekBadges(r) {
  const b = [];
  if (r.wonGw) b.push('<span class="badge win" data-tip="Highest score in this gameweek">★ WIN</span>');
  if (r.wonBench) b.push('<span class="badge benchwin" data-tip="Most points left on the bench this gameweek">▬ BENCH</span>');
  return (b.length ? `<span class="badges">${b.join("")}</span>` : "") + honours(r);
}

// Season tallies beside the team name. Always glyph plus numeral, never
// repeated glyphs: a lone ★ reads as decoration rather than as a count of
// one, and a row of them sits badly next to the ★ WIN badge a current
// winner already carries.
function honours(r) {
  return tally("gw", "★", r.gwWins, r.gwWinWeeks, "gameweek win")
       + tally("bench", "▬", r.benchWins, r.benchWinWeeks, "bench win");
}

function tally(kind, glyph, n, weeks, noun) {
  if (!n) return "";
  const list = (weeks || []).map((w) => "GW" + w).join(", ");
  const label = `${n} ${noun}${n === 1 ? "" : "s"} this season${list ? ` — ${list}` : ""}`;
  return `<span class="honour honour-${kind}" data-tip="${esc(label)}">${glyph}<span class="s">${n}</span></span>`;
}

function seasonTally(n, cls, glyph, labels, verb) {
  if (!n) return '<span class="tally"><span class="n zero">·</span></span>';
  const t = `${verb} ${(labels || []).join(", ")}`;
  return `<span class="tally" data-tip="${esc(t)}"><span class="badge ${cls}">${glyph}</span><span class="n">${n}</span></span>`;
}

function chipLabel(n) {
  return { wildcard: "WC", freehit: "FH", bboost: "BB", "3xc": "TC" }[n] || n;
}

// Where every row sits right now, keyed by entry id. Captured before the
// table is rewritten so flipRows() can work out what moved.
function rowPositions() {
  const map = new Map();
  $("panel").querySelectorAll("tr.row[data-entry]").forEach((tr) => {
    map.set(tr.dataset.entry, tr.getBoundingClientRect().top);
  });
  return map;
}

// FLIP: the rows are already in their final places by the time this runs,
// so each one is thrown back to where it used to be with an instant
// transform, then released on the next frame with the transition switched
// on - which the browser renders as a slide from old position to new.
// A plain CSS transition can't do this: the elements are destroyed and
// recreated by innerHTML, so there is no continuous element to animate.
function flipRows(before) {
  if (!before.size || prefersReducedMotion()) return;
  const moved = [];
  $("panel").querySelectorAll("tr.row[data-entry]").forEach((tr) => {
    const was = before.get(tr.dataset.entry);
    if (was == null) return;
    const delta = was - tr.getBoundingClientRect().top;
    if (!delta) return;
    tr.style.transform = `translateY(${delta}px)`;
    moved.push(tr);
  });
  if (!moved.length) return;
  requestAnimationFrame(() => {
    for (const tr of moved) {
      tr.classList.add("sliding");
      tr.style.transform = "";
    }
    // Drop the transition once it has played, so a later render that sets
    // a transform for a fresh FLIP isn't animated from this one's leftovers.
    setTimeout(() => {
      for (const tr of moved) tr.classList.remove("sliding");
    }, 560);
  });
}

function prefersReducedMotion() {
  return matchMedia("(prefers-reduced-motion: reduce)").matches;
}

// ── render ────────────────────────────────────────────────────────────
// fresh marks a render that follows new data, which is the only one that
// should replay the staggered row entrance.
function render(fresh) {
  const rep = state.report;
  if (!rep) return;
  // The tip's trigger is about to be replaced by innerHTML below, and a tip
  // left pointing at a detached node never hides.
  tipHide();

  const showSortRow = state.view !== "monthly";
  $("sort-field").style.display = showSortRow ? "" : "none";
  $("max-field").style.display = state.view === "gw" ? "" : "none";
  $("month-field").style.display = state.view === "monthly" ? "" : "none";

  if (state.view === "monthly") { fillMonthOptions(rep); renderMonthly(rep); return; }

  const season = state.view === "season";
  const rows = [...(season ? rep.season : rep.gameweek)];
  const cols = columnsFor(state.view);
  const benchKey = season ? "benchTotal" : "bench";
  const ctx = {
    maxBench: Math.max(1, ...rows.map((r) => r[benchKey] || 0)),
    leaderTotal: rows.length ? Math.max(...rows.map((r) => r.total)) : null,
  };

  const { key, dir } = state.sort;
  rows.sort((a, b) => {
    const av = a[key], bv = b[key];
    if (typeof av === "string") return dir * av.localeCompare(bv);
    return dir * ((av ?? -1) - (bv ?? -1));
  });

  const head = cols.map((c) => {
    if (c.nosort) return `<th scope="col">${esc(c.label)}</th>`;
    const active = c.key === key;
    const caret = active ? `<span class="caret">${dir === 1 ? "↑" : "↓"}</span>` : "";
    const sortAttr = active ? ` aria-sort="${dir === 1 ? "ascending" : "descending"}"` : "";
    return `<th scope="col" class="sortable" data-key="${c.key}" tabindex="0" role="button"${sortAttr}>${esc(c.label)} ${caret}</th>`;
  }).join("");

  const body = rows.map((r, i) => {
    const cells = cols.map((c) => {
      const t = c.title ? ` data-tip="${esc(c.title(r))}"` : "";
      return `<td${t}>${c.cell(r, ctx)}</td>`;
    }).join("");
    const rowClass = `row${r.leagueRank === 1 ? " leader" : ""}`;
    return `<tr class="${rowClass}" style="--i:${Math.min(i, 30)}" data-entry="${r.entryId}" tabindex="0" role="button" aria-haspopup="dialog">${cells}</tr>`;
  }).join("");

  $("sort").value = key;
  $("sortdir").textContent = dir === 1 ? "↑" : "↓";
  $("sortdir").setAttribute("aria-label", dir === 1 ? "Ascending, click to reverse" : "Descending, click to reverse");

  const label = season ? `season to ${esc(rep.event.name)}` : esc(rep.event.name);

  const before = rowPositions();
  $("panel").innerHTML = `
    <h2 class="eyebrow">${label}</h2>
    ${rep.provisional && !season ? '<p class="provisional">This gameweek is not finalised — bonus, gameweek ranks and bench points can still move.</p>' : ""}
    <div class="table-scroll"><table><thead><tr>${head}</tr></thead><tbody${fresh ? ' class="fresh"' : ""}>${body}</tbody></table></div>
    ${notes(state.view)}`;
  flipRows(before);

  $("panel").querySelectorAll("th.sortable").forEach((th) => {
    const act = () => setSort(th.dataset.key);
    th.addEventListener("click", act);
    th.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); } });
  });

  wireRows();
  updateScrollHint();
}

// Every row in every view is the same thing: the way into one manager.
function wireRows() {
  $("panel").querySelectorAll("tr.row[data-entry]").forEach((tr) => {
    const act = () => openManager(Number(tr.dataset.entry));
    tr.addEventListener("click", act);
    tr.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); }
    });
  });
}

// Phases arrive in calendar order (see monthlyPhases in fpl/report.go), so the
// last one is the most recent — the natural default when the tab is opened.
function fillMonthOptions(rep) {
  const phases = rep.monthly || [];
  if (!phases.some((p) => p.name === state.month)) {
    state.month = phases.length ? phases[phases.length - 1].name : null;
  }
  $("month").innerHTML = phases.map((p) => `<option value="${esc(p.name)}">${esc(p.name)}</option>`).join("");
  $("month").value = state.month || "";
}

function renderMonthly(rep) {
  const phases = rep.monthly || [];
  if (!phases.length) {
    $("panel").innerHTML = `<h2 class="eyebrow">monthly standings</h2><p class="tf-none">No month has started yet.</p>`;
    return;
  }
  const ph = currentPhase();

  const leaderPoints = ph.standings.length ? ph.standings[0].points : 0;
  const rows = ph.standings.map((r, i) => `
    <tr class="row${i === 0 ? " leader" : ""}" style="--i:${Math.min(i, 30)}"
        data-entry="${r.entryId}" tabindex="0" role="button" aria-haspopup="dialog">
      <td><span class="rankcell"><span class="rankline"><span class="rank">${i + 1}</span></span>${i === 0 ? "" : `<span class="gap">−${leaderPoints - r.points}</span>`}</span></td>
      <td><span class="who"><span class="name">${esc(r.entry)}${r.won ? '<span class="badges"><span class="badge win" data-tip="Won this month">★ WIN</span></span>' : ""}</span><span class="team">${esc(r.manager)}</span></span></td>
      <td><span class="num gwpts">${r.points}</span></td>
    </tr>`).join("");

  $("panel").innerHTML = `
    <h2 class="eyebrow">${esc(ph.name)} <span class="phase-status">${ph.complete ? "final" : "provisional"}</span> <span class="dim">GW${ph.startEvent}–${ph.stopEvent}</span></h2>
    <div class="table-scroll"><table><thead><tr>
      <th scope="col">#</th><th scope="col">Team</th><th scope="col">Points</th>
    </tr></thead><tbody>${rows}</tbody></table></div>
    ${notes("monthly")}`;
  wireRows();
  updateScrollHint();
}

// ── manager dialog ────────────────────────────────────────────────────
// A manager opens onto four questions. Team, Captain and To play all read
// the same /api/team payload for this report's gameweek - one lazy fetch
// per manager, cached so switching between them doesn't refetch. Transfers
// needs no fetch (it's already on the row), so it's the only option the
// season and monthly views don't offer: there is no single gameweek's
// transfers to show once a row spans the whole season.
const OPTIONS = [
  { key: "transfers", label: "Transfers", gwOnly: true },
  { key: "team", label: "Team" },
  { key: "captain", label: "Captain" },
  { key: "toplay", label: "To play" },
];

const findEntry = (list, id) => (list || []).find((r) => r.entryId === id) || null;

// The gameweek rows carry the identity and the season honours for every
// view; only the season view has its own richer row to prefer.
function managerRow(id) {
  const rep = state.report;
  if (!rep) return null;
  return state.view === "season" ? findEntry(rep.season, id) : findEntry(rep.gameweek, id);
}

function currentPhase() {
  const phases = (state.report && state.report.monthly) || [];
  return phases.find((p) => p.name === state.month) || phases[phases.length - 1] || null;
}

function tabsFor() {
  return OPTIONS.filter((o) => !o.gwOnly || state.view === "gw");
}

// A remembered tab can be one this view doesn't offer - open a manager in
// the gameweek view on Transfers, switch to Season, open them again.
function activeTab(id) {
  const opts = tabsFor();
  const want = state.tab.get(id);
  return opts.some((o) => o.key === want) ? want : "team";
}

// The row's own numbers, carried into the dialog so the squad below is read
// against the score it produced. Five at most: this is the headline, and a
// tenth of a table repeated here would just be the table again.
function dialogStats(r) {
  const stat = (v, l, cls) => ({ v, l, cls });
  if (state.view === "season") {
    return [
      stat(r.total, "Total", "gwpts"),
      stat(r.bestGw ? `${r.bestGwPoints}` : "—", r.bestGw ? `Best · GW${r.bestGw}` : "Best GW"),
      stat(r.gwWins || "·", "GW wins"),
      stat(r.benchTotal, "Benched"),
      stat(r.hitsTotal ? `−${r.hitsTotal}` : "·", "Hits", r.hitsTotal ? "hit" : ""),
    ];
  }
  if (state.view === "monthly") {
    const ph = currentPhase();
    const st = ph && findEntry(ph.standings, r.entryId);
    return [
      stat(st ? st.points : "—", ph ? ph.name : "Month", "gwpts"),
      stat(r.total, "Season total"),
      stat(r.gwWins || "·", "GW wins"),
      stat(r.benchWins || "·", "Bench wins"),
    ];
  }
  return [
    stat(r.played ? r.netPoints : "—", "GW points", "gwpts"),
    stat(r.total, "Total"),
    stat(r.played ? r.bench : "—", "Bench"),
    stat(r.hit ? `−${r.hit}` : "·", "Hit", r.hit ? "hit" : ""),
    stat(r.transfers || "·", "Transfers"),
  ];
}

// Rank means the league position in two views and the month's position in
// the third, so it is read from wherever the table the row came from got it.
function dialogRank(r) {
  if (state.view !== "monthly") return r.leagueRank;
  const ph = currentPhase();
  const i = ph ? ph.standings.findIndex((x) => x.entryId === r.entryId) : -1;
  return i >= 0 ? i + 1 : "—";
}

function openManager(entryId) {
  if (!state.report || !managerRow(entryId)) return;
  state.dialog = entryId;
  renderDialog();
  openDialog($("manager-dialog"));
}

function closeManager() {
  state.dialog = null;
  closeDialog($("manager-dialog"));
}

$("manager-dialog").addEventListener("close", () => { state.dialog = null; });

function renderDialog() {
  const rep = state.report, id = state.dialog;
  if (!rep || id == null) return;
  const row = managerRow(id);
  if (!row) return closeManager();

  const rank = dialogRank(row);
  const marks = state.view === "gw" ? weekBadges(row) : honours(row);
  const chip = state.view === "gw" && row.chip ? ` <span class="chip">${esc(row.chip)}</span>` : "";
  const active = activeTab(id);

  const stats = dialogStats(row).map((st) =>
    `<div class="dlg-stat"><div class="n ${esc(st.cls || "")}">${esc(String(st.v))}</div><div class="l">${esc(st.l)}</div></div>`
  ).join("");

  const tabs = tabsFor().map((o, i) =>
    `<button type="button" role="tab" class="opt-btn" style="--i:${i}" id="mgr-tab-${o.key}"
       data-tab="${o.key}" aria-controls="mgr-tabpanel"
       aria-selected="${active === o.key}" tabindex="${active === o.key ? 0 : -1}">${esc(o.label)}</button>`
  ).join("");

  $("mgr-panel").innerHTML = `
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="dlg-head">
      <div class="dlg-id">
        <div class="dlg-rank${rank === 1 ? " leader" : ""}">${esc(String(rank))}</div>
        <div class="dlg-titles">
          <div class="dlg-entry" id="mgr-entry">${esc(row.entry)}${marks}${chip}</div>
          <div class="dlg-manager">${esc(row.manager)}</div>
        </div>
        <button type="button" class="dlg-close" data-close aria-label="Close">✕</button>
      </div>
      <div class="dlg-stats">${stats}</div>
    </div>
    <div class="dlg-body">
      <div class="opt-menu" role="tablist" aria-label="Manager detail">${tabs}</div>
      <div class="opt-content" id="mgr-tabpanel" role="tabpanel" aria-labelledby="mgr-tab-${active}" tabindex="0"></div>
    </div>`;

  wireTabs($("mgr-panel").querySelector('[role="tablist"]'), (tab) => selectManagerTab(tab.dataset.tab));
  renderDialogPanel();
}

// Only the panel is rewritten when the tab changes or the squad lands, so
// nothing that has focus - the tab you just arrowed onto - is destroyed
// underneath you.
function selectManagerTab(key) {
  state.tab.set(state.dialog, key);
  $("mgr-panel").querySelectorAll('[role="tab"]').forEach((b) => {
    const on = b.dataset.tab === key;
    b.setAttribute("aria-selected", String(on));
    b.tabIndex = on ? 0 : -1;
  });
  $("mgr-tabpanel").setAttribute("aria-labelledby", "mgr-tab-" + key);
  renderDialogPanel();
}

function renderDialogPanel() {
  const el = $("mgr-tabpanel");
  if (!el || state.dialog == null) return;
  const row = managerRow(state.dialog);
  if (!row) return;
  const key = activeTab(state.dialog);
  el.innerHTML = key === "transfers"
    ? transfersContent(row, state.report)
    : teamContent(row, state.report, key);
}

function transfersContent(r, rep) {
  const tf = r.transferDetail || [];
  return tf.length
    ? `<div class="tf-list">${tf.map((t) =>
        `<span><span class="out">${esc(rep.playerNames[t.out] || t.out)}</span><span class="arrow">→</span>${esc(rep.playerNames[t.in] || t.in)}</span>`
      ).join("")}</div>`
    : `<p class="tf-none">No transfers this gameweek.</p>`;
}

// Fetches (once) and caches the squad behind Team/Captain/To play. Firing a
// repaint from inside the .then() is what turns the skeleton into the
// populated, animated squad once the response lands. Only the tab panel is
// repainted, so the tab that has focus survives its own content arriving.
function teamKey(entryId, rep) { return `${entryId}:${rep.event.id}`; }

function ensureTeamData(entryId, rep) {
  const key = teamKey(entryId, rep);
  if (state.teamCache.has(key)) return state.teamCache.get(key);
  const slot = { status: "loading" };
  state.teamCache.set(key, slot);
  fetch(`/api/team?entry=${entryId}&gw=${rep.event.id}`)
    .then((res) => res.json().then((data) => ({ ok: res.ok, data })))
    .then(({ ok, data }) => {
      if (!ok) throw new Error(data.error || "request failed");
      state.teamCache.set(key, { status: "ready", data });
    })
    .catch((err) => state.teamCache.set(key, { status: "error", message: err.message }))
    .finally(() => renderDialogPanel());
  return slot;
}

function teamContent(r, rep, tab) {
  const slot = ensureTeamData(r.entryId, rep);
  if (slot.status === "loading") return skeletonSquad();
  if (slot.status === "error") return `<p class="opt-error">${esc(slot.message)}</p>`;
  if (tab === "team") return squadView(slot.data);
  if (tab === "captain") return captainView(slot.data);
  return toPlayView(slot.data);
}

const FX_LABEL = { upcoming: "Yet to play", live: "Playing now", finished: "Finished", none: "No fixture" };

function playerCard(p, i, bench) {
  const tag = p.isCaptain
    ? '<span class="ctag" data-tip="Captain">C</span>'
    : p.isViceCaptain ? '<span class="ctag vtag" data-tip="Vice-captain">V</span>' : "";
  return `<span class="pcard${bench ? " bench" : ""}" style="--i:${i}">
    <span class="fx-dot ${p.fixtureStatus}" data-tip="${esc(FX_LABEL[p.fixtureStatus] || p.fixtureStatus)}" aria-hidden="true"></span>
    <span class="pname">${esc(p.name)}</span>
    <span class="pteam">${esc(p.team)}</span>
    ${tag}
    <span class="ppts">${p.points}</span>
  </span>`;
}

function squadView(d) {
  let i = 0;
  const groups = ["GKP", "DEF", "MID", "FWD"].map((pos) => {
    const players = d.starters.filter((p) => p.position === pos);
    if (!players.length) return "";
    return `<div class="squad-group"><div class="squad-label">${pos}</div><div class="squad-row">${
      players.map((p) => playerCard(p, i++)).join("")}</div></div>`;
  }).join("");
  const bench = `<div class="squad-group"><div class="squad-label">Bench</div><div class="squad-row">${
    d.bench.map((p) => playerCard(p, i++, true)).join("")}</div></div>`;
  const chipNote = d.chip
    ? `<p class="opt-loading">${esc(d.chip)} played this gameweek${d.chip === "BB" ? " — bench points count." : "."}</p>` : "";
  return `${chipNote}${groups}${bench}`;
}

function captainView(d) {
  const card = (p, label) => p
    ? `<div class="squad-group"><div class="squad-label">${esc(label)}</div><div class="squad-row">${playerCard(p, 0)}</div></div>`
    : "";
  return card(d.captain, `Captain (${d.captain ? d.captain.multiplier : 1}×)`) + card(d.vice, "Vice-captain");
}

function toPlayView(d) {
  const stat = (n, l, i) => `<div class="toplay-stat" style="--i:${i}"><div class="n">${n}</div><div class="l">${esc(l)}</div></div>`;
  const relevant = d.chip === "BB" ? [...d.starters, ...d.bench] : d.starters;
  const upcoming = relevant.filter((p) => p.fixtureStatus === "upcoming");
  const live = relevant.filter((p) => p.fixtureStatus === "live");
  const list = (players, label) => players.length
    ? `<div class="squad-group"><div class="squad-label">${esc(label)}</div><div class="squad-row">${
        players.map((p, i) => playerCard(p, i)).join("")}</div></div>`
    : "";
  return `
    <div class="toplay-stats">${stat(d.toPlay, "yet to play", 0)}${stat(d.live, "playing now", 1)}${stat(d.finished, "finished", 2)}</div>
    <p class="tf-none">${d.ofTotal} players count this gameweek${d.chip === "BB" ? " — Bench Boost, bench included" : ""}.</p>
    ${list(upcoming, "Yet to play")}
    ${list(live, "Playing now")}
  `;
}

// Marks shared by more than one view, written once so the legend and the
// table can never drift apart on a colour or a glyph.
const MARK = {
  win: '<span class="badge win">★ WIN</span>',
  benchwin: '<span class="badge benchwin">▬ BENCH</span>',
  gwTally: '<span class="honour honour-gw">★<span class="s">3</span></span>',
  benchTally: '<span class="honour honour-bench">▬<span class="s">2</span></span>',
  leader: '<span class="lg-edge"></span><span class="rank" style="color:var(--gold)">1</span>',
  move: '<span class="move up">↑3</span><span class="move down">↓2</span>',
  gap: '<span class="gap">−12</span>',
  chip: '<span class="chip">BB</span>',
  derived: '<span class="num val">7</span><span class="derived">*</span>',
  live: '<span class="fx-dot live"></span><span class="fx-dot upcoming"></span>',
};

// [mark, label, the sentence that only appears on hover]
function legendItems(view) {
  const leader = [MARK.leader, "League leader", "The gilt edge and the gold rank number mark whoever is top of the table."];
  const gap = [MARK.gap, "Points behind", "How far this team is behind the leader on total points."];
  const chip = [MARK.chip, "Chip played", "WC wildcard · FH free hit · BB bench boost · TC triple captain."];
