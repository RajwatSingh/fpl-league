  // Measured after the text is in, so the box is its final size before it
  // is positioned - otherwise the first show lands half a line off.
  tipPlace(target);
}

function tipHide() {
  clearTimeout(tipTimer);
  if (tipFor) { tipFor.removeAttribute("aria-describedby"); tipFor = null; }
  tipToggle($("tip"), false);
}

function tipEnter(e) {
  const t = e.target.closest && e.target.closest("[data-tip]");
  if (!t || t === tipFor) return;
  tipHide();
  // Keyboard focus is deliberate, so it gets no delay; a pointer sweeping
  // across a table of ten tooltipped cells needs one.
  if (e.type === "focusin") return tipShow(t);
  tipTimer = setTimeout(() => tipShow(t), TIP_DELAY);
}

document.addEventListener("pointerover", tipEnter);
document.addEventListener("focusin", tipEnter);
document.addEventListener("pointerout", (e) => {
  if (tipFor && !(e.relatedTarget && tipFor.contains(e.relatedTarget))) tipHide();
});
document.addEventListener("focusout", tipHide);
document.addEventListener("pointerdown", tipHide);
// Fixed positioning is measured against the viewport, so any scroll leaves
// the tip behind its trigger. Cheaper to drop it than to track it.
addEventListener("scroll", tipHide, true);
addEventListener("resize", tipHide);
addEventListener("keydown", (e) => { if (e.key === "Escape") tipHide(); });

// ── toasts ────────────────────────────────────────────────────────────
// For a failure that arrives while there is still a table to read. When the
// panel is empty the in-page message is used instead: a card you can dismiss
// must never be the only thing saying the page has nothing on it.
const MAX_TOASTS = 3;
const liveToasts = new Map(); // key -> element, so a repeat replaces rather than stacks

function dismissToast(el) {
  if (!el.isConnected || el.classList.contains("out")) return;
  for (const [k, v] of liveToasts) if (v === el) liveToasts.delete(k);
  el.classList.add("out");
  el.addEventListener("animationend", () => el.remove(), { once: true });
  setTimeout(() => el.remove(), 400); // reduced motion kills the animation
}

function toast({ title, body, kind, actions, duration, key }) {
  const host = $("toaster");
  if (key && liveToasts.has(key)) dismissToast(liveToasts.get(key));

  const el = document.createElement("div");
  el.className = "toast" + (kind === "err" ? " err" : "");
  el.setAttribute("role", kind === "err" ? "alert" : "status");

  const head = document.createElement("div");
  head.className = "t-head";
  head.textContent = title;

  const close = document.createElement("button");
  close.type = "button";
  close.className = "t-close";
  close.setAttribute("aria-label", "Dismiss");
  close.textContent = "✕";
  close.addEventListener("click", () => dismissToast(el));

  el.append(head, close);
  if (body) {
    const b = document.createElement("div");
    b.className = "t-body";
    b.textContent = body;
    el.append(b);
  }
  if (actions && actions.length) {
    const bar = document.createElement("div");
    bar.className = "t-actions";
    for (const a of actions) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = a.label;
      btn.addEventListener("click", () => { dismissToast(el); a.run(); });
      bar.append(btn);
    }
    el.append(bar);
  }

  host.append(el);
  if (key) liveToasts.set(key, el);
  while (host.children.length > MAX_TOASTS) dismissToast(host.firstElementChild);
  // An error has no timer: it stays until it is read and dismissed.
  if (duration) setTimeout(() => dismissToast(el), duration);
  return el;
}

// ── dialogs ───────────────────────────────────────────────────────────
// Native <dialog>, so the focus trap, Escape, the inert background and the
// top layer come from the platform rather than from code here that would
// get one of them subtly wrong.
function openDialog(dlg) {
  if (dlg.open) return;
  tipHide();
  dlg.showModal();
  document.documentElement.classList.add("locked");
}

function closeDialog(dlg) {
  if (dlg.open) dlg.close();
}

for (const dlg of document.querySelectorAll("dialog.dlg")) {
  // A click that lands on the dialog element itself landed on the backdrop:
  // the panel inside covers every pixel of the box.
  dlg.addEventListener("click", (e) => { if (e.target === dlg) closeDialog(dlg); });
  dlg.addEventListener("close", () => {
    if (!document.querySelector("dialog.dlg[open]")) {
      document.documentElement.classList.remove("locked");
    }
  });
}
document.addEventListener("click", (e) => {
  const btn = e.target.closest && e.target.closest("[data-close]");
  if (btn) closeDialog(btn.closest("dialog"));
});

// ── tabs ──────────────────────────────────────────────────────────────
// Roving tabindex: one stop for the whole set, arrows to move within it.
// Activation follows focus, which is what a tab set that only re-renders
// what is already loaded should do.
function wireTabs(list, onSelect) {
  const tabs = [...list.querySelectorAll('[role="tab"]')];
  const pick = (tab) => {
    if (tab.getAttribute("aria-selected") === "true") return;
    onSelect(tab);
  };
  tabs.forEach((tab, i) => {
    tab.addEventListener("click", () => pick(tab));
    tab.addEventListener("keydown", (e) => {
      const step = { ArrowRight: 1, ArrowLeft: -1, Home: -Infinity, End: Infinity }[e.key];
      if (step === undefined) return;
      e.preventDefault();
      const next = tabs[step === -Infinity ? 0 : step === Infinity ? tabs.length - 1
        : (i + step + tabs.length) % tabs.length];
      next.focus();
      pick(next);
    });
  });
}

// The travelling bar under the view tabs. Measured rather than declared,
// because the three labels are different widths and the set reflows into a
// full-width row on a phone.
function moveIndicator(list, instant) {
  const ind = list.querySelector(".tabind");
  const sel = list.querySelector('[role="tab"][aria-selected="true"]');
  if (!ind || !sel || !sel.offsetWidth) return;
  if (instant) ind.classList.add("init");
  ind.style.width = sel.offsetWidth + "px";
  ind.style.transform = `translateX(${sel.offsetLeft}px)`;
  if (instant) requestAnimationFrame(() => ind.classList.remove("init"));
}

// ── skeleton ──────────────────────────────────────────────────────────
// The shape of the table that is coming, at its real geometry, so nothing
// jumps when the rows land. Widths vary per cell on a fixed rule rather
// than at random: a fresh set of widths on every re-render would read as
// content changing rather than as content still loading.
const SK_ROWS = 12;
const skJitter = (i, j) => 0.75 + ((i * 7 + j * 13) % 5) * 0.1;

function skBar(w, i) { return `<span class="sk" style="width:${w}rem;--i:${i}"></span>`; }

function skeletonTable(view) {
  const heads = view === "monthly"
    ? [{ label: "#" }, { label: "Team" }, { label: "Points" }]
    : columnsFor(view);
  const head = heads.map((c) => `<th scope="col">${esc(c.label)}</th>`).join("");
  const body = Array.from({ length: SK_ROWS }, (_, i) =>
    `<tr>${heads.map((c, j) => {
      if (j === 0) return `<td>${skBar(1.1, i)}</td>`;
      if (j === 1) return `<td><span class="who">${skBar(7 * skJitter(i, j), i)}${skBar(4.5 * skJitter(i, j + 1), i)}</span></td>`;
      return `<td>${skBar(2 * skJitter(i, j), i)}</td>`;
    }).join("")}</tr>`).join("");
  return `<div class="table-scroll"><table><thead><tr>${head}</tr></thead>
    <tbody class="skeleton">${body}</tbody></table></div>`;
}

// Same job at the ladder's geometry: the wait should be the shape of what
// is coming, so nothing jumps when the rows land. The rails are staggered
// widths for the same reason the real ones are ragged - a phone screen of
// identical bars reads as a loading graphic rather than as a table arriving.
function skeletonLadder(view) {
  const rows = Array.from({ length: SK_ROWS }, (_, i) => `
    <div class="lrow">
      <span class="lrank">${skBar(0.9, i)}</span>
      <span class="lwho">${skBar(6.5 * skJitter(i, 1), i)}${skBar(4.2 * skJitter(i, 2), i)}</span>
      <span class="lnum">${skBar(1.6, i)}${skBar(2.1, i)}</span>
      <span class="lrail">${skBar(9 * skJitter(i, 3), i)}</span>
    </div>`).join("");
  return `<div class="ladder skeleton">${ladderHead(view)}${rows}</div>`;
}

const skeletonPanel = (view) => (isMobile() ? skeletonLadder : skeletonTable)(view);

// The squad behind an option tab is one request, so its wait gets the same
// treatment at the shape of the thing being fetched.
function skeletonSquad() {
  return ["GKP", "DEF", "MID", "FWD"].map((pos, g) => `
    <div class="squad-group"><div class="squad-label">${pos}</div><div class="squad-row">${
      Array.from({ length: [1, 4, 4, 2][g] }, (_, i) =>
        `<span class="sk tall" style="width:${7 * skJitter(g, i)}rem;--i:${g * 4 + i}"></span>`).join("")
    }</div></div>`).join("");
}

// A season is the year it kicked off in - FPL runs August to May, so a
// deadline in January belongs to the season that started the summer before.
function seasonLabel(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const y = d.getUTCFullYear();
  const start = d.getUTCMonth() >= 6 ? y : y - 1;
  return `${start}/${String((start + 1) % 100).padStart(2, "0")}`;
}

// ── formatting ────────────────────────────────────────────────────────
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// One reference to a <symbol> in the sprite at the top of the body. Always
// aria-hidden: every icon on this page sits beside a word or a numeral that
// already says what it is, so an accessible name here would only make a
// screen reader read the same thing twice.
const icon = (name) => `<svg class="ic" aria-hidden="true"><use href="#ic-${name}"/></svg>`;

function movement(rank, lastRank) {
  if (!lastRank || !rank || lastRank === rank) return '<span class="move flat" aria-hidden="true">·</span>';
  const d = lastRank - rank;
  // The glyph carries the meaning; colour is the second channel only.
  return d > 0
    ? `<span class="move up">↑${d}</span>`
    : `<span class="move down">↓${-d}</span>`;
}

function meter(value, max) {
  const pct = max > 0 ? Math.round((value / max) * 100) : 0;
  return `<span class="meter" aria-hidden="true"><i style="width:${pct}%"></i></span>`;
}

// The rank number alone says a position; it doesn't say the margin. Every
// row but the leader's gets how many points behind they are - the number
// that actually carries a league table's stakes.
function rankCell(r, ctx, extra) {
  const gap = r.leagueRank === 1 || ctx.leaderTotal == null
    ? ""
    : `<span class="gap">−${ctx.leaderTotal - r.total}</span>`;
  return `<span class="rankcell"><span class="rankline"><span class="rank">${r.leagueRank}</span>${extra ? " " + extra : ""}</span>${gap}</span>`;
}

// ── column definitions ────────────────────────────────────────────────
const gwCols = [
  { key: "leagueRank", label: "#", sortLabel: "League rank", cell: (r, ctx) => rankCell(r, ctx, movement(r.leagueRank, r.lastRank)) },
  { key: "manager", label: "Team", cell: (r) =>
      `<span class="who"><span class="name">${esc(r.entry)}${weekBadges(r)}</span><span class="team">${esc(r.manager)}</span></span>` },
  { key: "netPoints", label: "GW", sortLabel: "GW points", num: true, cell: (r) => r.played
      ? `<span class="num gwpts${state.flashed && state.flashed.has(r.entryId) ? " flash" : ""}">${r.netPoints}</span>`
      : '<span class="faint">—</span>',
    title: (r) => r.played ? `${r.grossPoints} scored${r.hit ? ` − ${r.hit} hit` : ""} = ${r.netPoints}` : "not in this gameweek" },
  { key: "hit", label: "Hit", num: true, has: (rows) => rows.some((r) => r.hit),
    cell: (r) => r.hit ? hitBadge(r.hit, `${r.grossPoints} scored − ${r.hit} for transfers = ${r.netPoints}`) : '<span class="faint">·</span>' },
  { key: "bench", label: "Bench", num: true, cell: (r) => r.played
      ? `<span class="num val">${r.bench}</span>${r.benchDerived ? '<span class="derived" data-tip="Bench Boost week: the API reports 0, so this is recomputed from picks + live points">*</span>' : ""}`
      : '<span class="faint">—</span>' },
  { key: "chip", label: "Chip", has: (rows) => rows.some((r) => r.chip),
    cell: (r) => r.chip ? chipBadge(r.chip) : '<span class="faint">·</span>' },
  // "TF" is our word for it, not the reader's.
  { key: "transfers", label: "Transfers", num: true, has: (rows) => rows.some((r) => r.transfers),
    cell: (r) => r.transfers ? `<span class="num dim">${r.transfers}</span>` : '<span class="faint">·</span>' },
  { key: "captain", label: "Captain", cell: (r) => r.captain ? `<span class="dim">${esc(r.captain)}</span>` : '<span class="faint">—</span>' },
  { key: "toPlay", label: "To play", num: true, has: (rows) => rows.some((r) => r.toPlay),
    cell: (r) => r.played
      ? `<span class="num${r.toPlay ? "" : " dim"}">${r.toPlay}</span>`
      : '<span class="faint">—</span>',
    title: (r) => r.played ? `${r.toPlay} yet to play · ${r.playingNow} playing now · ${r.finishedPlaying} finished (of ${r.squadCount})` : "not in this gameweek" },
  { key: "total", label: "Total", num: true, cell: (r) => `<span class="num total">${r.total}</span>` },
];

const seasonCols = [
  { key: "leagueRank", label: "#", sortLabel: "League rank", cell: (r, ctx) => rankCell(r, ctx) },
  { key: "manager", label: "Team", cell: (r) => `<span class="who"><span class="name">${esc(r.entry)}</span><span class="team">${esc(r.manager)}</span></span>` },
  { key: "total", label: "Total", num: true, cell: (r) => `<span class="num gwpts">${r.total}</span>` },
  { key: "gwWins", label: "Wins", sortLabel: "Gameweek wins", num: true, has: (rows) => rows.some((r) => r.gwWins),
    cell: (r) =>
      seasonTally(r.gwWins, "win", "star", r.gwWinWeeks && r.gwWinWeeks.map((w) => "GW" + w), "Gameweek wins:") },
  { key: "monthWins", label: "Months", sortLabel: "Month wins", num: true, has: (rows) => rows.some((r) => r.monthWins),
    cell: (r) =>
      seasonTally(r.monthWins, "win", "diamond", r.monthWinNames, "Months won:") },
  { key: "benchTotal", label: "Benched", num: true, cell: (r, ctx) => `<span class="bench">${meter(r.benchTotal, ctx.maxBench)}<span class="num val">${r.benchTotal}</span></span>` },
  { key: "hitsTotal", label: "Hits", num: true, has: (rows) => rows.some((r) => r.hitsTotal),
    cell: (r) => r.hitsTotal ? hitBadge(r.hitsTotal, `${r.hitsTotal} points taken off for transfers this season`) : '<span class="faint">·</span>' },
  { key: "transfersTotal", label: "Transfers", num: true, cell: (r) => `<span class="num dim">${r.transfersTotal}</span>` },
  { key: "bestGwPoints", label: "Best GW", num: true, cell: (r) => r.bestGw ? `<span class="num">${r.bestGwPoints}</span> <span class="dim">GW${r.bestGw}</span>` : '<span class="faint">—</span>' },
  { key: "benchWins", label: "Bench wins", sortLabel: "Bench wins", num: true, has: (rows) => rows.some((r) => r.benchWins),
    cell: (r) =>
      seasonTally(r.benchWins, "benchwin", "bench", r.benchWinWeeks && r.benchWinWeeks.map((w) => "GW" + w), "Bench wins:") },
  { key: "chips", label: "Chips used", nosort: true, has: (rows) => rows.some((r) => r.chipsUsed && r.chipsUsed.length),
    cell: (r) => (r.chipsUsed && r.chipsUsed.length)
      ? r.chipsUsed.map((c) => chipBadge(chipLabel(c.name), c.event)).join(" ")
      : '<span class="faint">·</span>' },
];

// Rank columns sort ascending (1 is best); every other column is a magnitude
// where the interesting end is the top. One definition, used by both the
// dropdown and the column headers.
function defaultDir(key) {
  return key === "leagueRank" ? 1 : -1;
}

function setSort(key) {
  state.sort = key === state.sort.key
    ? { key, dir: -state.sort.dir }
    : { key, dir: defaultDir(key) };
  render();
}

function columnsFor(view) {
  return view === "season" ? seasonCols : gwCols;
}

// A column every row leaves empty is not a column, it is 76px of middle
// dots holding the table open. Nobody took a hit this week, so there is no
// Hit column; the gameweek has finished, so there is no To play. What the
// table is shaped like becomes a fact about the week.
//
// The sort key is the exception: sorting by Hits and finding no Hits column
// would be the table arguing with the control that built it. A column you
// have asked to sort by is always shown, empty or not.
function visibleColumns(view, rows) {
  return columnsFor(view).filter((c) => !c.has || c.key === state.sort.key || c.has(rows));
}

// Rebuilds the dropdown when the view changes, since the two views expose
// different columns. Keeps the current key if it exists in the new view.
function fillSortOptions() {
  const cols = columnsFor(state.view).filter((c) => !c.nosort);
  if (!cols.some((c) => c.key === state.sort.key)) {
    state.sort = { key: "leagueRank", dir: 1 };
  }
  $("sort").innerHTML = cols
    .map((c) => `<option value="${c.key}">${esc(c.sortLabel || c.label)}</option>`)
    .join("");
  $("sort").value = state.sort.key;
}

// Ties are shared, so both badges can appear on more than one row in a week.
function weekBadges(r) {
  const b = [];
  if (r.wonGw) b.push(MARK.win);
  if (r.wonBench) b.push(MARK.benchwin);
  return (b.length ? `<span class="badges">${b.join("")}</span>` : "") + honours(r);
}

// Season tallies beside the team name. Always glyph plus numeral, never
// repeated glyphs: a lone ★ reads as decoration rather than as a count of
// one, and a row of them sits badly next to the ★ WIN badge a current
// winner already carries.
function honours(r) {
  return tally("gw", "star", r.gwWins, r.gwWinWeeks, "gameweek win")
       + tally("bench", "bench", r.benchWins, r.benchWinWeeks, "bench win");
}

function tally(kind, ic, n, weeks, noun) {
  if (!n) return "";
  const list = (weeks || []).map((w) => "GW" + w).join(", ");
  const label = `${n} ${noun}${n === 1 ? "" : "s"} this season${list ? ` — ${list}` : ""}`;
  return `<span class="honour honour-${kind}" data-tip="${esc(label)}">${icon(ic)}<span class="s">${n}</span></span>`;
}

function seasonTally(n, cls, ic, labels, verb) {
  if (!n) return '<span class="tally"><span class="n zero">·</span></span>';
  const t = `${verb} ${(labels || []).join(", ")}`;
  return `<span class="tally" data-tip="${esc(t)}"><span class="badge ${cls}">${icon(ic)}</span><span class="n">${n}</span></span>`;
}

function chipLabel(n) {
  return { wildcard: "WC", freehit: "FH", bboost: "BB", "3xc": "TC" }[n] || n;
}

// The two-letter code is what identifies a chip - four chip hues would not
// survive the CVD check the palette note describes - so the badge carries
// the letters and spells them out in the tooltip.
const CHIP_NAME = { WC: "Wildcard", FH: "Free Hit", BB: "Bench Boost", TC: "Triple Captain" };

function chipBadge(code, event) {
  const name = CHIP_NAME[code] || code;
  const tip = event ? `${name} played in GW${event}` : `${name} played`;
  return `<span class="badge chip" data-tip="${esc(tip)}">${esc(code)}${
    event ? `<span class="ev">${event}</span>` : ""}</span>`;
}

// Where every row sits right now, keyed by entry id. Captured before the
// table is rewritten so flipRows() can work out what moved.
function rowPositions() {
  const map = new Map();
  $("panel").querySelectorAll("[data-entry]").forEach((tr) => {
    map.set(tr.dataset.entry, tr.getBoundingClientRect().top);
  });
  return map;
}

// FLIP: the rows are already in their final places by the time this runs,
// so each one is thrown back to where it used to be with an instant
// transform, then released on the next frame with the transition switched
// on - which the browser renders as a slide from old position to new.
// A plain CSS transition can't do this: the elements are destroyed and
// recreated by innerHTML, so there is no continuous element to animate.
function flipRows(before) {
  if (!before.size || prefersReducedMotion()) return;
  const moved = [];
  $("panel").querySelectorAll("[data-entry]").forEach((tr) => {
    const was = before.get(tr.dataset.entry);
    if (was == null) return;
    const delta = was - tr.getBoundingClientRect().top;
    if (!delta) return;
    tr.style.transform = `translateY(${delta}px)`;
    moved.push(tr);
  });
  if (!moved.length) return;
  requestAnimationFrame(() => {
    for (const tr of moved) {
      tr.classList.add("sliding");
      tr.style.transform = "";
    }
    // Drop the transition once it has played, so a later render that sets
    // a transform for a fresh FLIP isn't animated from this one's leftovers.
    setTimeout(() => {
      for (const tr of moved) tr.classList.remove("sliding");
    }, 560);
  });
}

function prefersReducedMotion() {
  return matchMedia("(prefers-reduced-motion: reduce)").matches;
}


// ── ladder ────────────────────────────────────────────────────────────
// The phone rendering of the same rows the table renders. It exists
// because the table cannot honestly fit: ten columns on a 390px screen put
// Total - the number a league table is for - off the right edge behind five
// columns of sideways scroll.
//
// The values come from the same row objects and the same helpers as the
// table's cells, so the two renderings cannot disagree about a number, a
// badge or a hue. What differs is only the shape: three blocks and a rail,
// instead of ten cells.

// A fact is true of every manager every week - who they captained, what
// they left on the bench. A badge is something that happened to this one -
// they won it, they took a hit, they played a chip. Only badges get a fill,
// which is what lets the rail be read at a glance rather than word by word.
function fact(ic, value, tip, cls) {
  return `<span class="fact${cls ? " " + cls : ""}"${tip ? ` data-tip="${esc(tip)}"` : ""}>${
    icon(ic)}<span class="v">${value}</span></span>`;
}

// The season's tallies, fenced off from the week's items beside them.
function honourGroup(r) {
  const h = honours(r);
  return h ? `<span class="lhon">${h}</span>` : "";
}

// The same annotation led by a word instead of a mark, for the one fact
// with no object behind it.
function labelled(label, value, tip) {
  return `<span class="fact" data-tip="${esc(tip)}"><span class="lbl">${label}</span><span class="v">${value}</span></span>`;
}

function hitBadge(n, tip) {
  return `<span class="badge hitb" data-tip="${esc(tip)}">${icon("card")}−${n}</span>`;
}

function gwRail(r) {
  const out = [];
  if (r.wonGw) out.push(MARK.win);
  if (r.wonBench) out.push(MARK.benchwin);
  if (r.chip) out.push(chipBadge(r.chip));
  if (r.hit) out.push(hitBadge(r.hit, `${r.grossPoints} scored − ${r.hit} for transfers = ${r.netPoints}`));
  if (r.played) {
    if (r.captain) out.push(fact("arm", esc(r.captain), `Captained ${r.captain}`, "f-cap"));
    out.push(fact("bench",
      `${r.bench}${r.benchDerived ? '<span class="derived">*</span>' : ""}`,
      r.benchDerived
        ? `${r.bench} left on the bench — recomputed, since Bench Boost weeks report 0`
        : `${r.bench} points left on the bench`));
    if (r.transfers) out.push(fact("sub", r.transfers, `${r.transfers} transfer${r.transfers === 1 ? "" : "s"}`));
    // Only while there are some. A row of zeroes down the ladder after
    // Monday would be a column of nothing, and the point of the rail is
    // that it carries what is still true.
    if (r.toPlay) out.push(fact("clock", r.toPlay, `${r.toPlay} still to play · ${r.playingNow} playing now`));
  }
  return out.join("") + honourGroup(r);
}

function seasonRail(r) {
  const out = [];
  if (r.hitsTotal) out.push(hitBadge(r.hitsTotal, `${r.hitsTotal} points taken off for transfers this season`));
  (r.chipsUsed || []).forEach((c) => out.push(chipBadge(chipLabel(c.name), c.event)));
  if (r.bestGw) out.push(labelled("Best", r.bestGwPoints, `Best gameweek: ${r.bestGwPoints} in GW${r.bestGw}`));
  out.push(fact("bench", r.benchTotal, `${r.benchTotal} points left on the bench all season`));
  // A zero here is not a fact about the season, it is an empty column - and
  // twenty-five of them down a phone screen is what the rail exists to avoid.
  if (r.transfersTotal) out.push(fact("sub", r.transfersTotal, `${r.transfersTotal} transfers this season`));
  return out.join("") + honourGroup(r);
}

// One row, three blocks and a rail. `big` is whatever number this view is
// about, `sub` the standing it feeds, `gap` the margin to the leader.
function ladderRow(o, i) {
  return `<div class="lrow${o.leader ? " leader" : ""}" style="--i:${Math.min(i, 30)}"
       data-entry="${o.entryId}" tabindex="0" role="button" aria-haspopup="dialog">
    <span class="lrank"><span class="n">${o.rank}</span>${o.move || ""}${
      o.gap != null ? `<span class="gap">−${o.gap}</span>` : ""}</span>
    <span class="lwho"><span class="lname">${esc(o.entry)}</span><span class="lmgr">${esc(o.manager)}</span></span>
    <span class="lnum">
      <span class="lbig${o.big == null ? " none" : ""}">${o.big == null ? "—" : o.big}</span>
      ${o.sub != null ? `<span class="lsub">${o.sub}</span>` : ""}
    </span>
    <span class="lrail">${o.rail}</span>
  </div>`;
}

// Mobile loses the table's sortable column headings, which is most of how
// this page gets used. The two numbers on screen bring theirs back as tap
// targets; everything else stays in the filters sheet's dropdown.
function ladderHead(view) {
  const btn = (key, label) => {
    const on = state.sort.key === key;
    const dir = state.sort.dir === 1 ? "↑" : "↓";
    return `<button type="button" data-key="${key}"${
      on ? ` aria-sort="${state.sort.dir === 1 ? "ascending" : "descending"}"` : ""
    }>${label}${on ? ` <span class="caret">${dir}</span>` : ""}</button>`;
  };
  const nums = view === "gw" ? btn("netPoints", "GW") + btn("total", "Total")
    : view === "season" ? btn("total", "Total")
    : "<span>Points</span>";
  return `<div class="lhead"><span>#</span><span>Team</span><span class="lh-num">${nums}</span></div>`;
}

function ladder(view, rows, ctx, fresh) {
  const body = rows.map((r, i) => {
    if (view === "season") {
      return ladderRow({
        entryId: r.entryId, entry: r.entry, manager: r.manager,
        rank: r.leagueRank, leader: r.leagueRank === 1,
        big: r.total, sub: null,
        gap: r.leagueRank === 1 || ctx.leaderTotal == null ? null : ctx.leaderTotal - r.total,
        rail: seasonRail(r),
      }, i);
    }
    return ladderRow({
      entryId: r.entryId, entry: r.entry, manager: r.manager,
      rank: r.leagueRank, leader: r.leagueRank === 1,
      move: movement(r.leagueRank, r.lastRank),
      big: r.played
        ? `<span class="${state.flashed && state.flashed.has(r.entryId) ? "flash" : ""}">${r.netPoints}</span>`
        : null,
      sub: r.total,
      gap: r.leagueRank === 1 || ctx.leaderTotal == null ? null : ctx.leaderTotal - r.total,
      rail: gwRail(r),
    }, i);
  }).join("");

  return `<div class="ladder${fresh ? " fresh" : ""}">${ladderHead(view)}${body}</div>`;
}

// The head's two buttons are the mobile equivalent of a column heading, so
// they get the same behaviour: tap to sort by it, tap again to reverse.
function wireLadderHead() {
  $("panel").querySelectorAll(".lh-num button[data-key]").forEach((b) => {
    b.addEventListener("click", () => setSort(b.dataset.key));
  });
}

// ── render ────────────────────────────────────────────────────────────
// fresh marks a render that follows new data, which is the only one that
// should replay the staggered row entrance.
function render(fresh) {
  const rep = state.report;
  if (!rep) return;
  // The tip's trigger is about to be replaced by innerHTML below, and a tip
  // left pointing at a detached node never hides.
  tipHide();

  const showSortRow = state.view !== "monthly";
  $("sort-field").style.display = showSortRow ? "" : "none";
  $("max-field").style.display = state.view === "gw" ? "" : "none";
  $("month-field").style.display = state.view === "monthly" ? "" : "none";

  if (state.view === "monthly") { fillMonthOptions(rep); renderMonthly(rep); return; }

  const season = state.view === "season";
  const rows = [...(season ? rep.season : rep.gameweek)];
  const cols = visibleColumns(state.view, rows);
  const benchKey = season ? "benchTotal" : "bench";
  const ctx = {
    maxBench: Math.max(1, ...rows.map((r) => r[benchKey] || 0)),
    leaderTotal: rows.length ? Math.max(...rows.map((r) => r.total)) : null,
  };

  const { key, dir } = state.sort;
  rows.sort((a, b) => {
    const av = a[key], bv = b[key];
    if (typeof av === "string") return dir * av.localeCompare(bv);
    return dir * ((av ?? -1) - (bv ?? -1));
  });

  const phone = isMobile();

  const head = phone ? "" : cols.map((c) => {
    if (c.nosort) return `<th scope="col">${esc(c.label)}</th>`;
    const active = c.key === key;
    const caret = active ? `<span class="caret">${dir === 1 ? "↑" : "↓"}</span>` : "";
    const sortAttr = active ? ` aria-sort="${dir === 1 ? "ascending" : "descending"}"` : "";
    return `<th scope="col" class="sortable" data-key="${c.key}" tabindex="0" role="button"${sortAttr}>${esc(c.label)} ${caret}</th>`;
  }).join("");

  const body = phone ? "" : rows.map((r, i) => {
    const cells = cols.map((c) => {
      const t = c.title ? ` data-tip="${esc(c.title(r))}"` : "";
      return `<td${t}>${c.cell(r, ctx)}</td>`;
    }).join("");
    const rowClass = `row${r.leagueRank === 1 ? " leader" : ""}`;
    return `<tr class="${rowClass}" style="--i:${Math.min(i, 30)}" data-entry="${r.entryId}" tabindex="0" role="button" aria-haspopup="dialog">${cells}</tr>`;
  }).join("");

  // Same rows, same helpers, two shapes. See the ladder block above for why
  // the table is not one of the two below 640px.
  const list = phone
    ? ladder(state.view, rows, ctx, fresh)
    : `<div class="table-scroll"><table><thead><tr>${head}</tr></thead><tbody${fresh ? ' class="fresh"' : ""}>${body}</tbody></table></div>`;

  $("sort").value = key;
  $("sortdir").textContent = dir === 1 ? "↑" : "↓";
  $("sortdir").setAttribute("aria-label", dir === 1 ? "Ascending, click to reverse" : "Descending, click to reverse");

  const label = season ? `season to ${esc(rep.event.name)}` : esc(rep.event.name);

  const before = rowPositions();
  $("panel").innerHTML = `
    <h2 class="eyebrow panel-head">${label}</h2>
    ${rep.provisional && !season ? '<p class="provisional">This gameweek is not finalised — bonus, gameweek ranks and bench points can still move.</p>' : ""}
    ${list}
    ${notes(state.view)}`;
  flipRows(before);

  $("panel").querySelectorAll("th.sortable").forEach((th) => {
    const act = () => setSort(th.dataset.key);
    th.addEventListener("click", act);
    th.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); } });
  });

  wireLadderHead();
  wireRows();
  updateScrollHint();
}

// Every row in every view is the same thing: the way into one manager.
function wireRows() {
  $("panel").querySelectorAll("[data-entry]").forEach((tr) => {
    const act = () => openManager(Number(tr.dataset.entry));
    tr.addEventListener("click", act);
    tr.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); }
    });
  });
}

// Phases arrive in calendar order (see monthlyPhases in fpl/report.go), so the
// last one is the most recent — the natural default when the tab is opened.
function fillMonthOptions(rep) {
  const phases = rep.monthly || [];
  if (!phases.some((p) => p.name === state.month)) {
    state.month = phases.length ? phases[phases.length - 1].name : null;
  }
  $("month").innerHTML = phases.map((p) => `<option value="${esc(p.name)}">${esc(p.name)}</option>`).join("");
  $("month").value = state.month || "";
}

function renderMonthly(rep) {
  const phases = rep.monthly || [];
  if (!phases.length) {
    $("panel").innerHTML = `<h2 class="eyebrow">monthly standings</h2><p class="tf-none">No month has started yet.</p>`;
    return;
  }
  const ph = currentPhase();

  const leaderPoints = ph.standings.length ? ph.standings[0].points : 0;
  const monthWin = `<span class="badge win" data-tip="Won this month">${icon("star")}WIN</span>`;

  const list = isMobile()
    ? `<div class="ladder">${ladderHead("monthly")}${ph.standings.map((r, i) => ladderRow({
        entryId: r.entryId, entry: r.entry, manager: r.manager,
        rank: i + 1, leader: i === 0,
        big: r.points, sub: null,
        gap: i === 0 ? null : leaderPoints - r.points,
        rail: r.won ? monthWin : "",
      }, i)).join("")}</div>`
    : `<div class="table-scroll"><table><thead><tr>
      <th scope="col">#</th><th scope="col">Team</th><th scope="col">Points</th>
    </tr></thead><tbody>${ph.standings.map((r, i) => `
    <tr class="row${i === 0 ? " leader" : ""}" style="--i:${Math.min(i, 30)}"
        data-entry="${r.entryId}" tabindex="0" role="button" aria-haspopup="dialog">
      <td><span class="rankcell"><span class="rankline"><span class="rank">${i + 1}</span></span>${i === 0 ? "" : `<span class="gap">−${leaderPoints - r.points}</span>`}</span></td>
      <td><span class="who"><span class="name">${esc(r.entry)}${r.won ? `<span class="badges">${monthWin}</span>` : ""}</span><span class="team">${esc(r.manager)}</span></span></td>
      <td><span class="num gwpts">${r.points}</span></td>
    </tr>`).join("")}</tbody></table></div>`;

  // The month's own eyebrow stays on a phone: unlike "Gameweek 3", which the
  // masthead already says two inches above it, this one names which month
  // and whether it is settled - nothing else on screen carries that.
  $("panel").innerHTML = `
    <h2 class="eyebrow">${esc(ph.name)} <span class="phase-status">${ph.complete ? "final" : "provisional"}</span> <span class="dim">GW${ph.startEvent}–${ph.stopEvent}</span></h2>
    ${list}
    ${notes("monthly")}`;
  wireRows();
  updateScrollHint();
}

// ── manager dialog ────────────────────────────────────────────────────
// A manager opens onto four questions. Team, Captain and To play all read
// the same /api/team payload for this report's gameweek - one lazy fetch
// per manager, cached so switching between them doesn't refetch. Transfers
// needs no fetch (it's already on the row), so it's the only option the
// season and monthly views don't offer: there is no single gameweek's
// transfers to show once a row spans the whole season.
const OPTIONS = [
  { key: "transfers", label: "Transfers", gwOnly: true },
  { key: "team", label: "Team" },
  { key: "captain", label: "Captain" },
  { key: "toplay", label: "To play" },
];

const findEntry = (list, id) => (list || []).find((r) => r.entryId === id) || null;

// The gameweek rows carry the identity and the season honours for every
// view; only the season view has its own richer row to prefer.
function managerRow(id) {
  const rep = state.report;
  if (!rep) return null;
  return state.view === "season" ? findEntry(rep.season, id) : findEntry(rep.gameweek, id);
}

function currentPhase() {
  const phases = (state.report && state.report.monthly) || [];
  return phases.find((p) => p.name === state.month) || phases[phases.length - 1] || null;
}

function tabsFor() {
  return OPTIONS.filter((o) => !o.gwOnly || state.view === "gw");
}

// A remembered tab can be one this view doesn't offer - open a manager in
// the gameweek view on Transfers, switch to Season, open them again.
function activeTab(id) {
  const opts = tabsFor();
  const want = state.tab.get(id);
  return opts.some((o) => o.key === want) ? want : "team";
}

// The row's own numbers, carried into the dialog so the squad below is read
// against the score it produced. Five at most: this is the headline, and a
// tenth of a table repeated here would just be the table again.
function dialogStats(r) {
  const stat = (v, l, cls) => ({ v, l, cls });
  if (state.view === "season") {
    return [
      stat(r.total, "Total", "gwpts"),
      stat(r.bestGw ? `${r.bestGwPoints}` : "—", r.bestGw ? `Best · GW${r.bestGw}` : "Best GW"),
      stat(r.gwWins || "·", "GW wins"),
      stat(r.benchTotal, "Benched"),
      stat(r.hitsTotal ? `−${r.hitsTotal}` : "·", "Hits", r.hitsTotal ? "hit" : ""),
    ];
  }
  if (state.view === "monthly") {
    const ph = currentPhase();
    const st = ph && findEntry(ph.standings, r.entryId);
    return [
      stat(st ? st.points : "—", ph ? ph.name : "Month", "gwpts"),
      stat(r.total, "Season total"),
      stat(r.gwWins || "·", "GW wins"),
      stat(r.benchWins || "·", "Bench wins"),
    ];
  }
  return [
    stat(r.played ? r.netPoints : "—", "GW points", "gwpts"),
    stat(r.total, "Total"),
    stat(r.played ? r.bench : "—", "Bench"),
    stat(r.hit ? `−${r.hit}` : "·", "Hit", r.hit ? "hit" : ""),
    stat(r.transfers || "·", "Transfers"),
  ];
}

// Rank means the league position in two views and the month's position in
// the third, so it is read from wherever the table the row came from got it.
function dialogRank(r) {
  if (state.view !== "monthly") return r.leagueRank;
  const ph = currentPhase();
  const i = ph ? ph.standings.findIndex((x) => x.entryId === r.entryId) : -1;
  return i >= 0 ? i + 1 : "—";
}

function openManager(entryId) {
  if (!state.report || !managerRow(entryId)) return;
  state.dialog = entryId;
  renderDialog();
  openDialog($("manager-dialog"));
}

function closeManager() {
  state.dialog = null;
  closeDialog($("manager-dialog"));
}

$("manager-dialog").addEventListener("close", () => { state.dialog = null; });

function renderDialog() {
  const rep = state.report, id = state.dialog;
  if (!rep || id == null) return;
  const row = managerRow(id);
  if (!row) return closeManager();

  const rank = dialogRank(row);
  const marks = state.view === "gw" ? weekBadges(row) : honours(row);
  const chip = state.view === "gw" && row.chip ? ` <span class="chip">${esc(row.chip)}</span>` : "";
  const active = activeTab(id);

  const stats = dialogStats(row).map((st) =>
    `<div class="dlg-stat"><div class="n ${esc(st.cls || "")}">${esc(String(st.v))}</div><div class="l">${esc(st.l)}</div></div>`
  ).join("");

  const tabs = tabsFor().map((o, i) =>
    `<button type="button" role="tab" class="opt-btn" style="--i:${i}" id="mgr-tab-${o.key}"
       data-tab="${o.key}" aria-controls="mgr-tabpanel"
       aria-selected="${active === o.key}" tabindex="${active === o.key ? 0 : -1}">${esc(o.label)}</button>`
  ).join("");

  $("mgr-panel").innerHTML = `
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="dlg-head">
      <div class="dlg-id">
        <div class="dlg-rank${rank === 1 ? " leader" : ""}">${esc(String(rank))}</div>
        <div class="dlg-titles">
          <div class="dlg-entry" id="mgr-entry">${esc(row.entry)}${marks}${chip}</div>
          <div class="dlg-manager">${esc(row.manager)}</div>
        </div>
        <button type="button" class="dlg-close" data-close aria-label="Close">✕</button>
      </div>
      <div class="dlg-stats">${stats}</div>
    </div>
    <div class="dlg-body">
      <div class="opt-menu" role="tablist" aria-label="Manager detail">${tabs}</div>
      <div class="opt-content" id="mgr-tabpanel" role="tabpanel" aria-labelledby="mgr-tab-${active}" tabindex="0"></div>
    </div>`;

  wireTabs($("mgr-panel").querySelector('[role="tablist"]'), (tab) => selectManagerTab(tab.dataset.tab));
  renderDialogPanel();
}

// Only the panel is rewritten when the tab changes or the squad lands, so
// nothing that has focus - the tab you just arrowed onto - is destroyed
// underneath you.
function selectManagerTab(key) {
  state.tab.set(state.dialog, key);
  $("mgr-panel").querySelectorAll('[role="tab"]').forEach((b) => {
    const on = b.dataset.tab === key;
    b.setAttribute("aria-selected", String(on));
    b.tabIndex = on ? 0 : -1;
  });
  $("mgr-tabpanel").setAttribute("aria-labelledby", "mgr-tab-" + key);
  renderDialogPanel();
}

function renderDialogPanel() {
  const el = $("mgr-tabpanel");
  if (!el || state.dialog == null) return;
  const row = managerRow(state.dialog);
  if (!row) return;
  const key = activeTab(state.dialog);
  el.innerHTML = key === "transfers"
    ? transfersContent(row, state.report)
    : teamContent(row, state.report, key);
}

function transfersContent(r, rep) {
  const tf = r.transferDetail || [];
  return tf.length
    ? `<div class="tf-list">${tf.map((t) =>
        `<span class="out">${esc(rep.playerNames[t.out] || t.out)}</span>` +
        `<span class="arrow" role="img" aria-label="out for">→</span>` +
        `<span class="in">${esc(rep.playerNames[t.in] || t.in)}</span>`
      ).join("")}</div>`
    : `<p class="tf-none">No transfers this gameweek.</p>`;
}

// Fetches (once) and caches the squad behind Team/Captain/To play. Firing a
// repaint from inside the .then() is what turns the skeleton into the
// populated, animated squad once the response lands. Only the tab panel is
// repainted, so the tab that has focus survives its own content arriving.
function teamKey(entryId, rep) { return `${entryId}:${rep.event.id}`; }

function ensureTeamData(entryId, rep) {
  const key = teamKey(entryId, rep);
  if (state.teamCache.has(key)) return state.teamCache.get(key);
  const slot = { status: "loading" };
  state.teamCache.set(key, slot);
  fetch(`/api/team?entry=${entryId}&gw=${rep.event.id}`)
    .then((res) => res.json().then((data) => ({ ok: res.ok, data })))
    .then(({ ok, data }) => {
      if (!ok) throw new Error(data.error || "request failed");
      state.teamCache.set(key, { status: "ready", data });
    })
    .catch((err) => state.teamCache.set(key, { status: "error", message: err.message }))
    .finally(() => renderDialogPanel());
  return slot;
}

function teamContent(r, rep, tab) {
  const slot = ensureTeamData(r.entryId, rep);
  if (slot.status === "loading") return skeletonSquad();
  if (slot.status === "error") return `<p class="opt-error">${esc(slot.message)}</p>`;
  const fresh = transferredIn(r.entryId, rep);
  if (tab === "team") return squadView(slot.data, fresh);
  if (tab === "captain") return captainView(slot.data, fresh);
  return toPlayView(slot.data, fresh);
}

const FX_LABEL = { upcoming: "Yet to play", live: "Playing now", finished: "Finished", none: "No fixture" };

function playerCard(p, i, bench, isNew) {
  const tag = p.isCaptain
    ? '<span class="ctag" data-tip="Captain">C</span>'
    : p.isViceCaptain ? '<span class="ctag vtag" data-tip="Vice-captain">V</span>' : "";
  // Both tags can land on one card - a captain bought this week - so the
  // arrival mark is appended rather than made part of the same either/or.
  const inTag = isNew ? '<span class="ptag" data-tip="Transferred in this gameweek">IN</span>' : "";
  return `<span class="pcard${bench ? " bench" : ""}${isNew ? " tf-in" : ""}" style="--i:${i}">
    <span class="fx-dot ${p.fixtureStatus}" data-tip="${esc(FX_LABEL[p.fixtureStatus] || p.fixtureStatus)}" aria-hidden="true"></span>
    <span class="pname">${esc(p.name)}</span>
    <span class="pteam">${esc(p.team)}</span>
    ${tag}${inTag}
    <span class="ppts">${p.points}</span>
  </span>`;
}

// Who this manager bought for the gameweek the squad below belongs to. The
// detail only ever hangs off a gameweek row, so it is read from there even
// when the dialog was opened from the season or monthly table - those rows
// span a whole season and carry none, but the squad on screen is still one
// gameweek's, and it is this one.
function transferredIn(entryId, rep) {
  const gwRow = findEntry(rep.gameweek, entryId);
  return new Set(((gwRow && gwRow.transferDetail) || []).map((t) => t.in));
}

function squadView(d, fresh) {
  let i = 0;
  const groups = ["GKP", "DEF", "MID", "FWD"].map((pos) => {
    const players = d.starters.filter((p) => p.position === pos);
    if (!players.length) return "";
    return `<div class="squad-group"><div class="squad-label">${pos}</div><div class="squad-row">${
      players.map((p) => playerCard(p, i++, false, fresh.has(p.element))).join("")}</div></div>`;
  }).join("");
  const bench = `<div class="squad-group"><div class="squad-label">Bench</div><div class="squad-row">${
    d.bench.map((p) => playerCard(p, i++, true, fresh.has(p.element))).join("")}</div></div>`;
  const chipNote = d.chip
    ? `<p class="opt-loading">${esc(d.chip)} played this gameweek${d.chip === "BB" ? " — bench points count." : "."}</p>` : "";
  return `${chipNote}${groups}${bench}`;
}

function captainView(d, fresh) {
  const card = (p, label) => p
    ? `<div class="squad-group"><div class="squad-label">${esc(label)}</div><div class="squad-row">${playerCard(p, 0, false, fresh.has(p.element))}</div></div>`
    : "";
  return card(d.captain, `Captain (${d.captain ? d.captain.multiplier : 1}×)`) + card(d.vice, "Vice-captain");
}

function toPlayView(d, fresh) {
  const stat = (n, l, i) => `<div class="toplay-stat" style="--i:${i}"><div class="n">${n}</div><div class="l">${esc(l)}</div></div>`;
  const relevant = d.chip === "BB" ? [...d.starters, ...d.bench] : d.starters;
  const upcoming = relevant.filter((p) => p.fixtureStatus === "upcoming");
  const live = relevant.filter((p) => p.fixtureStatus === "live");
  const list = (players, label) => players.length
    ? `<div class="squad-group"><div class="squad-label">${esc(label)}</div><div class="squad-row">${
        players.map((p, i) => playerCard(p, i, false, fresh.has(p.element))).join("")}</div></div>`
    : "";
  return `
    <div class="toplay-stats">${stat(d.toPlay, "yet to play", 0)}${stat(d.live, "playing now", 1)}${stat(d.finished, "finished", 2)}</div>
    <p class="tf-none">${d.ofTotal} players count this gameweek${d.chip === "BB" ? " — Bench Boost, bench included" : ""}.</p>
    ${list(upcoming, "Yet to play")}
    ${list(live, "Playing now")}
  `;
}

// Marks shared by more than one view, written once so the legend and the
// table can never drift apart on a colour or a glyph.
const MARK = {
  win: `<span class="badge win" data-tip="Highest score in this gameweek">${icon("star")}WIN</span>`,
  benchwin: `<span class="badge benchwin" data-tip="Most points left on the bench this gameweek">${icon("bench")}BENCH</span>`,
  gwTally: `<span class="honour honour-gw">${icon("star")}<span class="s">3</span></span>`,
  monthTally: `<span class="honour honour-gw">${icon("diamond")}<span class="s">1</span></span>`,
  benchTally: `<span class="honour honour-bench">${icon("bench")}<span class="s">2</span></span>`,
  leader: '<span class="lg-edge"></span><span class="rank" style="color:var(--gold)">1</span>',
  move: '<span class="move up">↑3</span><span class="move down">↓2</span>',
  gap: '<span class="gap">−12</span>',
  chip: `<span class="badge chip">BB</span>`,
  hit: `<span class="badge hitb">${icon("card")}−4</span>`,
  cap: `<span class="fact f-cap">${icon("arm")}<span class="v">Haaland</span></span>`,
  bench: `<span class="fact">${icon("bench")}<span class="v">9</span></span>`,
  tf: `<span class="fact">${icon("sub")}<span class="v">2</span></span>`,
  toplay: `<span class="fact">${icon("clock")}<span class="v">3</span></span>`,
  derived: '<span class="num val">7</span><span class="derived">*</span>',
  live: '<span class="fx-dot live"></span><span class="fx-dot upcoming"></span>',
};

// [mark, label, the sentence that only appears on hover]
function legendItems(view) {
  const leader = [MARK.leader, "League leader", "The gilt edge and the gold rank number mark whoever is top of the table."];
  const gap = [MARK.gap, "Points behind", "How far this team is behind the leader on total points."];
  const chip = [MARK.chip, "Chip played", "WC wildcard · FH free hit · BB bench boost · TC triple captain."];
  const gwTally = [MARK.gwTally, "Gameweek wins", "How many gameweeks this team has won all season. Hover it in the table for the list of weeks."];
  const benchTally = [MARK.benchTally, "Bench wins", "How many gameweeks this team left the most points on its bench. Hover it in the table for the list of weeks."];

  if (view === "monthly") {
    return [
      [MARK.win, "Month winner", "Most points across the gameweeks in this calendar month, net of hits. Ties are shared."],
      leader, gap,
    ];
  }
  if (view === "season") {
    return [
      gwTally,
      [MARK.monthTally, "Months won", "How many of FPL's calendar-month phases this team has topped."],
      benchTally, leader, chip,
      [MARK.hit, "Points taken off", "Transfers beyond the free one cost 4 points each. The total is already deducted from every score here."],
      [MARK.tf, "Transfers made", "How many players this team swapped."],
    ];
  }
  return [
    [MARK.win, "Gameweek winner", "Highest score this gameweek, net of any transfer hit. Ties are shared, so more than one team can carry it."],
    [MARK.benchwin, "Most left behind", "Most points left on the bench this gameweek. A Bench Boost week can never win it — the bench played, so nothing was left behind."],
    gwTally, benchTally, leader,
    [MARK.move, "Rank movement", "Places gained or lost since the previous gameweek."],
    gap, chip,
    [MARK.hit, "Points taken off", "Transfers beyond the free one cost 4 points each. The score beside it already has the deduction taken out."],
    [MARK.cap, "Captain", "Whoever this team doubled this gameweek."],
    [MARK.bench, "Points benched", "What this team's substitutes scored without being played."],
    [MARK.tf, "Transfers made", "How many players this team swapped."],
    [MARK.toplay, "Still to play", "Players in the starting XI whose match has not kicked off. It only appears while some are left."],
    [MARK.derived, "Recomputed bench", "Bench Boost reports zero points on the bench, so this figure is rebuilt from the picks and the live scores."],
    [MARK.live, "Playing / to play", "In an opened team, a pulsing dot is a player whose match is under way and a flat one is a match still to kick off."],
  ];
}

function notes(view) {
  const items = legendItems(view).map(([mark, label, title]) =>
    `<div class="lg-item" data-tip="${esc(title)}" tabindex="0"><span class="lg-mark">${mark}</span><span>${esc(label)}</span></div>`
  ).join("");

  // What's left in prose is the handful of things that aren't a mark: how a
  // column is computed, and what the table itself does.
  const prose = view === "monthly"
    ? "<span>A month stays <b>provisional</b> until its last gameweek is finalised.</span>"
    : `<span><b>GW</b> is net of the transfer hit — the API reports it gross. Hover a score for the breakdown.</span>
       ${view === "season"
         ? "<span><b>Benched</b> reads 0 for any Bench Boost week, which is what the API reports for them.</span>"
         : "<span><b>To play</b> counts the starting XI, or all 15 during a Bench Boost. Hover it for the full breakdown.</span>"}
       <span>Select a row for its transfers, team, captain and players left to play. ${
         isMobile()
           ? "Tap GW or Total to sort by it; the rest of the sorts are under Filters."
           : "Column headings sort."}</span>`;

  return `<h2 class="eyebrow">legend</h2>
    <div class="legend">${items}</div>
    <div class="notes">${prose}</div>`;
}

// ── players & fixtures ────────────────────────────────────────────────
// A second dataset with its own controls, its own panel and its own
// dialog. It shares the API client, the palette and the dialog shell with
// the league side and nothing else - which is why the switch between them
// is a nav rather than another view tab.

const pstate = {
  board: null,
  sort: { key: "points", dir: -1 },
  pos: "all",
  team: "",
  // 1 has played, 0 everyone, 2 available only. Defaulting to "has played"
  // keeps the 200-odd squad players who will not kick a ball out of a
  // table whose whole job is comparison.
  minutes: 1,
  // A club-strength band - the six best attacks, the ten best defences -
  // rather than a club. "Who are the good attacking sides right now" is a
  // question the model already answers; the club dropdown made you know
  // the answer before you could ask it.
  strength: "",
  // How much of a fixture a ticker cell shows. Score-only is the view for
  // reading a run's shape; opponent-only is the traditional fixture list.
  cells: "both",
  search: "",
  horizon: 10,
  dialog: null,
};

// The run gets long enough that a table of every player is a table nobody
// reads to the end of. This is the point past which narrowing the filters
// beats scrolling.
const P_LIMIT = 120;

// The five steps of the difficulty ramp. The boundaries are not even
// fifths of 1-10: real fixtures cluster around the middle, so the two
// outer bands are wide and the middle three are tight, which is what puts
// visible daylight between a 4.6 and a 5.4.
function fdrClass(score) {
  if (score <= 3.4) return "fdr1";
  if (score <= 4.6) return "fdr2";
  if (score <= 5.6) return "fdr3";
  if (score <= 6.8) return "fdr4";
  return "fdr5";
}

// Each band is a rank cut: which rank to read, how many clubs, and which
// end of the table. Keeping them as data means the label on the control
// and the line that names the qualifying clubs cannot drift apart.
const STRENGTH = {
  atk6:  { rank: "attackRank",  n: 6,  best: true,  label: "Top 6 attacks" },
  atk10: { rank: "attackRank",  n: 10, best: true,  label: "Top 10 attacks" },
  def6:  { rank: "defenceRank", n: 6,  best: true,  label: "Top 6 defences" },
  def10: { rank: "defenceRank", n: 10, best: true,  label: "Top 10 defences" },
  atkw6: { rank: "attackRank",  n: 6,  best: false, label: "Bottom 6 attacks" },
  defw6: { rank: "defenceRank", n: 6,  best: false, label: "Bottom 6 defences" },
};

// The clubs a band selects, in rank order, so the filter can show its own
// working instead of silently removing three quarters of the table.
function strengthClubs(band) {
  const spec = STRENGTH[band];
  if (!spec || !pstate.board) return [];
  const total = pstate.board.teams.length;
  return pstate.board.teams
    .filter((t) => t[spec.rank] && (spec.best
      ? t[spec.rank] <= spec.n
      : t[spec.rank] > total - spec.n))
    .sort((a, b) => (spec.best ? a[spec.rank] - b[spec.rank] : b[spec.rank] - a[spec.rank]));
}

const P_SORTS = [
  { key: "fixScore", label: "Fixture run", dir: 1 },
  { key: "points", label: "Total points", dir: -1 },
  { key: "form", label: "Form", dir: -1 },
  { key: "ppg", label: "Points per game", dir: -1 },
  { key: "epNext", label: "Expected next", dir: -1 },
  { key: "cost", label: "Price", dir: -1 },
  { key: "selected", label: "Ownership", dir: -1 },
  { key: "goals", label: "Goals", dir: -1 },
  { key: "assists", label: "Assists", dir: -1 },
  { key: "xgi", label: "xG + xA", dir: -1 },
  { key: "defCon90", label: "Def. contributions", dir: -1 },
  { key: "minutes", label: "Minutes", dir: -1 },
  { key: "name", label: "Name", dir: 1 },
];

const pSortValue = (p, key) =>
  key === "xgi" ? p.xg + p.xa : key === "name" ? p.name.toLowerCase() : p[key];

function fillPlayerSorts() {
  $("psort").innerHTML = P_SORTS.map(
    (s) => `<option value="${s.key}">${esc(s.label)}</option>`
  ).join("");
  $("psort").value = pstate.sort.key;
  // The arrow is drawn from state rather than left at whatever the markup
  // said, so the default sort's direction and its indicator agree.
  $("psortdir").textContent = pstate.sort.dir === 1 ? "↓" : "↑";
}

const teamById = (id) =>
  (pstate.board && pstate.board.teams.find((t) => t.id === id)) || null;

// The game abbreviates five clubs in its own team list - "Spurs",
// "Man Utd", "Nott'm Forest" - so searching what those clubs are actually
// called returns nothing. These are the names people type.
const CLUB_ALIASES = {
  TOT: "tottenham hotspur",
  MUN: "manchester united",
  MCI: "manchester city",
  NFO: "nottingham forest",
  WOL: "wolverhampton wanderers",
  BHA: "brighton hove albion",
  NEW: "newcastle united",
  LEE: "leeds united",
  WHU: "west ham united",
};

// The gameweek columns the ticker is built on. A blank is a club with no
// fixture in one of them, which is only visible because the columns come
// from the run rather than from any one club's fixture list.
function runEvents() {
  const b = pstate.board;
  if (!b) return [];
  return Array.from({ length: b.horizon }, (_, i) => b.event + i);
}

function filteredPlayers() {
  const b = pstate.board;
  if (!b) return [];
  const q = pstate.search.trim().toLowerCase();
  // Resolved once, not once per player: the band is the same for all 655
  // rows, and it is rebuilt on every keystroke of the search box.
  const band = pstate.strength
    ? new Set(strengthClubs(pstate.strength).map((t) => t.id))
    : null;
  const rows = b.players.filter((p) => {
    if (pstate.pos !== "all" && p.position !== pstate.pos) return false;
    if (pstate.team && p.teamId !== Number(pstate.team)) return false;
    if (pstate.minutes === 1 && p.minutes === 0) return false;
    if (pstate.minutes === 2 && p.status !== "a") return false;
    if (band && !band.has(p.teamId)) return false;
    if (!q) return true;
    const t = teamById(p.teamId);
    return p.name.toLowerCase().includes(q)
      || p.team.toLowerCase().includes(q)
      || (t && t.name.toLowerCase().includes(q))
      || (CLUB_ALIASES[p.team] || "").includes(q);
  });

  const { key, dir } = pstate.sort;
  rows.sort((a, b2) => {
    const x = pSortValue(a, key), y = pSortValue(b2, key);
    if (x < y) return -dir;
    if (x > y) return dir;
    // Total points is the tiebreak everywhere: two identical fixture runs
    // are not two equally interesting players.
    return b2.points - a.points;
  });
  return rows;
}

// A player's own lens on their club's run.
const lensScore = (f, group) => (group === "def" ? f.defScore : f.attScore);

function fixturesByEvent(teamId) {
  const t = teamById(teamId);
  const map = new Map();
  if (!t) return map;
  for (const f of t.fixtures) {
    if (!map.has(f.event)) map.set(f.event, []);
    map.get(f.event).push(f);
  }
  return map;
}

const availFlag = (p) => {
  if (p.status === "a") return "";
  const label = p.chance >= 0 ? `${p.chance}%` : { d: "?", i: "INJ", s: "SUS", u: "OUT" }[p.status] || "OUT";
  return `<span class="flag ${esc(p.status)}" data-tip="${esc(p.news || "Not fully available")}">${esc(label)}</span>`;
};

function fxChip(f, group) {
  const score = lensScore(f, group);
  const mode = pstate.cells;
  const cls = [
    fdrClass(score),
    f.home ? "home" : "away",
    f.midweek ? "mid" : "",
    mode === "score" ? "solo" : mode === "opp" ? "nameonly" : "",
  ].filter(Boolean).join(" ");
  // Whatever the cell drops still reaches the reader on hover, so the
  // score-only view is a change of emphasis rather than a loss of detail.
  const tip = `${f.home ? "vs" : "away at"} ${f.opponent} · GW${f.event} · ${score.toFixed(1)}/10`
    + (f.midweek ? " · midweek" : "")
    + (f.restDays && f.restDays <= 4 ? ` · ${f.restDays} days' rest` : "");
  const body = mode === "score"
    ? `<span class="s">${score.toFixed(1)}</span>`
    : mode === "opp"
      ? `<span class="o">${esc(f.opponent)}</span>`
      : `<span class="o">${esc(f.opponent)}</span><span class="s">${score.toFixed(1)}</span>`;
  return `<span class="fx-chip ${cls}" data-tip="${esc(tip)}">${body}</span>`;
}

// One gameweek's cell for one club: a blank, a match, or a double with
// both stacked. A double is left as two chips rather than averaged - two
// fixtures is the fact that matters most about that week.
function fxCell(list, group) {
  if (!list || !list.length) return `<span class="fx-blank" data-tip="Blank gameweek">—</span>`;
  const dbl = list.length > 1 ? " dbl" : "";
  return `<span class="fx-cell${dbl}">${list.map((f) => fxChip(f, group)).join("")}</span>`;
}

function playerIdentity(p) {
  return `<span class="pwho">
    <span class="pn">${esc(p.name)}${availFlag(p)}</span>
    <span class="pm"><span class="ppos">${esc(p.position)}</span>${esc(p.team)} · £${p.cost.toFixed(1)}</span>
  </span>`;
}

const avgCell = (p) =>
  p.fixtures
    ? `<span class="avgcell ${fdrClass(p.fixScore)}" data-tip="${esc(`Mean difficulty over ${p.fixtures} fixture${p.fixtures === 1 ? "" : "s"}`)}">${p.fixScore.toFixed(1)}</span>`
    : '<span class="faint">—</span>';

function playerTable(rows) {
  const events = runEvents();
  const head = `<tr>
    <th scope="col" class="t-who">Player</th>
    <th scope="col">Pts</th>
    <th scope="col">Form</th>
    <th scope="col">xGI</th>
    <th scope="col" data-tip="Defensive contributions per 90 minutes - tackles, interceptions, blocks and recoveries, the stat that scores points for defenders and midfielders">DC90</th>
    <th scope="col">Own</th>
    <th scope="col">Run</th>
    ${events.map((e) => `<th scope="col" class="t-gw">GW${e}</th>`).join("")}
  </tr>`;

  const body = rows.map((p) => {
    const byEvent = fixturesByEvent(p.teamId);
    return `<tr tabindex="0" data-player="${p.id}">
      <td class="t-who">${playerIdentity(p)}</td>
      <td><span class="num gwpts">${p.points}</span></td>
      <td><span class="num dim">${p.form.toFixed(1)}</span></td>
      <td><span class="num dim">${(p.xg + p.xa).toFixed(1)}</span></td>
      <td><span class="num dim">${p.defCon90.toFixed(1)}</span></td>
      <td><span class="num dim">${p.selected.toFixed(1)}%</span></td>
      <td>${avgCell(p)}</td>
      ${events.map((e) => `<td class="fx">${fxCell(byEvent.get(e), p.group)}</td>`).join("")}
    </tr>`;
  }).join("");

  return `<div class="table-scroll"><table class="ticker"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

function playerList(rows) {
  const events = runEvents();
  const body = rows.map((p) => {
    const byEvent = fixturesByEvent(p.teamId);
    return `<div class="prow" tabindex="0" data-player="${p.id}">
      ${playerIdentity(p)}
      ${avgCell(p)}
      <span class="pnums">
        <span><b>${p.points}</b> pts</span>
        <span><b>${p.form.toFixed(1)}</b> form</span>
        <span><b>${(p.xg + p.xa).toFixed(1)}</b> xGI</span>
        <span><b>${p.defCon90.toFixed(1)}</b> DC90</span>
        <span><b>${p.selected.toFixed(1)}%</b> owned</span>
      </span>
      <span class="prun">${events.map((e) => fxCell(byEvent.get(e), p.group)).join("")}</span>
    </div>`;
  }).join("");
  return `<div class="plist">${body}</div>`;
}

function playerSkeleton() {
  const rows = Array.from({ length: 10 }, (_, i) => `
    <div class="prow">
      <span class="pwho">${skBar(6.5 * skJitter(i, 1), i)}${skBar(4.2 * skJitter(i, 2), i)}</span>
      <span class="pnums">${skBar(3, i)}</span>
      <span class="prun">${skBar(20 * skJitter(i, 3), i)}</span>
    </div>`).join("");
  return `<div class="plist skeleton">${rows}</div>`;
}

function renderPlayers() {
  const b = pstate.board;
  if (!b) return;
  const all = filteredPlayers();
  const rows = all.slice(0, P_LIMIT);

  if (!rows.length) {
    $("ppanel").innerHTML =
      `<div class="msg empty">No player matches those filters. Try clearing the search or the club.</div>`;
    return;
  }

  const capped = all.length > rows.length
    ? `<span>Showing the first ${rows.length} of ${all.length} — narrow the search, club or position to see the rest.</span>`
    : "";

  $("ppanel").innerHTML =
    `<h2 class="eyebrow">gw${b.event}–${b.event + b.horizon - 1} · ${all.length} players</h2>`
    + bandLine()
    + (isMobile() ? playerList(rows) : playerTable(rows))
    + playerNotes(capped);
  updateScrollHint();
}

// A filter that removes three quarters of the table owes the reader the
// list it kept. Naming the clubs in rank order also answers the question
// the band was standing in for - who the good attacking sides actually
// are - without making anyone open a second view to find out.
function bandLine() {
  const spec = STRENGTH[pstate.strength];
  if (!spec) return "";
  const clubs = strengthClubs(pstate.strength);
  if (!clubs.length) return "";
  const key = spec.rank === "attackRank" ? "attack" : "defence";
  const chips = clubs.map((t) => {
    const n = spec.rank === "attackRank"
      ? `${t.xgPer90.toFixed(2)} xG per 90`
      : `${t.xgcPer90.toFixed(2)} xGC per 90`;
    return `<span class="band-club" data-tip="${esc(`${t.name} — ${ordinal(t[spec.rank])} of ${pstate.board.teams.length} for ${key} · ${n}`)}">
      <b>${esc(t.short)}</b><i>${ordinal(t[spec.rank])}</i></span>`;
  }).join("");
  return `<div class="bandline"><span class="bl-lbl">${esc(spec.label)}</span>${chips}</div>`;
}

function playerNotes(capped) {
  const items = [
    ["fdr1", "1–3.4", "kind", "A soft fixture: a weak squad at home, or a defence that has been giving up chances"],
    ["fdr3", "4.7–5.6", "even", "An average Premier League fixture"],
    ["fdr5", "6.9–10", "brutal", "Away at a strong squad, or against the division's best attack"],
  ].map(([cls, range, label, tip]) =>
    `<span class="lg-item" data-tip="${esc(tip)}"><span class="fx-chip ${cls}" aria-hidden="true"><span class="s">${esc(range)}</span></span> ${esc(label)}</span>`
  ).join("");

  return `<h2 class="eyebrow">reading the ticker</h2>
    <div class="legend">${items}
      <span class="lg-item" data-tip="Tuesday to Thursday: a second match in a week, which the score is adjusted for">
        <span class="fx-chip fdr3 mid" aria-hidden="true"><span class="o">WED</span></span> midweek round</span>
      <span class="lg-item" data-tip="A club with no fixture that gameweek - the player scores nothing at all">
        <span class="fx-blank" aria-hidden="true">—</span> blank gameweek</span>
    </div>
    <div class="notes">
      <span>Scores run <b>1 (easiest)</b> to <b>10 (hardest)</b> and are rated for the player's own job: a forward's
        score is about the opponent's defence, a defender's about their attack.${
          pstate.cells === "score" ? "" : " <b>lowercase</b> opponents are away."}</span>
      <span>${pstate.cells === "score"
        ? "Hover a cell for the opponent and the date. "
        : ""}Select a player for the season line and the reason behind every one of their fixture scores.</span>
      ${capped}
    </div>`;
}

// ── one player ────────────────────────────────────────────────────────

// The widest term the model can produce, so every bar on every fixture is
// drawn to one scale - bars renormalised per fixture would make a 0.2 look
// like a 1.6 on a quiet week.
const TERM_MAX = 1.7;

// What a term actually does to the fixture, in words. This replaced five
// signed decimals: the sign convention was never explained anywhere on the
// page, and "+0.06" is the model's unit rather than an answer to the
// question the reader is asking.
function effect(v) {
  const a = Math.abs(v);
  if (a < 0.08) return { word: "no effect", cls: "" };
  const dir = v > 0 ? "harder" : "easier";
  const cls = v > 0 ? "hard" : "easy";
  return { word: (a >= 0.9 ? "much " : "") + dir, cls };
}

// How a fixture reads as a whole, on the same five bands as the ticker's
// colour ramp - so the word and the cell agree.
function scoreWord(score) {
  if (score <= 3.4) return "kind";
  if (score <= 4.6) return "soft";
  if (score <= 5.6) return "even";
  if (score <= 6.8) return "tough";
  return "brutal";
}

const ordinal = (n) => {
  const s = ["th", "st", "nd", "rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
};

// "1st most expensive of 20" is a sentence nobody says. The two ends of a
// table have names, and using them is both shorter and the thing a reader
// was going to translate the ordinal into anyway.
function rankPhrase(rank, best, worst, middle, total, article) {
  if (!rank) return "";
  const the = article ? "the " : "";
  if (rank === 1) return `${the}<b>${best}</b> in the league`;
  if (rank === total) return `${the}<b>${worst}</b> in the league`;
  return `${the}<b>${ordinal(rank)}</b> ${middle} of ${total}`;
}

const rankSuffix = (phrase) => (phrase ? ` · ${phrase}` : "");

function term(label, v, sub) {
  const e = effect(v);
  const pct = Math.min(Math.abs(v) / TERM_MAX, 1) * 50;
  const style = v >= 0 ? `left:50%;width:${pct}%` : `right:50%;width:${pct}%`;
  return `<span class="term ${e.cls}">
    <span>${esc(label)}</span>
    <span class="bar"><i style="${style}"></i></span>
    <span class="eff">${esc(e.word)}</span>
    ${sub ? `<span class="tsub">${sub}</span>` : ""}
  </span>`;
}

function fixtureRow(f, p) {
  const score = lensScore(f, p.group);
  const matchup = p.group === "def" ? f.defMatchup : f.attMatchup;
  const opp = teamById(f.oppId);
  const me = teamById(p.teamId);
  const oppName = opp ? opp.name : f.opponent;
  const kick = new Date(f.kickoff).toLocaleDateString(undefined, {
    weekday: "short", day: "numeric", month: "short",
  });

  const meta = [
    `<span>${esc(kick)}</span>`,
    f.midweek ? '<span class="warn">midweek</span>' : "",
    f.restDays ? `<span>${f.restDays} days' rest</span>` : "",
  ].filter(Boolean).join("");

  // Squad is justified by league position rather than by a price. "17th of
  // 20" is a fact about the division; "£79m" is a number the reader would
  // have to rank against nineteen others themselves.
  const total = (pstate.board && pstate.board.teams.length) || 20;
  const squadSub = opp && opp.squadRank
    ? `${esc(oppName)} have ${rankPhrase(opp.squadRank,
        "most expensive squad", "cheapest squad", "most expensive squad", total, true)}`
    : "";

  // The matchup's evidence, led by expected goals. Chances given is the
  // measure that survives a small sample; the goals beside it are three or
  // four matches of finishing and goalkeeping, so they are shown second
  // and smaller in the model's weighting.
  let matchSub = "", matchLabel = "Their defence";
  if (opp) {
    if (p.group === "def") {
      matchLabel = "Their attack";
      matchSub = `<b>${opp.xgPer90.toFixed(2)} xG</b> per 90 · ${opp.gfPer90.toFixed(2)} scored`
        + rankSuffix(rankPhrase(opp.attackRank,
            "most dangerous attack", "least dangerous attack", "most dangerous", total, false));
    } else {
      matchSub = `<b>${opp.xgcPer90.toFixed(2)} xGC</b> per 90 · ${opp.gcPer90.toFixed(2)} conceded`
        + rankSuffix(rankPhrase(opp.defenceRank,
            "tightest defence", "leakiest defence", "tightest", total, false));
    }
  }

  const restSub = f.midweek || (f.restDays && f.restDays <= 4)
    ? [f.midweek ? "a midweek round" : "", f.restDays ? `${f.restDays} days since the last match` : ""]
        .filter(Boolean).join(" · ")
    : "";

  // Netted, so the sub-line has to name which way it went rather than
  // quote a percentage of minutes at somebody.
  const injSub = Math.abs(f.injury) < 0.08 ? ""
    : f.injury < 0
      ? `${esc(oppName)} are the more depleted side`
      : `${esc(me ? me.name : p.team)} are the more depleted side`;

  return `<div class="fxrow">
    <div class="fxhead">
      <span class="gw">GW${f.event}</span>
      <span class="opp">
        <span class="t">${f.home ? "vs" : "away at"} ${esc(oppName)}</span>
        <span class="k">${meta}</span>
      </span>
      <span class="fxscore">
        <span class="avgcell ${fdrClass(score)}">${score.toFixed(1)}</span>
        <span class="w">${esc(scoreWord(score))}</span>
      </span>
    </div>
    <div class="terms">
      ${term("Their squad", f.squad, squadSub)}
      ${term(matchLabel, matchup, matchSub)}
      ${term(f.home ? "Playing at home" : "Playing away", f.venue, "")}
      ${term("Turnaround", f.fatigue, restSub)}
      ${term("Injuries", f.injury, injSub)}
    </div>
  </div>`;
}

function openPlayer(id) {
  const p = pstate.board && pstate.board.players.find((x) => x.id === id);
  if (!p) return;
  pstate.dialog = id;
  renderPlayerDialog(p);
  openDialog($("player-dialog"));
}

function closePlayer() {
  pstate.dialog = null;
  closeDialog($("player-dialog"));
}

function renderPlayerDialog(p) {
  const t = teamById(p.teamId);
  const stats = [
    [p.points, "Points"], [p.form.toFixed(1), "Form"], [p.ppg.toFixed(1), "Per game"],
    [`£${p.cost.toFixed(1)}`, "Price"], [`${p.selected.toFixed(1)}%`, "Owned"],
    [p.minutes, "Minutes"], [p.starts, "Starts"], [p.goals, "Goals"],
    [p.assists, "Assists"], [p.xg.toFixed(2), "xG"], [p.xa.toFixed(2), "xA"],
    [p.cs, "Clean sheets"], [p.defCon, "Def. cont."],
    [p.defCon90.toFixed(1), "Def. cont./90"], [p.bonus, "Bonus"],
  ].map(([n, l]) => `<div class="pstat"><div class="n">${esc(String(n))}</div><div class="l">${esc(l)}</div></div>`).join("");

  const news = p.news
    ? `<div class="pnews"><div class="h">${esc(p.status === "s" ? "suspended" : p.status === "d" ? "doubt" : "unavailable")}</div>${esc(p.news)}</div>`
    : "";

  const fx = t ? t.fixtures.map((f) => fixtureRow(f, p)).join("") : "";
  const lens = p.group === "def"
    ? "rated for a defender: the opponent's attack is what makes it hard"
    : "rated for an attacker: the opponent's defence is what makes it hard";

  $("pl-panel").innerHTML = `
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="dlg-head">
      <div class="dlg-id">
        <div class="dlg-titles">
          <div class="dlg-entry" id="pl-entry">${esc(p.name)} ${availFlag(p)}</div>
          <div class="dlg-manager">${esc(p.position)} · ${esc(t ? t.name : p.team)}</div>
        </div>
        <button type="button" class="dlg-close" data-close aria-label="Close">✕</button>
      </div>
    </div>
    <div class="dlg-body">
      ${news}
      <h2 class="eyebrow" style="margin-top:0">season so far</h2>
      <div class="pstats">${stats}</div>
      <h2 class="eyebrow">next ${p.fixtures} fixture${p.fixtures === 1 ? "" : "s"}</h2>
      <div class="fxsum">
        <span>Mean difficulty <b>${p.fixScore ? p.fixScore.toFixed(1) : "—"}</b> out of 10, ${esc(lens)}.</span>
        <span class="axis">each bar runs ← easier · harder → from the middle</span>
      </div>
      <div class="fxlist">${fx || '<div class="msg empty">No fixtures scheduled in this run.</div>'}</div>
    </div>`;
}

$("player-dialog").addEventListener("close", () => { pstate.dialog = null; });

// ── loading ───────────────────────────────────────────────────────────

async function loadPlayers() {
  $("pgo").disabled = true;
  setSectionStatus("players", "stale", "Players & Fixtures", "fetching…", "");

  const keep = pstate.board && pstate.board.horizon === pstate.horizon;
  const scroller = keep && $("ppanel").querySelector(".table-scroll, .plist:not(.skeleton)");
  if (scroller) scroller.classList.add("loading");
  else $("ppanel").innerHTML = playerSkeleton();

  try {
    const res = await fetch(`/api/players?horizon=${pstate.horizon}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `request failed (${res.status})`);

    pstate.board = data;
    fillClubs(data);
    setSectionStatus("players", "ok", "Players & Fixtures",
      `gw${data.event}–${data.event + data.horizon - 1} · difficulty out of 10`,
      `${data.players.length} players`);
    renderPlayers();
  } catch (err) {
    setSectionStatus("players", "err", "Players & Fixtures", "failed", "");
    if (scroller) {
      scroller.classList.remove("loading");
      toast({
        kind: "err", key: "players",
        title: "could not rate fixtures",
        body: err.message,
        actions: [{ label: "Try again", run: () => loadPlayers() }],
      });
    } else {
      pstate.board = null;
      $("ppanel").innerHTML =
        `<div class="msg error"><div class="m-head">could not load</div><div class="m-body">${esc(err.message)}</div></div>`;
    }
  } finally {
    $("pgo").disabled = false;
    if (isMobile()) setFiltersOpen(false);
  }
}

function fillClubs(data) {
  const sel = $("pteam"), chosen = sel.value;
  sel.innerHTML = '<option value="">All clubs</option>' +
    [...data.teams].sort((a, b) => a.name.localeCompare(b.name))
      .map((t) => `<option value="${t.id}">${esc(t.name)}</option>`).join("");
  sel.value = chosen;
}

// ── section switching ─────────────────────────────────────────────────

const SECTION_TABS = { "sec-league": "league", "sec-players": "players" };

function setSection(section, push) {
  state.section = section;
  const players = section === "players";

  closeManager();
  closePlayer();
  for (const [id, v] of Object.entries(SECTION_TABS)) {
    const on = v === section;
    $(id).setAttribute("aria-selected", String(on));
    $(id).tabIndex = on ? 0 : -1;
  }

  $("controls").hidden = players;
  $("pcontrols").hidden = !players;
  $("panel").hidden = players;
  $("ppanel").hidden = !players;
  $("honours").hidden = players;
  $("filters-toggle").setAttribute("aria-controls", players ? "pcontrols" : "controls");
  $("filters-sub").textContent = players
    ? "Search, position, club and sort"
    : "League, gameweek, sort and view";

  if (push) {
    const url = new URL(location);
    players ? url.searchParams.set("section", "players") : url.searchParams.delete("section");
    history.replaceState(null, "", url);
  }

  if (players) {
    // The board is the same answer for everybody and cached hard, so this
    // is a fetch on first visit only.
    if (!pstate.board) loadPlayers();
    else {
      renderPlayers();
      setStatus("ok", "Players & Fixtures",
        `gw${pstate.board.event}–${pstate.board.event + pstate.board.horizon - 1} · difficulty out of 10`,
        `${pstate.board.players.length} players`);
    }
    moveIndicator($("pos-tabs"), true);
  } else if (state.report) {
    render();
    const countdown = deadlineCountdown(state.report.event.deadline_time);
    setStatus("ok", state.report.league.name,
      (state.report.provisional ? `${state.report.event.name} · provisional` : state.report.event.name)
        + (countdown ? ` · ${countdown}` : ""),
      `${state.report.gameweek.length} managers`);
  }
}

wireTabs($("sec-league").parentElement, (tab) => setSection(SECTION_TABS[tab.id], true));
wireTabs($("pos-tabs"), (tab) => {
  pstate.pos = tab.id.replace("pos-", "");
  renderPlayers();
});

// ── player control wiring ─────────────────────────────────────────────

$("pcontrols").addEventListener("submit", (e) => { e.preventDefault(); loadPlayers(); });

// Search is the only free-text control here, and unlike the league id it
// filters what is already loaded rather than fetching - so it can afford
// to run on every keystroke.
$("psearch").addEventListener("input", () => {
  pstate.search = $("psearch").value;
  if (pstate.board) renderPlayers();
});

$("pteam").addEventListener("change", () => {
  pstate.team = $("pteam").value;
  if (pstate.board) renderPlayers();
});

$("pstrength").addEventListener("change", () => {
  pstate.strength = $("pstrength").value;
  if (pstate.board) renderPlayers();
});

$("pcells").addEventListener("change", () => {
  pstate.cells = $("pcells").value;
  if (pstate.board) renderPlayers();
});

$("pminutes").addEventListener("change", () => {
  pstate.minutes = Number($("pminutes").value);
  if (pstate.board) renderPlayers();
});

$("psort").addEventListener("change", () => {
  const s = P_SORTS.find((x) => x.key === $("psort").value);
  pstate.sort = { key: s.key, dir: s.dir };
  $("psortdir").textContent = s.dir === 1 ? "↓" : "↑";
  if (pstate.board) renderPlayers();
});

$("psortdir").addEventListener("click", () => {
  pstate.sort = { key: pstate.sort.key, dir: -pstate.sort.dir };
  $("psortdir").textContent = pstate.sort.dir === 1 ? "↓" : "↑";
  if (pstate.board) renderPlayers();
});

// The horizon changes what the server rates, not just what is shown.
$("phorizon").addEventListener("change", () => {
  pstate.horizon = Number($("phorizon").value);
  loadPlayers();
});

// One delegated handler for both the table and the phone list, so a row
// added by either renderer is selectable without rewiring.
$("ppanel").addEventListener("click", (e) => {
  const row = e.target.closest("[data-player]");
  if (row) openPlayer(Number(row.dataset.player));
});

$("ppanel").addEventListener("keydown", (e) => {
