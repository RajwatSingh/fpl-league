<title>FPL League Rank</title>

<style>
/* ── Palette ───────────────────────────────────────────────────────────
   Neutrals carry a blue-violet cast (hue 285) at low chroma; accents sit
   at near-constant lightness and are separated by hue angle, each with
   exactly one job.

   That last property means the accent set is a syntax theme, NOT a chart
   palette: run through the CVD validator, blue and purple are 0.4 ΔE
   apart for a deuteranope. So nothing here encodes a value by hue alone.
   State uses a hue plus a glyph.

   n0 sits well below n1 rather than the portfolio's 0.04 step: this page
   is one big table, and at that step the table dissolved into the page
   instead of sitting on it. The deeper ground is what gives every raised
   surface - strip, inputs, rows, cards - an edge to read against.        */
:root {
  --n0: oklch(0.15 0.016 285); /* page ground: deliberately below n1 */
  --n1: oklch(0.23 0.020 285);
  --n2: oklch(0.27 0.022 285);
  --n3: oklch(0.32 0.022 285);
  --n4: oklch(0.42 0.022 285);  /* hairline: furniture, not signal */
  --n5: oklch(0.594 0.020 285); /* interactive edges, inputs */
  --n6: oklch(0.74 0.016 285);
  --n7: oklch(0.84 0.012 285);
  --n8: oklch(0.95 0.008 285);

  /* One job each. Cyan was retired: it encoded "players left to play",
     which is a potential rather than a good outcome, so a positive-coded
     hue misread it - that number is neutral now and the live dot carries
     the in-progress signal instead. */
  --blue:   oklch(0.78 0.11 255);
  --purple: oklch(0.78 0.13 300);
  --green:  oklch(0.80 0.15 150);
  --orange: oklch(0.80 0.13 65);
  --rose:   oklch(0.75 0.13 15);
  --gold:   oklch(0.83 0.15 95); /* the league leader only - a real table's one gilt edge */

  --radius: 0.25rem;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --mono: "Martian Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
html {
  scrollbar-width: thin; scrollbar-color: var(--n3) transparent;
  -webkit-text-size-adjust: 100%;
}
body {
  margin: 0;
  background: var(--n0);
  color: var(--n8);
  font-family: var(--sans);
  font-size: 0.9375rem;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 2px; }

.skip {
  position: absolute; left: -9999px; top: 0; z-index: 10;
  background: var(--n2); color: var(--n8); padding: 0.5rem 0.75rem;
  font-family: var(--mono); font-size: 0.75rem;
}
.skip:focus { left: 0.75rem; top: 0.75rem; }

.wrap { max-width: 78rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

/* ── Status strip ──────────────────────────────────────────────────────
   The portfolio's systemctl-style header: a dot, the subject, the state.
   This is a machine reporting on itself, so it stays in the mono voice. */
.strip {
  display: flex; align-items: center; gap: 0.625rem; flex-wrap: wrap;
  border: 1px solid var(--n5);
  border-radius: var(--radius);
  padding: 0.625rem 0.875rem;
  font-family: var(--mono);
  font-size: 0.75rem;
  background: var(--n1);
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex: none; }
.dot.stale { background: var(--n5); }
.dot.err { background: var(--rose); }
.strip .subject { color: var(--n8); font-weight: 500; }
.strip .dash { color: var(--n4); }
.strip .state { color: var(--n6); }
.strip .right { margin-left: auto; color: var(--n6); }

/* ── Controls ──────────────────────────────────────────────────────────
   Inputs get the strong border step: an edge you are meant to click must
   read at a glance, unlike a hairline rule.                             */
.controls {
  display: flex; gap: 0.75rem; align-items: flex-end; flex-wrap: wrap;
  margin: 1.5rem 0 2rem;
}
.field { display: flex; flex-direction: column; gap: 0.375rem; min-width: 0; }
.field label {
  font-family: var(--mono); font-size: 0.6875rem; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--n6);
}
input[type="number"], select {
  font-family: var(--mono); font-size: 0.8125rem;
  background: var(--n1); color: var(--n8);
  border: 1px solid var(--n5); border-radius: var(--radius);
  padding: 0.5rem 0.625rem; min-width: 8.5rem;
  line-height: 1.4;
  transition: border-color 180ms var(--ease);
}
/* The popup a <select> opens is a separate surface and does NOT inherit the
   select's font-size — it has to be set on the options themselves, or the
   list renders at the browser default and comes out tiny next to the
   control that opened it. Chrome and Firefox honour these; Safari styles
   the popup itself and ignores most of them, which is fine because Safari's
   default is already legible. */
select option {
  font-family: var(--sans);
  font-size: 1rem;
  background: var(--n1);
  color: var(--n8);
  padding: 0.5rem 0.625rem;
}

input[type="number"]:hover, select:hover { border-color: var(--n6); }
input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; }

button {
  font-family: var(--mono); font-size: 0.8125rem; font-weight: 500;
  background: var(--n2); color: var(--n8);
  border: 1px solid var(--n5); border-radius: var(--radius);
  padding: 0.5rem 0.9rem; cursor: pointer;
  transition: background 180ms var(--ease), border-color 180ms var(--ease);
}
button:hover:not(:disabled) { background: var(--n3); border-color: var(--n6); }
button:disabled { opacity: 0.5; cursor: default; }

/* Refresh is the one action on the page that isn't reachable any other
   way: every filter beside it already refetches on change, so this exists
   for the live gameweek case - pull the scores again, now. It gets the
   only filled control treatment so the hierarchy tells the truth. */
#go {
  background: color-mix(in oklch, var(--blue) 20%, var(--n2));
  border-color: color-mix(in oklch, var(--blue) 55%, transparent);
  color: var(--n8);
}
#go:hover:not(:disabled) {
  background: color-mix(in oklch, var(--blue) 32%, var(--n2));
  border-color: var(--blue);
}

.sortrow { display: flex; gap: 0.375rem; }
.sortrow select { min-width: 9rem; }
.sortrow button { min-width: 2.25rem; padding: 0.5rem 0; font-size: 0.875rem; }

/* Selection and hover have to be different channels, not two steps on the
   same neutral ramp - at n3 for both, a hovered tab was indistinguishable
   from the selected one. Selection is a lighter fill plus an accent rule
   along the bottom; hover stays a plain neutral lift. */
.toggle { display: flex; border: 1px solid var(--n5); border-radius: var(--radius); overflow: hidden; }
.toggle button {
  border: 0; border-radius: 0; background: transparent; color: var(--n6);
  white-space: nowrap; box-shadow: inset 0 -2px 0 0 transparent;
  transition: background 180ms var(--ease), color 180ms var(--ease), box-shadow 180ms var(--ease);
}
.toggle button + button { border-left: 1px solid var(--n5); }
.toggle button[aria-pressed="true"],
.toggle button[aria-pressed="true"]:hover {
  background: var(--n4); color: var(--n8);
  box-shadow: inset 0 -2px 0 0 var(--blue);
}

.phase-status {
  font-family: var(--mono); font-size: 0.625rem; font-weight: 500;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--n4);
  margin-left: 0.5rem;
}

/* ── Section eyebrow ───────────────────────────────────────────────────
   Same idiom as the portfolio's fpl-status heading.                     */
.eyebrow {
  display: flex; align-items: center; gap: 0.75rem;
  font-family: var(--mono); font-size: 0.6875rem; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--n6);
  margin: 2.25rem 0 0.875rem;
}
.eyebrow::after { content: ""; height: 1px; flex: 1; background: var(--n4); }

/* ── Table ─────────────────────────────────────────────────────────────*/
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
thead th {
  font-family: var(--mono); font-size: 0.625rem; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--n6);
  text-align: right; padding: 0 0.6rem 0.55rem; white-space: nowrap;
  border-bottom: 1px solid var(--n4);
}
thead th:nth-child(-n+2) { text-align: left; }
thead th.sortable { cursor: pointer; }
thead th.sortable:hover { color: var(--blue); }
thead th[aria-sort] { color: var(--blue); }
thead th .caret { opacity: 0.7; }

tbody td {
  padding: 0.5rem 0.6rem; text-align: right; white-space: nowrap;
  border-bottom: 1px solid color-mix(in oklch, var(--n4) 45%, transparent);
}
tbody td:nth-child(-n+2) { text-align: left; }
tbody tr { transition: background 150ms var(--ease); }
tbody tr.row:hover { background: var(--n1); }
tbody tr.row.open { background: var(--n1); }

.rank { font-family: var(--mono); color: var(--n6); font-size: 0.8125rem; }
.rankcell { display: flex; flex-direction: column; gap: 0.1rem; }
.rankline { display: flex; align-items: center; gap: 0.35rem; }
/* Points behind the leader - the thing a rank number alone doesn't say. */
.gap { font-family: var(--mono); font-size: 0.6875rem; color: var(--n5); }
.who { display: flex; flex-direction: column; line-height: 1.3; }
.who .name { color: var(--n8); }
.who .team { font-size: 0.75rem; color: var(--n6); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.dim { color: var(--n6); }
.faint { color: var(--n4); }
/* Orange is this palette's numeral hue. It goes on the gameweek score and
   nothing else in the table: that is the figure people refresh to watch,
   and it is what the flash below animates, so hue and motion point at the
   same number. Total is the anchor rather than the drama - brightest
   neutral, so it still reads first among the plain columns without
   competing with the live score at either end of the row. */
.gwpts { font-weight: 500; color: var(--orange); }
.total { color: var(--n8); font-weight: 500; }
.hit { color: var(--rose); }

/* A live score changing between loads gets one green pulse - motion that
   depicts the thing that actually happened, rather than decoration. */
@keyframes flashpulse {
  from { background: color-mix(in oklch, var(--green) 35%, transparent); }
  to { background: transparent; }
}
.gwpts.flash { animation: flashpulse 1.8s var(--ease) both; border-radius: 3px; padding: 0 0.25rem; margin: 0 -0.25rem; }

/* Rank movement. Green/rose are 4.6 ΔE apart for a deuteranope, which is
   below even the conditional floor — so the arrow is load-bearing, not
   decoration, and the colour is a second channel on top of it. */
.move { font-family: var(--mono); font-size: 0.75rem; }
.move.up { color: var(--green); }
.move.down { color: var(--rose); }
.move.flat { color: var(--n4); }

/* ── Table drama ───────────────────────────────────────────────────────
   A league table's whole point is the gap between people. The leader gets
   this site's one gilt edge - a real table's convention, not a trophy
   emoji - as an inset shadow so it costs no layout. */
tbody tr.row.leader { box-shadow: inset 3px 0 0 0 var(--gold); }
tbody tr.row.leader .rank { color: var(--gold); }

/* Chips are categorical, but four hues from this palette would not
   survive CVD. One hue, and the two-letter label does the identifying. */
.chip {
  font-family: var(--mono); font-size: 0.6875rem; font-weight: 500;
  color: var(--purple);
  border: 1px solid color-mix(in oklch, var(--purple) 35%, transparent);
  border-radius: 2px; padding: 0.1rem 0.3rem;
}

/* ── Weekly honours ───────────────────────────────────────────────────
   Two tallies, and they must not be told apart by hue alone: each badge
   carries its own word, and the season columns carry a count. Green is
   the win (success, per the palette contract); orange is the bench,
   matching the meter directly beside it in the same table.            */
.badge {
  font-family: var(--mono); font-size: 0.625rem; font-weight: 600;
  letter-spacing: 0.06em; border-radius: 2px; padding: 0.05rem 0.28rem;
  white-space: nowrap;
}
.badge.win {
  color: var(--green);
  border: 1px solid color-mix(in oklch, var(--green) 35%, transparent);
}
.badge.benchwin {
  color: var(--orange);
  border: 1px solid color-mix(in oklch, var(--orange) 35%, transparent);
}
.badges { display: inline-flex; gap: 0.3rem; margin-left: 0.4rem; vertical-align: 1px; }
.tally { display: inline-flex; align-items: center; gap: 0.35rem; justify-content: flex-end; }
.tally .n { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tally .n.zero { color: var(--n4); }

/* ── Bench meter ───────────────────────────────────────────────────────
   Magnitude across one series: one hue, length carries the value. Thin
   mark, rounded data-end, anchored to a baseline shared by every row so
   the lengths are comparable down the column.                           */
.bench { display: flex; align-items: center; gap: 0.5rem; justify-content: flex-end; }
.bench .val { min-width: 1.75rem; text-align: right; }
.meter { width: 3.5rem; height: 5px; background: var(--n2); border-radius: 3px; overflow: hidden; flex: none; }
.meter > i { display: block; height: 100%; background: var(--orange); border-radius: 3px; }
.derived { color: var(--orange); font-size: 0.75rem; }

/* ── Transfer detail ───────────────────────────────────────────────────*/
tr.detail td { padding: 0.75rem 0.6rem; border-bottom: 1px solid color-mix(in oklch, var(--n4) 45%, transparent); }
.tf-list { display: flex; flex-wrap: wrap; gap: 0.4rem 1.25rem; font-family: var(--mono); font-size: 0.75rem; color: var(--n7); }
.tf-list .out { color: var(--n6); }
.tf-list .arrow { color: var(--n4); margin: 0 0.3rem; }
.tf-none { font-size: 0.75rem; color: var(--n6); font-style: italic; }

/* ── Manager menu ─────────────────────────────────────────────────────
   A row opens onto four options rather than straight into content - a
   name is pressed to ask "what about this manager", and the option is a
   second, more specific question. Both steps, and everything inside the
   content they reveal, arrive with the same staggered fade+blur entrance
   the portfolio's team sheet uses for a squad appearing line by line. */
@keyframes cardin {
  from { opacity: 0; transform: translateY(10px); filter: blur(3px); }
  to { opacity: 1; transform: none; filter: blur(0); }
}
/* Pinned to the scroll container's left edge and sized to it in JS
   (fitDetailWraps), so content wraps to what's actually visible instead of
   the full, much wider, ten-column table underneath it. */
.opt-wrap { position: sticky; left: 0; box-sizing: border-box; }

.opt-menu { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.opt-btn {
  font-family: var(--mono); font-size: 0.75rem; font-weight: 500;
  background: var(--n2); color: var(--n7);
  border: 1px solid var(--n5); border-radius: var(--radius);
  padding: 0.45rem 0.8rem; cursor: pointer;
  animation: cardin 280ms var(--ease) both; animation-delay: calc(var(--i) * 40ms);
  transition: background 150ms var(--ease), border-color 150ms var(--ease), color 150ms var(--ease);
}
.opt-btn:hover { border-color: var(--n6); color: var(--n8); }
/* At this size a tinted background and a coloured border weren't enough to
   find the selected pill at a glance, so selection flips the fill and the
   text instead - the one inversion on the page, and unmistakable.

   The :hover half is not redundant: the generic button:hover rule above is
   (0,2,1) and would otherwise outrank a bare [aria-pressed] at (0,2,0),
   repainting the selected pill as merely hovered - which is its state
   almost every time anyone looks at it, having just clicked it. */
.opt-btn[aria-pressed="true"],
.opt-btn[aria-pressed="true"]:hover {
  background: var(--blue); border-color: var(--blue); color: var(--n0); font-weight: 600;
}

.opt-content { margin-top: 0.9rem; }
.opt-loading, .opt-error { font-family: var(--mono); font-size: 0.8125rem; color: var(--n6); }
.opt-error { color: var(--rose); }

.squad-group { margin-bottom: 0.85rem; }
.squad-group:last-child { margin-bottom: 0; }
.squad-label {
  font-family: var(--mono); font-size: 0.625rem; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--n5); margin-bottom: 0.4rem;
}
.squad-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }

.pcard {
  display: flex; align-items: center; gap: 0.4rem;
  background: var(--n1); border: 1px solid var(--n4); border-radius: var(--radius);
  padding: 0.35rem 0.55rem; font-size: 0.8125rem;
  animation: cardin 320ms var(--ease) both; animation-delay: calc(var(--i) * 35ms);
}
.pcard.bench { opacity: 0.7; }
.pcard .pname { color: var(--n8); }
.pcard .pteam { color: var(--n6); font-size: 0.6875rem; font-family: var(--mono); }
.pcard .ppts { font-family: var(--mono); color: var(--orange); font-variant-numeric: tabular-nums; margin-left: 0.1rem; }
.pcard .ctag {
  font-family: var(--mono); font-size: 0.625rem; font-weight: 700; line-height: 1;
  color: var(--n0); background: var(--orange); border-radius: 2px; padding: 0.15rem 0.3rem;
}
.pcard .ctag.vtag { background: var(--n5); }

.fx-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.fx-dot.upcoming { background: var(--n5); }
.fx-dot.live { background: var(--green); animation: fxpulse 1.4s ease-in-out infinite; }
.fx-dot.finished, .fx-dot.none { background: var(--n3); }
/* Shallow on purpose: up to fifteen of these pulse at once in a squad, and
   a deeper trough read as twitching rather than as "live". */
@keyframes fxpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

.toplay-stats { display: flex; gap: 1.75rem; margin-bottom: 0.9rem; }
.toplay-stat {
  animation: cardin 280ms var(--ease) both; animation-delay: calc(var(--i) * 60ms);
}
.toplay-stat .n { font-family: var(--mono); font-size: 1.375rem; color: var(--n8); }
.toplay-stat .l { font-family: var(--mono); font-size: 0.625rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--n6); }

/* ── Messages ──────────────────────────────────────────────────────────
   The portfolio renders nothing when the FPL API is down, because no
   reader of a portfolio needs to know. A tool inverts that: the person
   here is trying to get an answer, and the failure is the answer.       */
.msg { border: 1px solid var(--n4); border-radius: var(--radius); padding: 1rem 1.1rem; margin-top: 1.5rem; font-size: 0.875rem; }
.msg.error { border-color: color-mix(in oklch, var(--rose) 45%, transparent); }
.msg.error .m-head { color: var(--rose); font-family: var(--mono); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; }
.msg .m-body { color: var(--n7); margin-top: 0.4rem; font-family: var(--mono); font-size: 0.8125rem; word-break: break-word; }
.msg.empty { color: var(--n6); }

.notes { margin-top: 1.25rem; font-size: 0.8125rem; color: var(--n6); display: grid; gap: 0.3rem; }
.notes b { color: var(--n7); font-weight: 500; }
.provisional { color: var(--n7); }

/* ── Motion ────────────────────────────────────────────────────────────
   One entrance, and what it staggers is a league table arriving row by
   row — the motion depicts its subject rather than decorating it.

   It is scoped to .fresh, which render() only sets when new data has just
   landed. render() rewrites the table's innerHTML on every sort, every row
   expand and every option tab, and without that gate each of those replayed
   a 25-row staggered entrance - half a second of wobble on interactions
   that should feel instant.                                              */
@keyframes rowin { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
tbody.fresh tr.row { animation: rowin 320ms var(--ease) both; animation-delay: calc(var(--i) * 18ms); }

/* Reorder. When the standings change, rows slide past each other rather
   than teleporting - the one piece of motion here that depicts the thing
   the whole page is about. Applied by flipRows() as a transform that is
   then released; see the JS for why it can't be a CSS transition alone. */
tbody tr.row.sliding { transition: transform 520ms var(--ease); }
/* ── Phone ─────────────────────────────────────────────────────────────
   The controls were a wrapping flex row with 8.5rem minimums, which on a
   390px screen collapsed into cramped half-width dropdowns. They become a
   two-column grid instead, with the league id, sort and view rows spanning
   the full width.

   The important number here is the 16px font on inputs and selects. Below
   16px, iOS Safari zooms the whole page in when a control takes focus and
   does not zoom back out — the single most common cause of a form feeling
   broken on an iPhone. Everything also gets a 44px minimum height, which
   is Apple's minimum touch target; the old 0.5rem padding gave 34px.     */
/* The filters toggle only exists as a mobile affordance — on desktop the
   form is always visible and this stays display:none. */
.filters-toggle { display: none; }

@media (max-width: 640px) {
  .wrap { padding: 1.25rem 0.875rem 3rem; }

  /* Collapsed by default: the form used to occupy the entire first screen,
     pushing the table below the fold on every load. Tucking it behind a
     summary button means results are visible immediately, and the button
     itself remains the way back in to change league/gameweek/sort. */
  .filters-toggle {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; margin-top: 1.25rem;
    font-family: var(--mono); font-size: 0.75rem; font-weight: 500;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--n7);
    background: var(--n1); border: 1px solid var(--n5); border-radius: var(--radius);
    padding: 0.65rem 0.875rem; min-height: 2.75rem;
  }
  .filters-toggle .ft-caret { color: var(--n5); transition: transform 200ms var(--ease); }
  .filters-toggle[aria-expanded="true"] .ft-caret { transform: rotate(180deg); }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem 0.625rem;
    align-items: end;
    margin: 0.75rem 0 1.5rem;
  }
  .controls.collapsed { display: none; }
  .f-league, .f-sort, .f-month, .f-view, #go { grid-column: 1 / -1; }
  .toggle button { font-size: 0.8125rem; padding: 0.5rem 0.3rem; }

  input[type="number"], select, button {
    font-size: 1rem;              /* 16px: below this iOS zooms on focus */
    min-height: 2.75rem;          /* 44px touch target */
    min-width: 0;
    width: 100%;
    padding: 0.5rem 0.7rem;
  }
  .field label { font-size: 0.75rem; }

  .sortrow select { min-width: 0; flex: 1; }
  .sortrow button { width: 2.75rem; min-width: 2.75rem; flex: none; padding: 0; }

  /* Otherwise inherits the generic mobile button rule's width:100%, which
     as a flex-basis forces every option onto its own full-width row. */
  .opt-btn { width: auto; min-height: 2.375rem; padding: 0.4rem 0.65rem; }

  .toggle { width: 100%; }
  .toggle button { flex: 1; }

  /* The table keeps all ten columns and scrolls sideways rather than
     hiding data; tightening the cells buys a couple of columns per screen. */
  table { font-size: 0.8125rem; }
  tbody td, thead th { padding-left: 0.45rem; padding-right: 0.45rem; }
  .strip { font-size: 0.6875rem; }

  /* Rank and manager pin to the left edge while the rest of the row scrolls
     underneath, so a name never disappears off-screen while you're reading
     its numbers - the single biggest complaint with a wide sideways table. */
  .table-scroll { position: relative; }
  thead th:nth-child(1), thead th:nth-child(2),
  tbody td:nth-child(1), tbody td:nth-child(2) {
    position: sticky; background: var(--n0); z-index: 1;
  }
  thead th:nth-child(1), tbody td:nth-child(1) { left: 0; min-width: 3rem; }
  thead th:nth-child(2), tbody td:nth-child(2) { left: 3rem; box-shadow: 1px 0 0 var(--n4); }
  tbody tr.row:hover td:nth-child(1), tbody tr.row:hover td:nth-child(2),
  tbody tr.row.open td:nth-child(1), tbody tr.row.open td:nth-child(2) { background: var(--n1); }

  /* A right-edge shadow signals there is more to scroll to; a gradient into
     the matching background colour would be invisible here, so this darkens
     the edge directly instead. It clears once scrolled to the end. */
  .table-scroll.has-overflow {
    box-shadow: inset -1.75rem 0 1rem -1rem rgba(0, 0, 0, 0.6);
    transition: box-shadow 150ms var(--ease);
  }
  .table-scroll.has-overflow.at-end { box-shadow: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<a class="skip" href="#results">Skip to results</a>
<div class="wrap">

  <header class="strip" id="strip">
    <span class="dot stale" id="dot" role="img" aria-label="status"></span>
    <span class="subject" id="subject">fpl-league-rank</span>
    <span class="dash">—</span>
    <span class="state" id="state">idle</span>
    <span class="right" id="count"></span>
  </header>

  <button type="button" class="filters-toggle" id="filters-toggle" aria-expanded="true" aria-controls="controls">
    <span>Filters</span><span class="ft-caret" aria-hidden="true">▾</span>
  </button>

  <form class="controls" id="controls">
    <div class="field f-league">
      <label for="league">League ID</label>
      <input type="number" id="league" name="league" min="1" placeholder="580906" required>
    </div>
    <div class="field f-gw">
      <label for="gw">Gameweek</label>
      <select id="gw" name="gw"><option value="0">Current</option></select>
    </div>
    <div class="field f-max" id="max-field">
      <label for="max">Managers</label>
      <select id="max" name="max">
        <option value="50">First 50</option>
        <option value="100">First 100</option>
        <option value="0">All</option>
      </select>
    </div>
    <div class="field f-month" id="month-field">
      <label for="month">Month</label>
      <select id="month"></select>
    </div>
    <div class="field f-sort" id="sort-field">
      <label for="sort">Sort by</label>
      <div class="sortrow">
        <select id="sort"></select>
        <button type="button" id="sortdir" title="Reverse the sort">↓</button>
      </div>
    </div>
    <div class="field f-view">
      <label for="view-gw">View</label>
      <div class="toggle" role="group" aria-label="View">
        <button type="button" id="view-gw" aria-pressed="true">Gameweek</button>
        <button type="button" id="view-season" aria-pressed="false">Season</button>
        <button type="button" id="view-monthly" aria-pressed="false">Monthly</button>
      </div>
    </div>
    <button type="submit" id="go" title="Fetch the latest scores">Refresh</button>
  </form>

  <main id="results">
    <div id="panel"></div>
  </main>
</div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
// The league this tool is for. Deliberately the only fallback: an earlier
// version also remembered the last league in localStorage, which meant one
// mistyped id (58006 is a real 2-manager league, so it loaded fine and was
// saved) silently replaced the default on every later visit with nothing on
// screen to explain it. An explicit ?league= still overrides.
const DEFAULT_LEAGUE = 580906;

const state = {
  view: "gw", sort: { key: "leagueRank", dir: 1 }, report: null, open: new Set(),
  // Which option (transfers/team/captain/toplay) is showing under each open
  // row, and the /api/team responses backing team/captain/toplay, cached by
  // "entryId:gw" so switching tabs back and forth doesn't refetch.
  tab: new Map(), teamCache: new Map(),
  // entryIds whose GW score changed since the last load - set just before
  // the one render() that should flash them, then cleared, so re-sorting or
  // reopening a row afterwards doesn't replay the animation.
  flashed: null,
};

// ── status strip ──────────────────────────────────────────────────────
function setStatus(kind, subject, text, right) {
  $("dot").className = "dot" + (kind === "ok" ? "" : kind === "err" ? " err" : " stale");
  $("subject").textContent = subject;
  $("state").textContent = text;
  $("count").textContent = right || "";
}

// Only meaningful before a deadline - once it's passed there's nothing left
// to count down to, so this returns null rather than "0m to deadline".
function deadlineCountdown(iso) {
  const ms = new Date(iso) - Date.now();
  if (!isFinite(ms) || ms <= 0) return null;
  const totalMin = Math.floor(ms / 60000);
  const days = Math.floor(totalMin / 1440);
  const hours = Math.floor((totalMin % 1440) / 60);
  const mins = totalMin % 60;
  if (days > 0) return `${days}d ${hours}h to deadline`;
  if (hours > 0) return `${hours}h ${mins}m to deadline`;
  return `${mins}m to deadline`;
}

// ── formatting ────────────────────────────────────────────────────────
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function movement(rank, lastRank) {
  if (!lastRank || !rank || lastRank === rank) return '<span class="move flat" aria-hidden="true">·</span>';
  const d = lastRank - rank;
  // The glyph carries the meaning; colour is the second channel only.
  return d > 0
    ? `<span class="move up">↑${d}</span>`
    : `<span class="move down">↓${-d}</span>`;
}

function meter(value, max) {
  const pct = max > 0 ? Math.round((value / max) * 100) : 0;
  return `<span class="meter" aria-hidden="true"><i style="width:${pct}%"></i></span>`;
}

// The rank number alone says a position; it doesn't say the margin. Every
// row but the leader's gets how many points behind they are - the number
// that actually carries a league table's stakes.
function rankCell(r, ctx, extra) {
  const gap = r.leagueRank === 1 || ctx.leaderTotal == null
    ? ""
    : `<span class="gap">−${ctx.leaderTotal - r.total}</span>`;
  return `<span class="rankcell"><span class="rankline"><span class="rank">${r.leagueRank}</span>${extra ? " " + extra : ""}</span>${gap}</span>`;
}

// ── column definitions ────────────────────────────────────────────────
const gwCols = [
  { key: "leagueRank", label: "#", sortLabel: "League rank", cell: (r, ctx) => rankCell(r, ctx, movement(r.leagueRank, r.lastRank)) },
  { key: "manager", label: "Team", cell: (r) =>
      `<span class="who"><span class="name">${esc(r.entry)}${weekBadges(r)}</span><span class="team">${esc(r.manager)}</span></span>` },
  { key: "netPoints", label: "GW", sortLabel: "GW points", num: true, cell: (r) => r.played
      ? `<span class="num gwpts${state.flashed && state.flashed.has(r.entryId) ? " flash" : ""}">${r.netPoints}</span>`
      : '<span class="faint">—</span>',
    title: (r) => r.played ? `${r.grossPoints} scored${r.hit ? ` − ${r.hit} hit` : ""} = ${r.netPoints}` : "not in this gameweek" },
  { key: "hit", label: "Hit", num: true, cell: (r) => r.hit ? `<span class="num hit">−${r.hit}</span>` : '<span class="faint">·</span>' },
  { key: "bench", label: "Bench", num: true, cell: (r) => r.played
      ? `<span class="num val">${r.bench}</span>${r.benchDerived ? '<span class="derived" title="Bench Boost week: the API reports 0, so this is recomputed from picks + live points">*</span>' : ""}`
      : '<span class="faint">—</span>' },
  { key: "chip", label: "Chip", cell: (r) => r.chip ? `<span class="chip">${esc(r.chip)}</span>` : '<span class="faint">·</span>' },
  { key: "transfers", label: "TF", sortLabel: "Transfers", num: true, cell: (r) => r.transfers ? `<span class="num dim">${r.transfers}</span>` : '<span class="faint">·</span>' },
  { key: "captain", label: "Captain", cell: (r) => r.captain ? `<span class="dim">${esc(r.captain)}</span>` : '<span class="faint">—</span>' },
  { key: "toPlay", label: "To play", num: true, cell: (r) => r.played
      ? `<span class="num${r.toPlay ? "" : " dim"}">${r.toPlay}</span>`
      : '<span class="faint">—</span>',
    title: (r) => r.played ? `${r.toPlay} yet to play · ${r.playingNow} playing now · ${r.finishedPlaying} finished (of ${r.squadCount})` : "not in this gameweek" },
  { key: "total", label: "Total", num: true, cell: (r) => `<span class="num total">${r.total}</span>` },
];

const seasonCols = [
  { key: "leagueRank", label: "#", sortLabel: "League rank", cell: (r, ctx) => rankCell(r, ctx) },
  { key: "manager", label: "Team", cell: (r) => `<span class="who"><span class="name">${esc(r.entry)}</span><span class="team">${esc(r.manager)}</span></span>` },
  { key: "total", label: "Total", num: true, cell: (r) => `<span class="num gwpts">${r.total}</span>` },
  { key: "gwWins", label: "Wins", sortLabel: "Gameweek wins", num: true, cell: (r) =>
      seasonTally(r.gwWins, "win", "★", r.gwWinWeeks && r.gwWinWeeks.map((w) => "GW" + w), "Gameweek wins:") },
  { key: "monthWins", label: "Months", sortLabel: "Month wins", num: true, cell: (r) =>
      seasonTally(r.monthWins, "win", "◆", r.monthWinNames, "Months won:") },
  { key: "benchTotal", label: "Benched", num: true, cell: (r, ctx) => `<span class="bench">${meter(r.benchTotal, ctx.maxBench)}<span class="num val">${r.benchTotal}</span></span>` },
  { key: "hitsTotal", label: "Hits", num: true, cell: (r) => r.hitsTotal ? `<span class="num hit">−${r.hitsTotal}</span>` : '<span class="faint">·</span>' },
  { key: "transfersTotal", label: "TF", sortLabel: "Transfers", num: true, cell: (r) => `<span class="num dim">${r.transfersTotal}</span>` },
  { key: "bestGwPoints", label: "Best GW", num: true, cell: (r) => r.bestGw ? `<span class="num">${r.bestGwPoints}</span> <span class="dim">GW${r.bestGw}</span>` : '<span class="faint">—</span>' },
  { key: "benchWins", label: "Bench wins", sortLabel: "Bench wins", num: true, cell: (r) =>
      seasonTally(r.benchWins, "benchwin", "▬", r.benchWinWeeks && r.benchWinWeeks.map((w) => "GW" + w), "Bench wins:") },
  { key: "chips", label: "Chips used", nosort: true, cell: (r) => (r.chipsUsed && r.chipsUsed.length)
      ? r.chipsUsed.map((c) => `<span class="chip">${esc(chipLabel(c.name))}<span class="dim"> ${c.event}</span></span>`).join(" ")
      : '<span class="faint">·</span>' },
];

// Rank columns sort ascending (1 is best); every other column is a magnitude
// where the interesting end is the top. One definition, used by both the
// dropdown and the column headers.
function defaultDir(key) {
  return key === "leagueRank" ? 1 : -1;
}

function setSort(key) {
  state.sort = key === state.sort.key
    ? { key, dir: -state.sort.dir }
    : { key, dir: defaultDir(key) };
  render();
}

function columnsFor(view) {
  return view === "season" ? seasonCols : gwCols;
}

// Rebuilds the dropdown when the view changes, since the two views expose
// different columns. Keeps the current key if it exists in the new view.
function fillSortOptions() {
  const cols = columnsFor(state.view).filter((c) => !c.nosort);
  if (!cols.some((c) => c.key === state.sort.key)) {
    state.sort = { key: "leagueRank", dir: 1 };
  }
  $("sort").innerHTML = cols
    .map((c) => `<option value="${c.key}">${esc(c.sortLabel || c.label)}</option>`)
    .join("");
  $("sort").value = state.sort.key;
}

// Ties are shared, so both badges can appear on more than one row in a week.
function weekBadges(r) {
  const b = [];
  if (r.wonGw) b.push('<span class="badge win" title="Highest score in this gameweek">★ WIN</span>');
  if (r.wonBench) b.push('<span class="badge benchwin" title="Most points left on the bench this gameweek">▬ BENCH</span>');
  return b.length ? `<span class="badges">${b.join("")}</span>` : "";
}

function seasonTally(n, cls, glyph, labels, verb) {
  if (!n) return '<span class="tally"><span class="n zero">·</span></span>';
  const t = `${verb} ${(labels || []).join(", ")}`;
  return `<span class="tally" title="${esc(t)}"><span class="badge ${cls}">${glyph}</span><span class="n">${n}</span></span>`;
}

function chipLabel(n) {
  return { wildcard: "WC", freehit: "FH", bboost: "BB", "3xc": "TC" }[n] || n;
}

// Where every row sits right now, keyed by entry id. Captured before the
// table is rewritten so flipRows() can work out what moved.
function rowPositions() {
  const map = new Map();
  $("panel").querySelectorAll("tr.row[data-entry]").forEach((tr) => {
    map.set(tr.dataset.entry, tr.getBoundingClientRect().top);
  });
  return map;
}

// FLIP: the rows are already in their final places by the time this runs,
// so each one is thrown back to where it used to be with an instant
// transform, then released on the next frame with the transition switched
// on - which the browser renders as a slide from old position to new.
// A plain CSS transition can't do this: the elements are destroyed and
// recreated by innerHTML, so there is no continuous element to animate.
function flipRows(before) {
  if (!before.size || prefersReducedMotion()) return;
  const moved = [];
  $("panel").querySelectorAll("tr.row[data-entry]").forEach((tr) => {
    const was = before.get(tr.dataset.entry);
    if (was == null) return;
    const delta = was - tr.getBoundingClientRect().top;
    if (!delta) return;
    tr.style.transform = `translateY(${delta}px)`;
    moved.push(tr);
  });
  if (!moved.length) return;
  requestAnimationFrame(() => {
    for (const tr of moved) {
      tr.classList.add("sliding");
      tr.style.transform = "";
    }
    // Drop the transition once it has played, so a later render that sets
    // a transform for a fresh FLIP isn't animated from this one's leftovers.
    setTimeout(() => {
      for (const tr of moved) tr.classList.remove("sliding");
    }, 560);
  });
}

function prefersReducedMotion() {
  return matchMedia("(prefers-reduced-motion: reduce)").matches;
}

// ── render ────────────────────────────────────────────────────────────
// fresh marks a render that follows new data, which is the only one that
// should replay the staggered row entrance.
function render(fresh) {
  const rep = state.report;
  if (!rep) return;

  const showSortRow = state.view !== "monthly";
  $("sort-field").style.display = showSortRow ? "" : "none";
  $("max-field").style.display = state.view === "gw" ? "" : "none";
  $("month-field").style.display = state.view === "monthly" ? "" : "none";

  if (state.view === "monthly") { fillMonthOptions(rep); renderMonthly(rep); return; }

  const season = state.view === "season";
  const rows = [...(season ? rep.season : rep.gameweek)];
  const cols = columnsFor(state.view);
  const benchKey = season ? "benchTotal" : "bench";
  const ctx = {
    maxBench: Math.max(1, ...rows.map((r) => r[benchKey] || 0)),
    leaderTotal: rows.length ? Math.max(...rows.map((r) => r.total)) : null,
  };

  const { key, dir } = state.sort;
  rows.sort((a, b) => {
    const av = a[key], bv = b[key];
    if (typeof av === "string") return dir * av.localeCompare(bv);
    return dir * ((av ?? -1) - (bv ?? -1));
  });

  const head = cols.map((c) => {
    if (c.nosort) return `<th scope="col">${esc(c.label)}</th>`;
    const active = c.key === key;
    const caret = active ? `<span class="caret">${dir === 1 ? "↑" : "↓"}</span>` : "";
    const sortAttr = active ? ` aria-sort="${dir === 1 ? "ascending" : "descending"}"` : "";
    return `<th scope="col" class="sortable" data-key="${c.key}" tabindex="0" role="button"${sortAttr}>${esc(c.label)} ${caret}</th>`;
  }).join("");

  const body = rows.map((r, i) => {
    const cells = cols.map((c) => {
      const t = c.title ? ` title="${esc(c.title(r))}"` : "";
      return `<td${t}>${c.cell(r, ctx)}</td>`;
    }).join("");
    const isOpen = state.open.has(r.entryId);
    const isLeader = r.leagueRank === 1;
    const rowClass = `row${isOpen ? " open" : ""}${isLeader ? " leader" : ""}`;
    let html = `<tr class="${rowClass}" style="--i:${Math.min(i, 30)}" data-entry="${r.entryId}" tabindex="0" role="button" aria-expanded="${isOpen}">${cells}</tr>`;
    if (isOpen) html += menuRow(r, cols.length, rep, season);
    return html;
  }).join("");

  $("sort").value = key;
  $("sortdir").textContent = dir === 1 ? "↑" : "↓";
  $("sortdir").setAttribute("aria-label", dir === 1 ? "Ascending, click to reverse" : "Descending, click to reverse");

  const label = season ? `season to ${esc(rep.event.name)}` : esc(rep.event.name);

  const before = rowPositions();
  $("panel").innerHTML = `
    <h2 class="eyebrow">${label}</h2>
    ${rep.provisional && !season ? '<p class="provisional">This gameweek is not finalised — bonus, gameweek ranks and bench points can still move.</p>' : ""}
    <div class="table-scroll"><table><thead><tr>${head}</tr></thead><tbody${fresh ? ' class="fresh"' : ""}>${body}</tbody></table></div>
    ${notes(season)}`;
  flipRows(before);

  $("panel").querySelectorAll("th.sortable").forEach((th) => {
    const act = () => setSort(th.dataset.key);
    th.addEventListener("click", act);
    th.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); } });
  });

  $("panel").querySelectorAll("tr.row").forEach((tr) => {
    const act = () => {
      const id = Number(tr.dataset.entry);
      state.open.has(id) ? state.open.delete(id) : state.open.add(id);
      render();
    };
    tr.addEventListener("click", act);
    tr.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); } });
  });

  $("panel").querySelectorAll(".opt-btn").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const entryId = Number(btn.dataset.entry);
      const tab = btn.dataset.tab;
      state.tab.set(entryId, state.tab.get(entryId) === tab ? null : tab);
      render();
    });
  });

  updateScrollHint();
  fitDetailWraps();
}

// The table can be far wider than the viewport once it's scrolling
// sideways, and a colspan cell's content is laid out against that full
// width, not what's actually visible. Sizing each wrap explicitly to the
// scroll container's own clientWidth is what makes squad cards and option
// buttons wrap at the screen edge instead of running off it.
function fitDetailWraps() {
  const scroller = $("panel").querySelector(".table-scroll");
  if (!scroller) return;
  $("panel").querySelectorAll(".opt-wrap").forEach((el) => {
    const pad = el.parentElement; // the td, whose own horizontal padding must come off
    const px = parseFloat(getComputedStyle(pad).paddingLeft) + parseFloat(getComputedStyle(pad).paddingRight);
    el.style.width = Math.max(0, scroller.clientWidth - px) + "px";
  });
}

// Phases arrive in calendar order (see monthlyPhases in fpl/report.go), so the
// last one is the most recent — the natural default when the tab is opened.
function fillMonthOptions(rep) {
  const phases = rep.monthly || [];
  if (!phases.some((p) => p.name === state.month)) {
    state.month = phases.length ? phases[phases.length - 1].name : null;
  }
  $("month").innerHTML = phases.map((p) => `<option value="${esc(p.name)}">${esc(p.name)}</option>`).join("");
  $("month").value = state.month || "";
}

function renderMonthly(rep) {
  const phases = rep.monthly || [];
  if (!phases.length) {
    $("panel").innerHTML = `<h2 class="eyebrow">monthly standings</h2><p class="tf-none">No month has started yet.</p>`;
    return;
  }
  const ph = phases.find((p) => p.name === state.month) || phases[phases.length - 1];

  const leaderPoints = ph.standings.length ? ph.standings[0].points : 0;
  const rows = ph.standings.map((r, i) => `
    <tr class="row${i === 0 ? " leader" : ""}" style="--i:${Math.min(i, 30)}">
      <td><span class="rankcell"><span class="rankline"><span class="rank">${i + 1}</span></span>${i === 0 ? "" : `<span class="gap">−${leaderPoints - r.points}</span>`}</span></td>
      <td><span class="who"><span class="name">${esc(r.entry)}${r.won ? '<span class="badges"><span class="badge win" title="Won this month">★ WIN</span></span>' : ""}</span><span class="team">${esc(r.manager)}</span></span></td>
      <td><span class="num gwpts">${r.points}</span></td>
    </tr>`).join("");

  $("panel").innerHTML = `
    <h2 class="eyebrow">${esc(ph.name)} <span class="phase-status">${ph.complete ? "final" : "provisional"}</span> <span class="dim">GW${ph.startEvent}–${ph.stopEvent}</span></h2>
    <div class="table-scroll"><table><thead><tr>
      <th scope="col">#</th><th scope="col">Team</th><th scope="col">Points</th>
    </tr></thead><tbody>${rows}</tbody></table></div>
    <div class="notes"><span>A month stays <b>provisional</b> until its last gameweek is finalised.</span></div>`;
  updateScrollHint();
}

// A row opens onto four options rather than straight into content. Team,
// Captain and To play all read the same /api/team payload for this report's
// gameweek - one lazy fetch per manager, cached so switching between them
// doesn't refetch. Transfers needs no fetch (it's already on the row), so
// it's the only option season/monthly views don't offer - there's no single
// gameweek's transfers to show once rows span the whole season.
const OPTIONS = [
  { key: "transfers", label: "Transfers", gwOnly: true },
  { key: "team", label: "Team" },
  { key: "captain", label: "Captain" },
  { key: "toplay", label: "To play" },
];

function menuRow(r, span, rep, season) {
  const opts = OPTIONS.filter((o) => !season || !o.gwOnly);
  const active = state.tab.get(r.entryId);

  const menu = `<div class="opt-menu">${opts.map((o, i) => `
    <button type="button" class="opt-btn" style="--i:${i}" data-entry="${r.entryId}" data-tab="${o.key}" aria-pressed="${active === o.key}">${esc(o.label)}</button>
  `).join("")}</div>`;

  let content = "";
  if (active === "transfers") content = transfersContent(r, rep);
  else if (active === "team" || active === "captain" || active === "toplay") content = teamContent(r, rep, active);

  return `<tr class="detail"><td colspan="${span}"><div class="opt-wrap">${menu}${content ? `<div class="opt-content">${content}</div>` : ""}</div></td></tr>`;
}

function transfersContent(r, rep) {
  const tf = r.transferDetail || [];
  return tf.length
    ? `<div class="tf-list">${tf.map((t) =>
        `<span><span class="out">${esc(rep.playerNames[t.out] || t.out)}</span><span class="arrow">→</span>${esc(rep.playerNames[t.in] || t.in)}</span>`
      ).join("")}</div>`
    : `<p class="tf-none">No transfers this gameweek.</p>`;
}

// Fetches (once) and caches the squad behind Team/Captain/To play. Firing a
// render() from inside the .then() is what turns a bare loading line into
// the populated, animated content once the response lands.
function teamKey(entryId, rep) { return `${entryId}:${rep.event.id}`; }

function ensureTeamData(entryId, rep) {
  const key = teamKey(entryId, rep);
  if (state.teamCache.has(key)) return state.teamCache.get(key);
  const slot = { status: "loading" };
  state.teamCache.set(key, slot);
  fetch(`/api/team?entry=${entryId}&gw=${rep.event.id}`)
    .then((res) => res.json().then((data) => ({ ok: res.ok, data })))
    .then(({ ok, data }) => {
      if (!ok) throw new Error(data.error || "request failed");
      state.teamCache.set(key, { status: "ready", data });
    })
    .catch((err) => state.teamCache.set(key, { status: "error", message: err.message }))
    .finally(() => { if (state.report) render(); });
  return slot;
}

function teamContent(r, rep, tab) {
  const slot = ensureTeamData(r.entryId, rep);
  if (slot.status === "loading") return `<p class="opt-loading">loading squad…</p>`;
  if (slot.status === "error") return `<p class="opt-error">${esc(slot.message)}</p>`;
  if (tab === "team") return squadView(slot.data);
  if (tab === "captain") return captainView(slot.data);
  return toPlayView(slot.data);
}

const FX_LABEL = { upcoming: "Yet to play", live: "Playing now", finished: "Finished", none: "No fixture" };

function playerCard(p, i, bench) {
  const tag = p.isCaptain
    ? '<span class="ctag" title="Captain">C</span>'
    : p.isViceCaptain ? '<span class="ctag vtag" title="Vice-captain">V</span>' : "";
  return `<span class="pcard${bench ? " bench" : ""}" style="--i:${i}">
    <span class="fx-dot ${p.fixtureStatus}" title="${esc(FX_LABEL[p.fixtureStatus] || p.fixtureStatus)}" aria-hidden="true"></span>
    <span class="pname">${esc(p.name)}</span>
    <span class="pteam">${esc(p.team)}</span>
    ${tag}
    <span class="ppts">${p.points}</span>
  </span>`;
}

function squadView(d) {
  let i = 0;
  const groups = ["GKP", "DEF", "MID", "FWD"].map((pos) => {
    const players = d.starters.filter((p) => p.position === pos);
    if (!players.length) return "";
    return `<div class="squad-group"><div class="squad-label">${pos}</div><div class="squad-row">${
      players.map((p) => playerCard(p, i++)).join("")}</div></div>`;
  }).join("");
  const bench = `<div class="squad-group"><div class="squad-label">Bench</div><div class="squad-row">${
    d.bench.map((p) => playerCard(p, i++, true)).join("")}</div></div>`;
  const chipNote = d.chip
    ? `<p class="opt-loading">${esc(d.chip)} played this gameweek${d.chip === "BB" ? " — bench points count." : "."}</p>` : "";
  return `${chipNote}${groups}${bench}`;
}

function captainView(d) {
  const card = (p, label) => p
    ? `<div class="squad-group"><div class="squad-label">${esc(label)}</div><div class="squad-row">${playerCard(p, 0)}</div></div>`
    : "";
  return card(d.captain, `Captain (${d.captain ? d.captain.multiplier : 1}×)`) + card(d.vice, "Vice-captain");
}

function toPlayView(d) {
  const stat = (n, l, i) => `<div class="toplay-stat" style="--i:${i}"><div class="n">${n}</div><div class="l">${esc(l)}</div></div>`;
  const relevant = d.chip === "BB" ? [...d.starters, ...d.bench] : d.starters;
  const upcoming = relevant.filter((p) => p.fixtureStatus === "upcoming");
  const live = relevant.filter((p) => p.fixtureStatus === "live");
  const list = (players, label) => players.length
    ? `<div class="squad-group"><div class="squad-label">${esc(label)}</div><div class="squad-row">${
        players.map((p, i) => playerCard(p, i)).join("")}</div></div>`
    : "";
  return `
    <div class="toplay-stats">${stat(d.toPlay, "yet to play", 0)}${stat(d.live, "playing now", 1)}${stat(d.finished, "finished", 2)}</div>
    <p class="tf-none">${d.ofTotal} players count this gameweek${d.chip === "BB" ? " — Bench Boost, bench included" : ""}.</p>
    ${list(upcoming, "Yet to play")}
    ${list(live, "Playing now")}
  `;
}

function notes(season) {
  return `<div class="notes">
    <span><b>GW</b> is net of the transfer hit — the API reports it gross. Hover a score for the breakdown.</span>
    ${season
      ? '<span><b>Benched</b> reads 0 for any Bench Boost week, which is what the API reports for them.</span>'
      : '<span><b>*</b> marks a bench recomputed from picks and live points, because Bench Boost reports 0.</span>'}
    <span><b>★ WIN</b> is the highest score that gameweek, net of hits; <b>▬ BENCH</b> is the most points left on the bench. Ties are shared.</span>
    <span>A Bench Boost week cannot win the bench tally — the bench played, so nothing was left behind.</span>
    <span>The <b>Monthly</b> tab shows FPL's own calendar-month phases, scored net of hits from the gameweeks already played.</span>
    <span><b>To play</b> counts the starting XI only, or all 15 during a Bench Boost. Hover for the full breakdown.</span>
    <span>Select a row for its transfers, team, captain and players left to play. Column headings sort.</span>
  </div>`;
}

// ── data ──────────────────────────────────────────────────────────────
async function load(push) {
  const league = Number($("league").value);
  if (!league) return;
  const gw = Number($("gw").value);
  const max = Number($("max").value);

  $("go").disabled = true;
  setStatus("stale", `league ${league}`, "fetching…", "");
  $("panel").innerHTML = "";

  const qs = new URLSearchParams({ league, gw, max });
  try {
    const res = await fetch(`/api/report?${qs}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `request failed (${res.status})`);

    // A score that changed since the last look at this same league+gameweek
    // gets one flash on the render that's about to happen - reloading a
    // different gameweek, or the first load, has nothing to compare against.
    const prev = state.report;
    state.flashed = prev && prev.league.id === data.league.id && prev.event.id === data.event.id
      ? new Set(
          data.gameweek
            .filter((r) => {
              const before = prev.gameweek.find((p) => p.entryId === r.entryId);
              return before && before.netPoints !== r.netPoints;
            })
            .map((r) => r.entryId)
        )
      : null;

    state.report = data;
    state.open.clear();
    state.tab.clear();
    state.teamCache.clear();
    fillGameweeks(data);

    if (push) {
      const url = new URL(location);
      url.searchParams.set("league", league);
      gw ? url.searchParams.set("gw", gw) : url.searchParams.delete("gw");
      history.replaceState(null, "", url);
    }

    const countdown = deadlineCountdown(data.event.deadline_time);
    const stateText = (data.provisional ? `${data.event.name} · provisional` : data.event.name)
      + (countdown ? ` · ${countdown}` : "");
    setStatus("ok", data.league.name || `league ${league}`, stateText, `${data.gameweek.length} managers`);
    // Only a load replays the row entrance; a refresh of the same league and
    // gameweek is a reorder, so it gets the FLIP slide instead of a restage.
    render(!prev || prev.league.id !== data.league.id || prev.event.id !== data.event.id);
    state.flashed = null;
    if (isMobile()) setFiltersOpen(false);
  } catch (err) {
    state.report = null;
    setStatus("err", `league ${league}`, "failed", "");
    // Show the real reason. A wrong id and a rate limit need different fixes.
    $("panel").innerHTML =
      `<div class="msg error"><div class="m-head">could not load</div><div class="m-body">${esc(err.message)}</div></div>`;
  } finally {
    $("go").disabled = false;
  }
}

function fillGameweeks(data) {
  const sel = $("gw");
  const chosen = sel.value;
  sel.innerHTML = '<option value="0">Current</option>' +
    (data.events || []).slice().reverse()
      .map((e) => `<option value="${e.id}">${esc(e.name)}</option>`).join("");
  sel.value = chosen;
}

// ── filters toggle (mobile) ──────────────────────────────────────────
const isMobile = () => matchMedia("(max-width: 640px)").matches;

function setFiltersOpen(open) {
  $("filters-toggle").setAttribute("aria-expanded", String(open));
  $("controls").classList.toggle("collapsed", !open);
}

$("filters-toggle").addEventListener("click", () => {
  setFiltersOpen($("filters-toggle").getAttribute("aria-expanded") !== "true");
});

// ── table scroll hint ────────────────────────────────────────────────
// Marks the scroll container so the right-edge fade only shows while
// there's more to see, and disappears once scrolled to the end.
function updateScrollHint() {
  const el = $("panel").querySelector(".table-scroll");
  if (!el) return;
  const canScroll = el.scrollWidth > el.clientWidth + 1;
  el.classList.toggle("has-overflow", canScroll);
  const atEnd = el.scrollLeft >= el.scrollWidth - el.clientWidth - 1;
  el.classList.toggle("at-end", atEnd);
  el.addEventListener("scroll", () => {
    el.classList.toggle("at-end", el.scrollLeft >= el.scrollWidth - el.clientWidth - 1);
  }, { once: true });
}

// ── wiring ────────────────────────────────────────────────────────────
$("controls").addEventListener("submit", (e) => { e.preventDefault(); load(true); });

// Gameweek and Managers pick a new report from the server, so - unlike sort,
// view and month, which just re-render what's already loaded - they need a
// fresh fetch. Firing it on change (rather than waiting on the Load button)
// is what makes them feel like the rest of the "live" filters.
$("gw").addEventListener("change", () => { if ($("league").value) load(true); });
$("max").addEventListener("change", () => { if ($("league").value) load(true); });

// League ID is free text, so it can't fire on every keystroke like a select
// does - firing on blur (leaving the field) is the closest equivalent, and
// only when the value actually changed so tabbing through doesn't refetch.
$("league").addEventListener("blur", () => {
  const league = Number($("league").value);
  if (league && league !== state.report?.league?.id) load(true);
});

$("sort").addEventListener("change", () => {
  state.sort = { key: $("sort").value, dir: defaultDir($("sort").value) };
  if (state.report) render();
});

$("sortdir").addEventListener("click", () => {
  state.sort = { key: state.sort.key, dir: -state.sort.dir };
  if (state.report) render();
});

$("month").addEventListener("change", () => {
  state.month = $("month").value;
  if (state.report) render();
});

for (const [id, view] of [["view-gw", "gw"], ["view-season", "season"], ["view-monthly", "monthly"]]) {
  $(id).addEventListener("click", () => {
    state.view = view;
    state.open.clear();
    $("view-gw").setAttribute("aria-pressed", String(view === "gw"));
    $("view-season").setAttribute("aria-pressed", String(view === "season"));
    $("view-monthly").setAttribute("aria-pressed", String(view === "monthly"));
    if (view !== "monthly") fillSortOptions();
    if (state.report) render();
  });
}

(function init() {
  fillSortOptions();
  if (isMobile()) setFiltersOpen(false);
  const params = new URLSearchParams(location.search);
  // Clear the key the old build wrote, so a browser carrying a stale league
  // heals itself on the next load rather than needing devtools.
  try { localStorage.removeItem("fpl.league"); } catch {}
  const league = params.get("league") || DEFAULT_LEAGUE;
  if (league) $("league").value = league;
  if (params.get("gw")) {
    const gw = params.get("gw");
    $("gw").innerHTML += `<option value="${Number(gw)}">GW ${Number(gw)}</option>`;
    $("gw").value = gw;
  }
  if (league) load(false);
})();
</script>
</body>
</html>
