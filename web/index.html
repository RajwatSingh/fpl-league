  if (e.key !== "Enter" && e.key !== " ") return;
  const row = e.target.closest && e.target.closest("[data-player]");
  if (!row) return;
  e.preventDefault();
  openPlayer(Number(row.dataset.player));
});


// ── data ──────────────────────────────────────────────────────────────
async function load(push) {
  const league = Number($("league").value);
  if (!league) return;
  const gw = Number($("gw").value);
  const max = Number($("max").value);

  closeManager();
  $("go").disabled = true;
  setSectionStatus("league", "stale", `league ${league}`, "fetching…", "");

  // Numbers already on screen are a minute old, not wrong, so they stay -
  // dimmed - while the new ones are fetched. The skeleton is for when there
  // is nothing worth keeping: a first load, or a different league.
  const keep = !!(state.report && state.report.league.id === league);
  const scroller = keep && $("panel").querySelector(".table-scroll, .ladder:not(.skeleton)");
  if (scroller) scroller.classList.add("loading");
  else $("panel").innerHTML = skeletonPanel(state.view);

  const qs = new URLSearchParams({ league, gw, max });
  try {
    const res = await fetch(`/api/report?${qs}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `request failed (${res.status})`);

    // A score that changed since the last look at this same league+gameweek
    // gets one flash on the render that's about to happen - reloading a
    // different gameweek, or the first load, has nothing to compare against.
    const prev = state.report;
    state.flashed = prev && prev.league.id === data.league.id && prev.event.id === data.event.id
      ? new Set(
          data.gameweek
            .filter((r) => {
              const before = prev.gameweek.find((p) => p.entryId === r.entryId);
              return before && before.netPoints !== r.netPoints;
            })
            .map((r) => r.entryId)
        )
      : null;

    state.report = data;
    state.tab.clear();
    state.teamCache.clear();
    fillGameweeks(data);

    if (push) {
      const url = new URL(location);
      url.searchParams.set("league", league);
      gw ? url.searchParams.set("gw", gw) : url.searchParams.delete("gw");
      history.replaceState(null, "", url);
    }

    const countdown = deadlineCountdown(data.event.deadline_time);
    const stateText = (data.provisional ? `${data.event.name} · provisional` : data.event.name)
      + (countdown ? ` · ${countdown}` : "");
    $("season").textContent = seasonLabel(data.event.deadline_time);
    renderHonours(data);
    setSectionStatus("league", "ok", data.league.name || `league ${league}`, stateText, `${data.gameweek.length} managers`);
    // Only a load replays the row entrance; a refresh of the same league and
    // gameweek is a reorder, so it gets the FLIP slide instead of a restage.
    render(!prev || prev.league.id !== data.league.id || prev.event.id !== data.event.id);
    state.flashed = null;
  } catch (err) {
    setSectionStatus("league", "err", `league ${league}`, "failed", "");
    // Show the real reason either way: a wrong id and a rate limit need
    // different fixes. Where it goes depends on what is left on screen - a
    // table you can still read keeps it, and the failure arrives beside it
    // as a toast with the retry attached. An empty panel gets the message
    // in the page, because a card you can dismiss must never be the only
    // record that nothing loaded.
    if (scroller) {
      scroller.classList.remove("loading");
      toast({
        kind: "err", key: "load",
        title: "refresh failed",
        body: err.message,
        actions: [{ label: "Try again", run: () => load(push) }],
      });
    } else {
      state.report = null;
      $("honours").innerHTML = "";
      $("panel").innerHTML =
        `<div class="msg error"><div class="m-head">could not load</div><div class="m-body">${esc(err.message)}</div></div>`;
    }
  } finally {
    $("go").disabled = false;
    if (isMobile()) setFiltersOpen(false);
  }
}

function fillGameweeks(data) {
  const sel = $("gw");
  const chosen = sel.value;
  sel.innerHTML = '<option value="0">Current</option>' +
    (data.events || []).slice().reverse()
      .map((e) => `<option value="${e.id}">${esc(e.name)}</option>`).join("");
  sel.value = chosen;
}

// ── filters sheet (mobile) ───────────────────────────────────────────
const mqMobile = matchMedia("(max-width: 640px)");
const isMobile = () => mqMobile.matches;

// One form, two homes: inline on a desktop, inside the sheet on a phone.
// Moving the single element keeps its values, its listeners and its tab
// order intact, which two copies kept in sync would not.
function placeControls() {
  const home = isMobile() ? $("sheet-body") : $("controls-slot");
  if ($("controls").parentElement === home) return;
  home.appendChild($("controls"));
  home.appendChild($("pcontrols"));
  moveIndicator($("view-tabs"), true);
  moveIndicator($("pos-tabs"), true);
}

function setFiltersOpen(open) {
  $("filters-toggle").setAttribute("aria-expanded", String(open));
  if (!open) return closeDialog($("filters-sheet"));
  openDialog($("filters-sheet"));
  // Until this moment the tabs were laid out inside a display:none dialog,
  // so the bar had no measurable position to slide from.
  moveIndicator($("view-tabs"), true);
}

$("filters-sheet").addEventListener("close", () => {
  $("filters-toggle").setAttribute("aria-expanded", "false");
});

$("filters-toggle").addEventListener("click", () => {
  setFiltersOpen($("filters-toggle").getAttribute("aria-expanded") !== "true");
});

mqMobile.addEventListener("change", () => {
  setFiltersOpen(false);
  placeControls();
  // Crossing the breakpoint swaps table for ladder, and the two are built
  // rather than restyled - so the panel has to be rebuilt, not just reflowed.
  if (state.section === "players") renderPlayers();
  else if (state.report) render();
});

// ── table scroll hint ────────────────────────────────────────────────
// Marks the scroll container so the right-edge fade only shows while
// there's more to see, and disappears once scrolled to the end.
function updateScrollHint() {
  const el = $("panel").querySelector(".table-scroll");
  if (!el) return;
  const canScroll = el.scrollWidth > el.clientWidth + 1;
  el.classList.toggle("has-overflow", canScroll);
  const atEnd = el.scrollLeft >= el.scrollWidth - el.clientWidth - 1;
  el.classList.toggle("at-end", atEnd);
  el.addEventListener("scroll", () => {
    el.classList.toggle("at-end", el.scrollLeft >= el.scrollWidth - el.clientWidth - 1);
  }, { once: true });
}

// ── wiring ────────────────────────────────────────────────────────────
$("controls").addEventListener("submit", (e) => { e.preventDefault(); load(true); });

// Gameweek and Managers pick a new report from the server, so - unlike sort,
// view and month, which just re-render what's already loaded - they need a
// fresh fetch. Firing it on change (rather than waiting on the Load button)
// is what makes them feel like the rest of the "live" filters.
$("gw").addEventListener("change", () => { if ($("league").value) load(true); });
$("max").addEventListener("change", () => { if ($("league").value) load(true); });

// League ID is free text, so it can't fire on every keystroke like a select
// does - firing on blur (leaving the field) is the closest equivalent, and
// only when the value actually changed so tabbing through doesn't refetch.
$("league").addEventListener("blur", () => {
  const league = Number($("league").value);
  if (league && league !== state.report?.league?.id) load(true);
});

$("sort").addEventListener("change", () => {
  state.sort = { key: $("sort").value, dir: defaultDir($("sort").value) };
  if (state.report) render();
});

$("sortdir").addEventListener("click", () => {
  state.sort = { key: state.sort.key, dir: -state.sort.dir };
  if (state.report) render();
});

$("month").addEventListener("change", () => {
  state.month = $("month").value;
  if (state.report) render();
});

// The three views are one tab set over one panel, so they get the tab
// contract: a single stop in the page's tab order, arrows to move within it.
const VIEW_TABS = { "view-gw": "gw", "view-season": "season", "view-monthly": "monthly" };

function setView(view) {
  state.view = view;
  closeManager();
  for (const [id, v] of Object.entries(VIEW_TABS)) {
    const on = v === view;
    $(id).setAttribute("aria-selected", String(on));
    $(id).tabIndex = on ? 0 : -1;
    if (on) $("panel").setAttribute("aria-labelledby", id);
  }
  moveIndicator($("view-tabs"));
  if (view !== "monthly") fillSortOptions();
  if (state.report) render();
}

wireTabs($("view-tabs"), (tab) => setView(VIEW_TABS[tab.id]));

// The bar is measured, so anything that can change the tabs' widths or
// positions has to hand it back: a reflow, and the webfont replacing the
// fallback it was first measured against.
addEventListener("resize", () => {
  moveIndicator($("view-tabs"), true);
  moveIndicator($("pos-tabs"), true);
});
if (document.fonts) document.fonts.ready.then(() => {
  moveIndicator($("view-tabs"), true);
  moveIndicator($("pos-tabs"), true);
});

(function init() {
  fillSortOptions();
  fillPlayerSorts();
  placeControls();
  moveIndicator($("view-tabs"), true);
  const params = new URLSearchParams(location.search);
  // Clear the key the old build wrote, so a browser carrying a stale league
  // heals itself on the next load rather than needing devtools.
  try { localStorage.removeItem("fpl.league"); } catch {}
  const league = params.get("league") || DEFAULT_LEAGUE;
  if (league) $("league").value = league;
  if (params.get("gw")) {
    const gw = params.get("gw");
    $("gw").innerHTML += `<option value="${Number(gw)}">GW ${Number(gw)}</option>`;
    $("gw").value = gw;
  }
  if (league) load(false);
  // The league still loads underneath, so switching back to it is instant
  // and the deep link costs nothing extra when it is not used.
  if (params.get("section") === "players") setSection("players", false);
})();
</script>
</body>
</html>
