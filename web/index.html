<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FPL League Rank</title>
<!-- An original mark, not the Premier League's own crest: the halfway line,
     centre circle and spot from a pitch, in the site's own dark/orange

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@700&family=Martian+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Palette ───────────────────────────────────────────────────────────
   Neutrals carry a blue-violet cast (hue 285) at low chroma; accents sit
   at near-constant lightness and are separated by hue angle, each with
   exactly one job.

   That last property means the accent set is a syntax theme, NOT a chart
   palette: run through the CVD validator, blue and purple are 0.4 ΔE
   apart for a deuteranope. So nothing here encodes a value by hue alone.
   State uses a hue plus a glyph.

   n0 sits well below n1 rather than the portfolio's 0.04 step: this page
   is one big table, and at that step the table dissolved into the page
   instead of sitting on it. The deeper ground is what gives every raised
   surface - strip, inputs, rows, cards - an edge to read against.        */
:root {
  --n0: oklch(0.15 0.016 285); /* page ground: deliberately below n1 */
  --n1: oklch(0.23 0.020 285);
  --n2: oklch(0.27 0.022 285);
  --n3: oklch(0.32 0.022 285);
  --n4: oklch(0.42 0.022 285);  /* hairline: furniture, not signal */
  --n5: oklch(0.594 0.020 285); /* interactive edges, inputs */
  --n6: oklch(0.74 0.016 285);
  --n7: oklch(0.84 0.012 285);
  --n8: oklch(0.95 0.008 285);

  /* One job each. Cyan was retired: it encoded "players left to play",
     which is a potential rather than a good outcome, so a positive-coded
     hue misread it - that number is neutral now and the live dot carries
     the in-progress signal instead. */
  --blue:   oklch(0.78 0.11 255);
  --purple: oklch(0.78 0.13 300);
  --green:  oklch(0.80 0.15 150);
  --orange: oklch(0.80 0.13 65);
  --rose:   oklch(0.75 0.13 15);
  --gold:   oklch(0.83 0.15 95); /* the league leader only - a real table's one gilt edge */

  --radius: 0.25rem;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --mono: "Martian Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --cond: "IBM Plex Sans Condensed", "IBM Plex Sans", "Arial Narrow", ui-sans-serif, sans-serif;

  /* The mown band. A real pitch's stripes are obvious; these cannot be,
     because a whole league table is read through them - at any step wide
     enough to notice, a band reads as a highlighted column and starts
     making claims about the data. 0.015 in lightness is under that and
     over the step where the page reads as a flat sheet. */
  --turf: color-mix(in oklch, var(--n1) 20%, transparent);
}

*, *::before, *::after { box-sizing: border-box; }
html {
  scrollbar-width: thin; scrollbar-color: var(--n3) transparent;
  -webkit-text-size-adjust: 100%;
}
body {
  margin: 0;
  /* Mown bands run goal to goal, so in this plan view they are vertical -
     which is also the only direction that can be laid under a table safely,
     since horizontal bands would fight the rows. */
  background-color: var(--n0);
  background-image: repeating-linear-gradient(90deg, var(--turf) 0 12.5vw, transparent 12.5vw 25vw);
  color: var(--n8);
  font-family: var(--sans);
  font-size: 0.9375rem;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 2px; }

.skip {
  position: absolute; left: -9999px; top: 0; z-index: 10;
  background: var(--n2); color: var(--n8); padding: 0.5rem 0.75rem;
  font-family: var(--mono); font-size: 0.75rem;
}
.skip:focus { left: 0.75rem; top: 0.75rem; }

/* 78rem was set when ten columns were sharing the slack between them and
   needed the room. With the numbers closed up on the right, that width
   only bought a wider gutter between a team and its score. */
.wrap { max-width: 68rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

/* ── Masthead ──────────────────────────────────────────────────────────
   The league name used to be the `subject` field of a systemctl-style
   status line - 12px of mono, the same size as the countdown beside it.
   That had the hierarchy backwards. Twelve friends and a private joke of a
   league name are what the page is about; the gameweek and the deadline
   are what the machine has to say about it.

   So the block keeps both registers and stops pretending they are one. The
   name is the title, set in the family's condensed width. The machine's
   report keeps the mono voice underneath it, unchanged.                  */
.masthead {
  position: relative; overflow: hidden;
  border: 1px solid var(--n5);
  border-radius: var(--radius);
  background: var(--n1);
}
.mh-top {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 0.5rem 1rem; flex-wrap: wrap;
  padding: 0.85rem 0.9rem 0.7rem;
}
/* Condensed, and only here. A league name is the one string on the page
   that is somebody's joke rather than a number, and it is also the one
   that can run to forty characters - the width that suits both is the one
   newspaper league tables have always been set in. */
.league {
  margin: 0;
  font-family: var(--cond); font-weight: 700;
  font-size: clamp(1.5rem, 4.6vw, 2.35rem);
  line-height: 1.04; letter-spacing: -0.015em;
  color: var(--n8); text-wrap: balance;
  overflow-wrap: anywhere;
}
.season {
  font-family: var(--mono); font-size: 0.6875rem; font-weight: 500;
  letter-spacing: 0.1em; color: var(--n6); white-space: nowrap;
}

/* The portfolio's systemctl-style line: a dot, the state. This is the
   machine reporting on itself, so it stays in the mono voice - it just no
   longer has to carry the league's name at the machine's size. */
.strip {
  position: relative;
  display: flex; align-items: center; gap: 0.625rem; flex-wrap: wrap;
  padding: 0.55rem 0.9rem 0.6rem;
  font-family: var(--mono);
  font-size: 0.75rem;
  /* Doing two jobs honestly: the rule that separates the title from the
     machine's report is also the halfway line the circle below is drawn
     around. A divider that had to be here anyway is the only part of the
     pitch that costs the layout nothing. */
  border-top: 1px solid var(--n4);
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex: none; }
.dot.stale { background: var(--n5); }
.dot.err { background: var(--rose); }
.strip .state { color: var(--n6); }
.strip .right { margin-left: auto; color: var(--n6); }
.strip > span { position: relative; }

/* The centre circle used to be drawn here, on the halfway line, cropped by
   the block. It was right when the masthead was four short strings and a
   lot of air - it gave the empty half of the band something to be. Now the
   band below carries three people's names, and the circle's lower half was
   drawn straight across them.

   Rather than shrink it to something that fits, it goes. The decoration
   existed because the space was empty, and the space is not empty any more.
   The favicon still carries the mark, which is where it does its work.  */

/* ── This week ─────────────────────────────────────────────────────────
   The masthead was a 110px band across the full width carrying a league
   name, a season, a gameweek and a manager count - three of them ambient,
   none of them the reason anyone opened the page. In a league of twelve
   friends the questions are always the same three, and they are about
   people: who won it, who is top, who threw the most away.

   So the band answers them, in names rather than metrics. Three fields of
   one band, split by the rule the masthead already had - not three cards.
   No shadow, no radius, no border of their own; the only accent is a left
   edge in each honour's own hue, which is the leader's gilt edge idiom the
   table has used all along.                                              */
.mh-hon {
  display: grid; grid-template-columns: repeat(3, 1fr);
  border-top: 1px solid var(--n4);
}
.mh-hon:empty, .mh-hon[hidden] { display: none; }
.hon {
  min-width: 0;
  padding: 0.6rem 0.9rem 0.7rem;
  border-left: 3px solid var(--hh);
}
.hon + .hon { box-shadow: -1px 0 0 var(--n4); }
.hon-won  { --hh: var(--green); }
.hon-top  { --hh: var(--gold); }
.hon-left { --hh: var(--orange); }

/* Sentence case, not a tracked-out label: without this line "roman fc 70"
   says nothing, so it is doing work rather than decorating the field. */
.hon-cap { font-size: 0.75rem; color: var(--n6); line-height: 1.3; }
.hon-line { display: flex; align-items: baseline; gap: 0.5rem; margin-top: 0.1rem; }
.hon-team {
  font-weight: 500; color: var(--n8); font-size: 0.9375rem; line-height: 1.3;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* Beside the name rather than flung to the field's right edge: three
   different quantities have nothing to gain from sharing a right margin,
   and at this width the number had drifted far enough from the team that
   the two stopped reading as one statement. */
.hon-n {
  flex: none;
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  font-size: 1rem; color: var(--hh);
}
.hon-mgr {
  font-size: 0.8125rem; color: var(--n6); line-height: 1.3;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* Ties are shared, so more than one team can hold an honour. The band
   names the first and says how many others; the tooltip lists them. */
.hon-more { font-family: var(--mono); font-size: 0.75rem; color: var(--n5); }

/* ── Controls ──────────────────────────────────────────────────────────
   Inputs get the strong border step: an edge you are meant to click must
   read at a glance, unlike a hairline rule.                             */
.controls {
  display: flex; gap: 0.75rem; align-items: flex-end; flex-wrap: wrap;
  margin: 1.5rem 0 2rem;
}
.controls[hidden] { display: none; }
.field { display: flex; flex-direction: column; gap: 0.375rem; min-width: 0; }
.field label, .field .lbl {
  font-family: var(--mono); font-size: 0.6875rem; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--n6);
}
input[type="number"], select {
  font-family: var(--mono); font-size: 0.8125rem;
  background: var(--n1); color: var(--n8);
  border: 1px solid var(--n5); border-radius: var(--radius);
  padding: 0.5rem 0.625rem; min-width: 7.25rem;
  line-height: 1.4;
  transition: border-color 180ms var(--ease);
}
/* The popup a <select> opens is a separate surface and does NOT inherit the
   select's font-size — it has to be set on the options themselves, or the
   list renders at the browser default and comes out tiny next to the
   control that opened it. Chrome and Firefox honour these; Safari styles
   the popup itself and ignores most of them, which is fine because Safari's
   default is already legible. */
select option {
  font-family: var(--sans);
  font-size: 1rem;
  background: var(--n1);
  color: var(--n8);
  padding: 0.5rem 0.625rem;
}

input[type="number"]:hover, select:hover { border-color: var(--n6); }
input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; }

button {
  font-family: var(--mono); font-size: 0.8125rem; font-weight: 500;
  background: var(--n2); color: var(--n8);
  border: 1px solid var(--n5); border-radius: var(--radius);
  padding: 0.5rem 0.9rem; cursor: pointer;
  transition: background 180ms var(--ease), border-color 180ms var(--ease);
}
button:hover:not(:disabled) { background: var(--n3); border-color: var(--n6); }
button:disabled { opacity: 0.5; cursor: default; }

/* Refresh is the one action on the page that isn't reachable any other
   way: every filter beside it already refetches on change, so this exists
   for the live gameweek case - pull the scores again, now. It gets the
   only filled control treatment so the hierarchy tells the truth. */
#go {
  background: color-mix(in oklch, var(--blue) 20%, var(--n2));
  border-color: color-mix(in oklch, var(--blue) 55%, transparent);
  color: var(--n8);
}
#go:hover:not(:disabled) {
  background: color-mix(in oklch, var(--blue) 32%, var(--n2));
  border-color: var(--blue);
}

/* A league id is six digits. The number input was taking a browser default
   of 208px for them, which was most of the reason Refresh could not fit on
   the row with everything else. */
#league { width: 7rem; }

.sortrow { display: flex; gap: 0.375rem; }
.sortrow select { min-width: 8rem; }
.sortrow button { min-width: 2.25rem; padding: 0.5rem 0; font-size: 0.875rem; }

/* Selection and hover have to be different channels, not two steps on the
   same neutral ramp - at n3 for both, a hovered tab was indistinguishable
   from the selected one. Selection is a lighter fill plus an accent rule
   along the bottom; hover stays a plain neutral lift. */
.toggle {
  display: flex; position: relative;
  border: 1px solid var(--n5); border-radius: var(--radius); overflow: hidden;
}
.toggle button {
  border: 0; border-radius: 0; background: transparent; color: var(--n6);
  white-space: nowrap;
  transition: background 180ms var(--ease), color 180ms var(--ease);
}
.toggle button + button { border-left: 1px solid var(--n5); }
.toggle button[aria-selected="true"],
.toggle button[aria-selected="true"]:hover {
  background: var(--n4); color: var(--n8);
}

.phase-status {
  font-family: var(--mono); font-size: 0.625rem; font-weight: 500;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--n4);
  margin-left: 0.5rem;
}

/* ── Section eyebrow ───────────────────────────────────────────────────
   Same idiom as the portfolio's fpl-status heading.                     */
.eyebrow {
  display: flex; align-items: center; gap: 0.75rem;
  font-family: var(--mono); font-size: 0.6875rem; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--n6);
  margin: 2.25rem 0 0.875rem;
}
.eyebrow::after { content: ""; height: 1px; flex: 1; background: var(--n4); }

/* ── Table ─────────────────────────────────────────────────────────────
   The table is 100% wide with ten short columns, and the browser used to
   share the slack out evenly: measured at 1380px, the content came to
   560px and the other 650 became gaps. Hit got 76px to hold a middle dot.
   Every column floated alone in its own pool and the eye had to cross a
   void to get from a team's name to its score.

   Giving one column all of it fixes that: Team absorbs the slack, every
   other column shrinks to its content, and the numbers close up into a
   block that can actually be compared down the page. The gap that is left
   is one deliberate gutter between who and how many, which is how a
   printed league table has always been set.                              */
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
thead th:nth-child(2), tbody td:nth-child(2) { width: 100%; }
thead th {
  font-family: var(--mono); font-size: 0.625rem; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--n6);
  text-align: right; padding: 0 0.6rem 0.55rem; white-space: nowrap;
  border-bottom: 1px solid var(--n4);
}
/* The numeric block gets the roomier gutters. Team is absorbing all the
   table's slack now, so anything not spent here is spent widening the gap
   between a side's name and its score - and these are the columns a reader
   is comparing down the page, which is what needs the air. */
thead th:nth-child(n+3), tbody td:nth-child(n+3) { padding-left: 1.1rem; padding-right: 1.1rem; }
thead th:nth-child(-n+2) { text-align: left; }
thead th.sortable { cursor: pointer; }
thead th.sortable:hover { color: var(--blue); }
thead th[aria-sort] { color: var(--blue); }
thead th .caret { opacity: 0.7; }

tbody td {
  padding: 0.5rem 0.6rem; text-align: right; white-space: nowrap;
  border-bottom: 1px solid color-mix(in oklch, var(--n4) 45%, transparent);
}
tbody td:nth-child(-n+2) { text-align: left; }
tbody tr { transition: background 150ms var(--ease); }
tbody tr.row:hover { background: var(--n1); }

.rank { font-family: var(--mono); color: var(--n6); font-size: 0.8125rem; }
.rankcell { display: flex; flex-direction: column; gap: 0.1rem; }
.rankline { display: flex; align-items: center; gap: 0.35rem; }
/* Points behind the leader - the thing a rank number alone doesn't say. */
.gap { font-family: var(--mono); font-size: 0.6875rem; color: var(--n5); }
.who { display: flex; flex-direction: column; line-height: 1.3; }
.who .name { color: var(--n8); }
.who .team { font-size: 0.75rem; color: var(--n6); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.dim { color: var(--n6); }
.faint { color: var(--n4); }
/* Orange is this palette's numeral hue. It goes on the gameweek score and
   nothing else in the table: that is the figure people refresh to watch,
   and it is what the flash below animates, so hue and motion point at the
   same number. Total is the anchor rather than the drama - brightest
   neutral, so it still reads first among the plain columns without
   competing with the live score at either end of the row. */
.gwpts { font-weight: 500; color: var(--orange); }
.total { color: var(--n8); font-weight: 500; }
.hit { color: var(--rose); }

/* A live score changing between loads gets one green pulse - motion that
   depicts the thing that actually happened, rather than decoration. */
@keyframes flashpulse {
  from { background: color-mix(in oklch, var(--green) 35%, transparent); }
  to { background: transparent; }
}
.gwpts.flash { animation: flashpulse 1.8s var(--ease) both; border-radius: 3px; padding: 0 0.25rem; margin: 0 -0.25rem; }

/* Rank movement. Green/rose are 4.6 ΔE apart for a deuteranope, which is
   below even the conditional floor — so the arrow is load-bearing, not
   decoration, and the colour is a second channel on top of it. */
.move { font-family: var(--mono); font-size: 0.75rem; }
.move.up { color: var(--green); }
.move.down { color: var(--rose); }
.move.flat { color: var(--n4); }

/* ── Table drama ───────────────────────────────────────────────────────
   A league table's whole point is the gap between people. The leader gets
   this site's one gilt edge - a real table's convention, not a trophy
   emoji - as an inset shadow so it costs no layout. */
/* The leader is the one row that differs from the other twenty-four: the
   gilt edge, a gold rank, and the height to go with it. Same treatment as
   the ladder's leader, so the top of the league looks like the top of the
   league in both renderings. */
tbody tr.row.leader { box-shadow: inset 3px 0 0 0 var(--gold); }
tbody tr.row.leader .rank { color: var(--gold); font-size: 1rem; }
tbody tr.row.leader td { padding-top: 0.7rem; padding-bottom: 0.7rem; }
tbody tr.row.leader .who .name { font-size: 0.9375rem; }

/* ── Icons ─────────────────────────────────────────────────────────────
   Every icon here is a football object, not a UI metaphor: the armband,
   the substitution arrows, the card a referee shows, the bench, the clock.
   Drawn once as <symbol>s and stroked in currentColor, so an icon inherits
   the hue of whatever badge or fact it sits in and there is no second
   place for a colour to drift.

   They are sized in em rather than rem deliberately - the same symbol
   appears in a 17px score line and an 11px rail, and it has to grow with
   the text beside it rather than sit in it at a fixed size. */
.ic {
  width: 1em; height: 1em; flex: none;
  fill: none; stroke: currentColor; stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round;
  vertical-align: -0.125em;
}
/* The two honours are solid marks rather than outlines - a star drawn as
   an outline at 11px is a smudge, and these are the smallest icons here. */
.ic-solid { fill: currentColor; stroke: none; }

/* ── Badges ────────────────────────────────────────────────────────────
   One rule, one hue variable. Every badge was an outline at 35% alpha and
   10px, which on a phone was a faint rectangle with something inside it;
   these are solid objects - a tinted ground, a readable border, an icon
   and a word - so the thing that happened is legible at arm's length.

   The word stays. Four badge hues would not survive a CVD check (see the
   palette note above), so the label is what identifies a badge and the
   hue is only ever the second channel. */
.badge {
  display: inline-flex; align-items: center; gap: 0.25rem;
  font-family: var(--mono); font-size: 0.6875rem; font-weight: 600;
  letter-spacing: 0.03em; line-height: 1.35; white-space: nowrap;
  border-radius: 3px; padding: 0.1rem 0.34rem;
  color: var(--bh);
  background: color-mix(in oklch, var(--bh) 15%, var(--n1));
  border: 1px solid color-mix(in oklch, var(--bh) 42%, transparent);
}
.badge.win      { --bh: var(--green); }
.badge.benchwin { --bh: var(--orange); }
.badge.hitb     { --bh: var(--rose); }
/* Chips are categorical, but four hues from this palette would not
   survive CVD. One hue, and the two-letter label does the identifying. */
.chip           { --bh: var(--purple); }
.chip .ev { color: color-mix(in oklch, var(--purple) 60%, var(--n5)); font-weight: 500; }

/* ── Weekly honours ───────────────────────────────────────────────────
   Two tallies, and they must not be told apart by hue alone: each badge
   carries its own word, and the season columns carry a count. Green is
   the win (success, per the palette contract); orange is the bench,
   matching the meter directly beside it in the same table.            */
.badges { display: inline-flex; gap: 0.3rem; margin-left: 0.4rem; vertical-align: -1px; }
.tally { display: inline-flex; align-items: center; gap: 0.35rem; justify-content: flex-end; }
.tally .n { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tally .n.zero { color: var(--n4); }

/* Season tallies, carried beside the team name - the football convention
   of stars over a crest, where the count is the honours rather than this
   week's result. One shared treatment, deliberately borderless so they
   read as annotations on the name rather than more badges competing with
   the week's ★ WIN / ▬ BENCH beside them; the glyph says which tally and
   the hue says whether it is worth having.

   Gold for wins, the same statement as the leader's gilt edge: a standing
   achievement. Rose for the bench, because most-points-benched is a tally
   of points thrown away - the palette's "went wrong" hue, the same one
   carrying hits and rank drops. Deliberately not the ▬ BENCH badge's
   orange: orange is the numeral hue now and belongs to the live score, so
   reusing it here would put the loudest colour on the page next to a name
   for the least flattering reason.                                      */
.honour {
  display: inline-flex; align-items: center; gap: 0.15rem;
  font-family: var(--mono); font-size: 0.6875rem; font-weight: 600;
  white-space: nowrap; margin-left: 0.45rem;
  font-variant-numeric: tabular-nums;
}
.honour + .honour { margin-left: 0.3rem; }
.honour .s { margin-left: 0.1rem; }
.honour-gw { color: var(--gold); }
.honour-bench { color: color-mix(in oklch, var(--rose) 80%, var(--n5)); }

/* ── Bench meter ───────────────────────────────────────────────────────
   Magnitude across one series: one hue, length carries the value. Thin
   mark, rounded data-end, anchored to a baseline shared by every row so
   the lengths are comparable down the column.                           */
.bench { display: flex; align-items: center; gap: 0.5rem; justify-content: flex-end; }
.bench .val { min-width: 1.75rem; text-align: right; }
.meter { width: 3.5rem; height: 5px; background: var(--n2); border-radius: 3px; overflow: hidden; flex: none; }
.meter > i { display: block; height: 100%; background: var(--orange); border-radius: 3px; }
.derived { color: var(--orange); font-size: 0.75rem; }

/* ── Ladder ────────────────────────────────────────────────────────────
   The phone rendering of a league table. The table it replaces kept all
   ten columns and scrolled sideways, which meant the one number a league
   table exists to report - the total - was the tenth column, off the right
   edge of every phone. Rank and team were pinned; the standings were not.

   So the row stops being ten cells and becomes three blocks: where you
   are, who you are, what you scored. Everything the columns used to carry
   moves to a rail underneath, where it can wrap instead of scroll.

   Bands, not cards. They share a hairline, carry no shadow and have no box
   of their own, because a league table is a classified-results column and
   not a stack of tiles - and because the only raised surface on this page
   should stay the one that actually floats, the dialog.                  */
.ladder { border-top: 1px solid var(--n4); }

/* One template, shared by the header strip and every row, so the labels
   sit over the numbers they name. */
.ladder .lhead, .ladder .lrow {
  display: grid;
  grid-template-columns: 2.6rem minmax(0, 1fr) auto;
  gap: 0 0.7rem;
}

/* Mobile loses the table's sortable column headings, which is most of how
   this page is used. The two that matter come back here as tap targets;
   the rest stay in the filters sheet's dropdown. */
.ladder .lhead {
  padding: 0 0.5rem 0.5rem 0.55rem;
  border-bottom: 1px solid var(--n4);
  font-family: var(--mono); font-size: 0.625rem; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--n6);
}
/* The two numbers stack in the row, so their labels stack too - side by
   side they promised two columns and delivered two lines. */
.ladder .lh-num {
  display: flex; flex-direction: column; align-items: flex-end;
  gap: 0.1rem; line-height: 1.25;
}
.ladder .lh-num button {
  background: none; border: 0; padding: 0; margin: 0; width: auto;
  min-width: 0; min-height: 0; border-radius: 2px;
  font: inherit; letter-spacing: inherit; text-transform: inherit;
  color: inherit; cursor: pointer;
}
.ladder .lh-num button:hover:not(:disabled) { background: none; color: var(--blue); }
.ladder .lh-num button[aria-sort] { color: var(--blue); }

.ladder .lrow {
  align-items: start; align-content: start;
  padding: 0.6rem 0.5rem 0.65rem 0.55rem;
  border-bottom: 1px solid color-mix(in oklch, var(--n4) 45%, transparent);
  cursor: pointer;
  transition: background 150ms var(--ease);
}
.ladder .lrow:hover, .ladder .lrow:focus-visible { background: var(--n1); }

/* Position facts, stacked: the number, then the movement under it. Both
   in mono so the column of ranks lines up down the ladder. */
.ladder .lrank {
  grid-column: 1; grid-row: 1 / span 2;
  display: flex; flex-direction: column; align-items: flex-start; gap: 0.05rem;
  font-family: var(--mono); font-variant-numeric: tabular-nums;
}
.ladder .lrank .n { font-size: 1.0625rem; line-height: 1.15; color: var(--n7); }
.ladder .lrank .move { font-size: 0.6875rem; }
/* Points behind the leader sits with the rank, not with the scores - the
   same place the table's rankCell puts it, and for the same reason: it is
   what the position costs, not another thing this team scored. */
.ladder .lrank .gap { font-size: 0.6875rem; }

.ladder .lwho {
  grid-column: 2; grid-row: 1 / span 2; min-width: 0;
  display: flex; flex-direction: column; justify-content: center;
}
.ladder .lname {
  font-size: 0.9375rem; font-weight: 500; color: var(--n8);
  line-height: 1.25; overflow-wrap: anywhere;
}
.ladder .lmgr { font-size: 0.8125rem; color: var(--n6); line-height: 1.3; }

/* The two numbers, right-aligned so they read as a column down the ladder
   rather than as part of each name. The loud one is the score this view is
   about; the quiet one is the standing it feeds. */
.ladder .lnum {
  grid-column: 3; grid-row: 1 / span 2;
  display: flex; flex-direction: column; align-items: flex-end;
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  line-height: 1.15;
}
.ladder .lbig { font-size: 1.1875rem; font-weight: 500; color: var(--orange); }
.ladder .lbig.none { color: var(--n4); }
.ladder .lsub { font-size: 0.9375rem; color: var(--n8); margin-top: 0.1rem; }

/* ── The rail ──────────────────────────────────────────────────────────
   Everything the columns used to carry. Two registers, and the split is
   the point: a fact is something true of every manager every week - who
   they captained, what they left on the bench - and reads as annotation.
   A badge is something that happened to this one: they won the week, they
   took a hit, they burned a chip. Only the second kind gets a fill.

   That is also what makes the ladder uneven. A quiet week is captain and
   bench and nothing else; a loud one wraps to a second line. The column
   is as ragged as the week was.                                         */
.ladder .lrail {
  grid-column: 2 / -1; grid-row: 3;
  display: flex; flex-wrap: wrap; align-items: center;
  gap: 0.3rem 0.6rem; margin-top: 0.45rem;
}
.ladder .lrail:empty { display: none; }

.fact {
  display: inline-flex; align-items: center; gap: 0.3rem;
  font-family: var(--mono); font-size: 0.6875rem;
  color: var(--n6); white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.fact .ic { color: var(--n6); }
.fact .v { color: var(--n7); }
/* The captain's name is a name, not a numeral, so it drops the mono voice
   and is the one fact allowed to run long and truncate. */
.fact.f-cap { font-family: var(--sans); min-width: 0; }
/* Best gameweek had the star, which two items along in the same rail
   already meant "gameweeks won" - one mark, two claims. There is no
   football object for a personal best, so it takes a word instead. */
.fact .lbl { color: var(--n5); }
.fact.f-cap .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* The leader keeps the table's gilt edge - the same convention in both
   renderings, so the top of the league looks like the top of the league
   whichever one you are reading. */
.ladder .lrow.leader {
  box-shadow: inset 3px 0 0 0 var(--gold);
  background: color-mix(in oklch, var(--gold) 4%, transparent);
  padding-top: 0.75rem; padding-bottom: 0.8rem;
}
.ladder .lrow.leader .lrank .n { color: var(--gold); font-size: 1.25rem; }

/* Same 18ms step as the table's entrance, on the same .fresh gate. */
.ladder.fresh .lrow { animation: rowin 320ms var(--ease) both; animation-delay: calc(var(--i) * 18ms); }
.ladder .lrow.sliding { transition: transform 520ms var(--ease); }

/* The season tallies close every rail, and they share their marks with the
   week's own items - the star is "won it" and "has won one", the bench is
   "left 15 behind" and "has done that once". Side by side in one line that
   reads as four numbers about this week. A rule says where the week stops
   and the season starts; the marks stay as they were.

   Inside the group the tallies are flex items, so they drop the margin they
   carry when they sit inline after a team name in the table. */
.ladder .lhon {
  display: inline-flex; align-items: center; gap: 0.5rem;
  padding-left: 0.6rem;
  border-left: 1px solid var(--n4);
}
.ladder .lrail .honour { margin-left: 0; }

/* A skeleton is not a row: nothing to open, nothing to hover. */
.ladder.skeleton .lrow { cursor: default; }
.ladder.skeleton .lrow:hover { background: none; }
.ladder .sk { display: block; }
.ladder .lrank .sk, .ladder .lnum .sk, .ladder .lrail .sk { margin-bottom: 0.25rem; }
.ladder .lwho .sk { margin-bottom: 0.3rem; }

/* ── Transfer detail ───────────────────────────────────────────────────*/
/* One transfer per line. A three-column grid rather than a stack of flex
   rows so every arrow lands in the same column - out names are ragged-right
   and the incoming names all start together, which is what makes a column
   of transfers scannable instead of a wall of names. */
.tf-list { display: grid; grid-template-columns: auto auto 1fr; gap: 0.3rem 0; align-items: baseline; font-family: var(--mono); font-size: 0.75rem; color: var(--n7); }
.tf-list .out { color: var(--n6); }
.tf-list .arrow { color: var(--n4); padding: 0 0.5rem; }
.tf-list .in { color: var(--green); }
.tf-none { font-size: 0.75rem; color: var(--n6); font-style: italic; }

/* ── Manager options ──────────────────────────────────────────────────
   Inside the dialog a manager opens onto four questions, and the answer
   to each arrives with the same staggered fade+blur entrance the
   portfolio's team sheet uses for a squad appearing line by line.     */
@keyframes cardin {
  from { opacity: 0; transform: translateY(10px); filter: blur(3px); }
  to { opacity: 1; transform: none; filter: blur(0); }
}
.opt-menu { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.opt-btn {
  font-family: var(--mono); font-size: 0.75rem; font-weight: 500;
  background: var(--n2); color: var(--n7);
  border: 1px solid var(--n5); border-radius: var(--radius);
  padding: 0.45rem 0.8rem; cursor: pointer;
  animation: cardin 280ms var(--ease) both; animation-delay: calc(var(--i) * 40ms);
  transition: background 150ms var(--ease), border-color 150ms var(--ease), color 150ms var(--ease);
}
.opt-btn:hover { border-color: var(--n6); color: var(--n8); }
/* At this size a tinted background and a coloured border weren't enough to
   find the selected pill at a glance, so selection flips the fill and the
   text instead - the one inversion on the page, and unmistakable.

   The :hover half is not redundant: the generic button:hover rule above is
   (0,2,1) and would otherwise outrank a bare [aria-selected] at (0,2,0),
   repainting the selected pill as merely hovered - which is its state
   almost every time anyone looks at it, having just clicked it. */
.opt-btn[aria-selected="true"],
.opt-btn[aria-selected="true"]:hover {
  background: var(--blue); border-color: var(--blue); color: var(--n0); font-weight: 600;
}

.opt-content { margin-top: 0.9rem; }
.opt-loading, .opt-error { font-family: var(--mono); font-size: 0.8125rem; color: var(--n6); }
.opt-error { color: var(--rose); }

.squad-group { margin-bottom: 0.85rem; }
.squad-group:last-child { margin-bottom: 0; }
.squad-label {
  font-family: var(--mono); font-size: 0.625rem; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--n5); margin-bottom: 0.4rem;
}
.squad-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }

.pcard {
  display: flex; align-items: center; gap: 0.4rem;
  background: var(--n1); border: 1px solid var(--n4); border-radius: var(--radius);
  padding: 0.35rem 0.55rem; font-size: 0.8125rem;
  animation: cardin 320ms var(--ease) both; animation-delay: calc(var(--i) * 35ms);
}
.pcard.bench { opacity: 0.7; }
.pcard .pname { color: var(--n8); }
.pcard .pteam { color: var(--n6); font-size: 0.6875rem; font-family: var(--mono); }
.pcard .ppts { font-family: var(--mono); color: var(--orange); font-variant-numeric: tabular-nums; margin-left: 0.1rem; }
.pcard .ctag {
  font-family: var(--mono); font-size: 0.625rem; font-weight: 700; line-height: 1;
  color: var(--n0); background: var(--orange); border-radius: 2px; padding: 0.15rem 0.3rem;
}
.pcard .ctag.vtag { background: var(--n5); }

/* Transferred in this gameweek. Green is the arrival hue here and in the
   Transfers list, so the name that reads green in one tab is the card
   tagged IN in the other. It is also the live-fixture dot's hue, which is
   why this is never hue alone: the word IN identifies it, the same way the
   chip badge leans on its two letters. Outline rather than the captain
   tag's solid fill - a squad can hold five of these and one captain, and
   the rarer mark should stay the louder one. */
.pcard.tf-in { border-color: color-mix(in oklch, var(--green) 45%, var(--n4)); background: color-mix(in oklch, var(--green) 8%, var(--n1)); }
.pcard .ptag {
  font-family: var(--mono); font-size: 0.625rem; font-weight: 700; line-height: 1;
  color: var(--green);
  border: 1px solid color-mix(in oklch, var(--green) 35%, transparent);
  border-radius: 2px; padding: 0.15rem 0.3rem;
}

.fx-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.fx-dot.upcoming { background: var(--n5); }
.fx-dot.live { background: var(--green); animation: fxpulse 1.4s ease-in-out infinite; }
.fx-dot.finished, .fx-dot.none { background: var(--n3); }
/* Shallow on purpose: up to fifteen of these pulse at once in a squad, and
   a deeper trough read as twitching rather than as "live". */
@keyframes fxpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

.toplay-stats { display: flex; gap: 1.75rem; margin-bottom: 0.9rem; }
.toplay-stat {
  animation: cardin 280ms var(--ease) both; animation-delay: calc(var(--i) * 60ms);
}
.toplay-stat .n { font-family: var(--mono); font-size: 1.375rem; color: var(--n8); }
.toplay-stat .l { font-family: var(--mono); font-size: 0.625rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--n6); }

/* ── Sections ──────────────────────────────────────────────────────────
   The page now answers two different questions - how is my league doing,
   and who should I buy - and they share nothing but the API client. So
   this is a nav, not another view tab: view tabs re-render one dataset,
   these two swap the dataset, the controls and the panel together.

   It sits below the masthead rather than above it because the masthead is
   the thing being switched. Full-width and taller than the view toggle,
   so the hierarchy between "which page" and "which cut of this page" is
   legible without reading either label.                                  */
.sections {
  display: flex; position: relative;
  margin-top: 1.25rem;
  border: 1px solid var(--n5); border-radius: var(--radius); overflow: hidden;
  background: var(--n1);
}
.sections button {
  flex: 1; border: 0; border-radius: 0; background: transparent; color: var(--n6);
  padding: 0.7rem 0.9rem; text-align: center; white-space: nowrap;
  letter-spacing: 0.06em; text-transform: uppercase; font-size: 0.75rem;
  transition: background 180ms var(--ease), color 180ms var(--ease);
}
.sections button + button { border-left: 1px solid var(--n5); }
.sections button[aria-selected="true"],
.sections button[aria-selected="true"]:hover { background: var(--n4); color: var(--n8); }

/* ── Difficulty ramp ───────────────────────────────────────────────────
   This is a DIVERGING scale, not a sequential one, and building it as
   though it were sequential is what made the first version so quiet. The
   quantity has a meaningful middle - an average Premier League fixture -
   and two directions away from it, so the middle is the dark neutral the
   page is already made of and both ends climb away from it in lightness.
   A run of easy fixtures and a run of brutal ones now differ in weight on
   the page, not just in tint, which is the whole point of a ticker: the
   shape of a season should be visible before any number is read.

   Both ends land light enough to need dark text, which is deliberate. The
   inversion is a third channel on top of hue and lightness, and it is the
   one that survives a greyscale print of the table.

   None of it carries the value alone: every cell still prints its score.  */
.fdr1 { --fdr: var(--green);                                      --fdrt: var(--n0); }
.fdr2 { --fdr: color-mix(in oklch, var(--green) 42%, var(--n2));  --fdrt: var(--n8); }
.fdr3 { --fdr: var(--n3);                                         --fdrt: var(--n7); }
.fdr4 { --fdr: color-mix(in oklch, var(--orange) 48%, var(--n2)); --fdrt: var(--n8); }
.fdr5 { --fdr: var(--rose);                                       --fdrt: var(--n0); }

/* ── The strength band's roll-call ─────────────────────────────────────
   A band filter that silently drops fourteen clubs is asking to be
   trusted. This is the list it kept, in rank order, so the control shows
   its working - and doubles as the answer to "who are the good attacking
   sides", which is the question the band is standing in for.            */
.bandline {
  display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap;
  margin: -0.35rem 0 0.9rem;
}
.bl-lbl {
  font-family: var(--mono); font-size: 0.625rem; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--n6); margin-right: 0.15rem;
}
.band-club {
  display: inline-flex; align-items: baseline; gap: 0.3rem;
  border: 1px solid var(--n4); border-radius: 2px; padding: 0.15rem 0.4rem;
  font-family: var(--mono); font-size: 0.6875rem; cursor: help;
}
.band-club b { color: var(--n8); font-weight: 500; }
.band-club i { color: var(--n5); font-style: normal; font-size: 0.5625rem; }

/* ── Player controls ───────────────────────────────────────────────────
   Search is the one field here that is genuinely wide - a name is not six
   digits - so it gets the row's slack the way Team does in the table. */
#pcontrols .f-search { flex: 1 1 12rem; }
#psearch {
  font-family: var(--sans); font-size: 0.875rem; width: 100%;
  background: var(--n1); color: var(--n8);
  border: 1px solid var(--n5); border-radius: var(--radius);
  padding: 0.5rem 0.625rem; line-height: 1.4;
  transition: border-color 180ms var(--ease);
}
#psearch:hover { border-color: var(--n6); }
#psearch::placeholder { color: var(--n5); }

/* ── Ticker ────────────────────────────────────────────────────────────
   Ten gameweeks in fixed columns, because the whole value of a ticker is
   that a run reads down the page as well as across it: GW7 has to sit
   under GW7 for every player, or comparing two of them means reading two
   sentences instead of one shape.                                       */
.ticker { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.875rem; }
.ticker th {
  position: sticky; top: 0; z-index: 2; background: var(--n0);
  font-family: var(--mono); font-size: 0.625rem; font-weight: 500;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--n6);
  text-align: right; padding: 0.5rem 0.3rem; border-bottom: 1px solid var(--n4);
  white-space: nowrap;
}
.ticker th.t-who, .ticker th.t-gw { text-align: left; }
.ticker th.t-gw { text-align: center; padding-left: 0.15rem; padding-right: 0.15rem; }
/* The stat columns pay for the run. Every 0.1rem taken off their gutters
   is another gameweek that fits before the table has to scroll, and a
   ticker that scrolls has given up the alignment it exists for. */
.ticker td {
  padding: 0.4rem 0.3rem; border-bottom: 1px solid var(--n1);
  vertical-align: middle; text-align: right; white-space: nowrap;
}
.ticker td.t-who { text-align: left; width: 100%; }
.ticker tbody tr { cursor: pointer; transition: background 140ms var(--ease); }
.ticker tbody tr:hover { background: var(--n1); }
.ticker tbody tr:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }

/* The fixture cells are the row's payload, so they get a fixed width and
   the identity column absorbs everything left over. */
/* A width is only a suggestion to a table, and the identity column is set
   to absorb all the slack - so in the score-only view, where a cell holds
   three characters instead of seven, these columns collapse to their
   content and the "GW13" headings above them start touching. The floor is
   what the widest heading needs, not what the narrowest cell wants. */
.ticker td.fx, .ticker th.t-gw { width: 2.8rem; min-width: 2.6rem; }
.ticker td.fx { padding-left: 0.1rem; padding-right: 0.1rem; }
.fx-cell {
  display: flex; flex-direction: column; gap: 1px;
  align-items: stretch; justify-content: center;
}
.fx-chip {
  display: flex; align-items: baseline; justify-content: center; gap: 0.15rem;
  background: var(--fdr); color: var(--fdrt);
  border-radius: 2px; padding: 0.2rem 0.1rem;
  font-family: var(--mono); font-size: 0.625rem; line-height: 1.25;
}
.fx-chip .o { letter-spacing: 0.02em; }
/* Away is the marked case: lowercase reads as the quieter of the two at a
   glance, which matches which one is the harder afternoon. */
.fx-chip.away .o { text-transform: lowercase; }
.fx-chip .s { font-weight: 700; font-variant-numeric: tabular-nums; opacity: 0.85; }
/* Score-only: the number is no longer a footnote to the opponent, so it
   drops the dimming and takes the size the opponent had. */
.fx-chip.solo { justify-content: center; padding: 0.3rem 0.1rem; }
.fx-chip.solo .s { font-size: 0.75rem; opacity: 1; }
.fx-chip.nameonly .o { font-weight: 700; }
.fx-chip.dbl { padding: 0.1rem 0.1rem; }
.fx-blank {
  display: block; text-align: center; color: var(--n4);
  font-family: var(--mono); font-size: 0.75rem; padding: 0.3rem 0;
}
/* A midweek match is the one thing in a cell the score cannot say for
   itself - two fixtures can rate 5.5 and only one of them is on a
   Wednesday. A notch on the top edge, not a hue: the ramp is spoken for. */
.fx-chip.mid { box-shadow: inset 0 2px 0 var(--purple); }
/* Against the two saturated ends the purple notch has nothing to sit
   against, so there it goes dark instead - same mark, opposite direction,
   for the same reason the text inverts. */
.fx-chip.mid.fdr1, .fx-chip.mid.fdr5 { box-shadow: inset 0 2px 0 color-mix(in oklch, var(--n0) 75%, transparent); }

.pwho { display: flex; flex-direction: column; line-height: 1.25; }
.pwho .pn { color: var(--n8); display: flex; align-items: center; gap: 0.35rem; }
.pwho .pm {
  font-family: var(--mono); font-size: 0.6875rem; color: var(--n6);
  display: flex; align-items: center; gap: 0.4rem;
}
.ppos {
  font-family: var(--mono); font-size: 0.5625rem; font-weight: 700;
  letter-spacing: 0.06em; color: var(--n6);
  border: 1px solid var(--n4); border-radius: 2px; padding: 0.05rem 0.25rem;
}
/* Availability is a glyph plus a hue, never the hue alone - the same
   contract the chip and win badges keep. */
.flag {
  font-family: var(--mono); font-size: 0.5625rem; font-weight: 700;
  border-radius: 2px; padding: 0.05rem 0.28rem; line-height: 1.4;
  color: var(--n0); background: var(--n5);
}
.flag.d { background: var(--orange); }
.flag.i, .flag.s, .flag.u { background: var(--rose); }

.avgcell {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 2.2rem; padding: 0.25rem 0.35rem; border-radius: 2px;
  background: var(--fdr); color: var(--fdrt);
  font-family: var(--mono); font-size: 0.8125rem; font-weight: 700;
  font-variant-numeric: tabular-nums;
}

/* ── Player list, phone ────────────────────────────────────────────────
   The ticker's fixed columns are exactly what a 390px screen cannot hold,
   so the phone gets the same data as a card: identity and numbers in the
   head, the run underneath as its own scrolling strip. The alignment
   between players is lost and there is no way to keep it - what replaces
   it is that one player's run is fully legible without pinching.        */
.plist { border-top: 1px solid var(--n4); }
.prow {
  display: grid; grid-template-columns: minmax(0, 1fr) auto;
  gap: 0.35rem 0.6rem; align-items: center;
  padding: 0.7rem 0.15rem; border-bottom: 1px solid var(--n1);
  cursor: pointer;
}
.prow:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.prow .pwho { min-width: 0; }
.prow .pwho .pn, .prow .pwho .pm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .pnums {
  grid-column: 1 / -1;
  display: flex; gap: 0.75rem; align-items: baseline; flex-wrap: wrap;
  font-family: var(--mono); font-size: 0.6875rem; color: var(--n6);
}
.prow .pnums b { color: var(--n8); font-weight: 500; }
.prow .prun {
  grid-column: 1 / -1;
  display: flex; gap: 2px; overflow-x: auto; padding-bottom: 0.15rem;
  scrollbar-width: none;
}
.prow .prun::-webkit-scrollbar { display: none; }
.prow .prun .fx-cell { flex: 0 0 2.9rem; }

/* ── Player dialog ─────────────────────────────────────────────────────
   The table answers "who has a good run"; this answers "why", which is
   the question a difficulty score has to be able to survive. Every term
   that went into a fixture is shown signed, against the same zero.      */
.pstats {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(4.5rem, 1fr));
  gap: 0.75rem 1rem; margin-bottom: 1.1rem;
}
.pstat .n {
  font-family: var(--mono); font-size: 1.05rem; color: var(--n8);
  font-variant-numeric: tabular-nums;
}
.pstat .l {
  font-family: var(--mono); font-size: 0.5625rem; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--n6);
}
.pnews {
  border: 1px solid color-mix(in oklch, var(--orange) 40%, transparent);
  border-radius: var(--radius); padding: 0.55rem 0.7rem; margin-bottom: 1.1rem;
  font-size: 0.8125rem; color: var(--n7);
}
.pnews .h {
  font-family: var(--mono); font-size: 0.625rem; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--orange); margin-bottom: 0.2rem;
}

.fxlist { display: grid; gap: 0.5rem; }
.fxrow {
  display: grid; gap: 0.55rem;
  padding: 0.7rem 0.8rem;
  border: 1px solid var(--n2); border-radius: var(--radius);
  background: var(--n1);
}

/* The card's top line answers the question on its own - who, when, and how
   hard. Everything under it is why. */
.fxhead { display: flex; align-items: center; gap: 0.7rem; }
.fxhead .gw {
  flex: none; font-family: var(--mono); font-size: 0.625rem; font-weight: 700;
  color: var(--n6); border: 1px solid var(--n4); border-radius: 2px;
  padding: 0.15rem 0.35rem;
}
.fxhead .opp { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.fxhead .opp .t { color: var(--n8); font-size: 0.9375rem; }
.fxhead .opp .k {
  font-family: var(--mono); font-size: 0.625rem; color: var(--n6);
  display: flex; gap: 0.5rem; flex-wrap: wrap;
}
.fxhead .opp .k .warn { color: var(--purple); }
/* The score with the word for it underneath. The word is what makes the
   number legible without a legend: a 2.2 says nothing to someone who has
   not been told which end of the scale is which. */
.fxscore { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 0.2rem; }
.fxscore .w {
  font-family: var(--mono); font-size: 0.5625rem; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--n6);
}

/* ── The breakdown ─────────────────────────────────────────────────────
   This used to print five signed decimals - "−1.36", "+0.06". That is the
   model's own unit, and it means nothing to a reader who has not been told
   the sign convention, which no part of the page ever told them.

   The bar and the plain-language effect now say the same thing twice and
   neither needs explaining: the bar's direction and length carry the
   weight, the words carry the meaning. The supporting figure sits under
   the term it came from, so "much easier" can be checked rather than
   believed.                                                              */
.terms { display: grid; gap: 0.55rem; }
.term {
  display: grid; grid-template-columns: 7.5rem 1fr 6rem;
  gap: 0.1rem 0.7rem; align-items: center;
  font-size: 0.75rem; color: var(--n7);
}
.term .bar {
  position: relative; height: 7px; background: var(--n2); border-radius: 1px;
}
.term .bar::before {
  content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px;
  width: 1px; background: var(--n4);
}
.term .bar i {
  position: absolute; top: 0; bottom: 0; border-radius: 1px;
  background: var(--n5);
}
/* Harder points right and reads warm, easier points left and reads cool -
   the same direction of travel as the ramp the fixture cells use. */
.term.hard .bar i { background: color-mix(in oklch, var(--rose) 65%, var(--n5)); }
.term.easy .bar i { background: color-mix(in oklch, var(--green) 60%, var(--n5)); }
.term .eff {
  text-align: right; font-family: var(--mono); font-size: 0.625rem;
  color: var(--n6); white-space: nowrap;
}
.term.hard .eff { color: color-mix(in oklch, var(--rose) 60%, var(--n7)); }
.term.easy .eff { color: color-mix(in oklch, var(--green) 55%, var(--n7)); }
.term .tsub {
  grid-column: 1 / -1;
  font-family: var(--mono); font-size: 0.625rem; color: var(--n5);
  margin-bottom: 0.1rem;
}
.term .tsub b { color: var(--n7); font-weight: 500; }

.fxsum {
  display: grid; gap: 0.3rem;
  font-size: 0.8125rem; color: var(--n6);
  margin: 0.5rem 0 1rem;
}
.fxsum b { color: var(--n8); font-weight: 500; }
.fxsum .axis { font-family: var(--mono); font-size: 0.6875rem; color: var(--n5); }

@media (max-width: 640px) {
  .term { grid-template-columns: 6rem 1fr 5rem; font-size: 0.6875rem; }
  .sections button { font-size: 0.6875rem; padding: 0.65rem 0.5rem; }
}

/* ── Messages ──────────────────────────────────────────────────────────
   The portfolio renders nothing when the FPL API is down, because no
   reader of a portfolio needs to know. A tool inverts that: the person
   here is trying to get an answer, and the failure is the answer.       */
.msg { border: 1px solid var(--n4); border-radius: var(--radius); padding: 1rem 1.1rem; margin-top: 1.5rem; font-size: 0.875rem; }
.msg.error { border-color: color-mix(in oklch, var(--rose) 45%, transparent); }
.msg.error .m-head { color: var(--rose); font-family: var(--mono); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; }
.msg .m-body { color: var(--n7); margin-top: 0.4rem; font-family: var(--mono); font-size: 0.8125rem; word-break: break-word; }
.msg.empty { color: var(--n6); }

.notes { margin-top: 1.25rem; font-size: 0.8125rem; color: var(--n6); display: grid; gap: 0.3rem; }
.notes b { color: var(--n7); font-weight: 500; }
.provisional { color: var(--n7); }

/* ── Legend ────────────────────────────────────────────────────────────
   Every mark here is the real thing, rendered from the same classes the
   table uses rather than drawn as a facsimile - so it stays correct when
   a colour or a glyph changes, and the eye can match it against a row
   directly. The one-line label says what the mark is; the full sentence
   lives in the tooltip, which keeps the grid scannable instead of turning
   back into the wall of prose this replaced.                            */
.legend {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
  gap: 0.15rem 1.5rem; margin-top: 0.25rem;
}
.lg-item {
  display: flex; align-items: baseline; gap: 0.6rem;
  font-size: 0.8125rem; color: var(--n6);
  padding: 0.3rem 0; cursor: help; /* the affordance for "there is more on hover" */
  border-bottom: 1px solid transparent;
  transition: color 150ms var(--ease);
}
.lg-item:hover, .lg-item:focus-visible { color: var(--n8); }
.lg-mark {
  flex: none; min-width: 5rem; display: inline-flex;
  align-items: center; gap: 0.3rem;
}
/* The leader's gilt edge is a row treatment, so it has no inline mark of
   its own - this is the only swatch in the legend that is a stand-in. */
.lg-edge {
  display: inline-block; width: 3px; height: 0.95rem;
  background: var(--gold); border-radius: 1px;
}

/* ── Tooltip ───────────────────────────────────────────────────────────
   Replaces title= everywhere a mark needs a sentence. The native attribute
   was doing the job badly: a delay you can't tune, no styling, no line
   breaks, and nothing at all on a touch screen - which meant every legend
   entry on a phone was a glyph with no explanation beside it.

   One element for the whole page, moved and refilled, rather than one per
   trigger. render() rewrites the table's innerHTML on every sort and every
   open, so anything bound per-trigger would be destroyed a dozen times a
   session; the listener sits on the document and reads data-tip off
   whatever it lands on.                                                  */
#tip {
  position: fixed; inset: auto; top: 0; left: 0; margin: 0; z-index: 60;
  width: max-content; max-width: 20rem; pointer-events: none;
  background: var(--n2); color: var(--n8);
  border: 1px solid var(--n5); border-radius: var(--radius);
  padding: 0.4rem 0.55rem;
  font-size: 0.75rem; line-height: 1.45;
  box-shadow: 0 8px 24px -8px rgb(0 0 0 / 0.7);
  opacity: 0;
  transition: opacity 120ms var(--ease), overlay 120ms allow-discrete, display 120ms allow-discrete;
}
#tip:popover-open, #tip.show { opacity: 1; }
@starting-style { #tip:popover-open { opacity: 0; } }
/* ── Toasts ────────────────────────────────────────────────────────────
   For a failure that happens while the table is already on screen. The
   in-page .msg block below is still the right answer when the panel is
   empty - a dismissible corner card must never be the only record that
   the page has nothing on it - so these two split the job by whether
   there is anything left to read.                                       */
#toaster {
  position: fixed; z-index: 70; right: 1rem; bottom: 1rem;
  width: min(23rem, calc(100vw - 2rem));
  display: flex; flex-direction: column-reverse; gap: 0.5rem;
  pointer-events: none;
}
@keyframes toastin { from { opacity: 0; transform: translateY(14px) scale(0.97); } }
@keyframes toastout { to { opacity: 0; transform: translateY(6px) scale(0.98); } }
.toast {
  pointer-events: auto;
  display: grid; grid-template-columns: 1fr auto; gap: 0 0.75rem;
  background: var(--n1); border: 1px solid var(--n5); border-radius: var(--radius);
  padding: 0.7rem 0.8rem;
  box-shadow: 0 14px 34px -14px rgb(0 0 0 / 0.85);
  animation: toastin 260ms var(--ease) both;
}
.toast.out { animation: toastout 170ms var(--ease) both; }
.toast.err { border-color: color-mix(in oklch, var(--rose) 45%, transparent); }
.t-head {
  font-family: var(--mono); font-size: 0.6875rem; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--n6);
}
.toast.err .t-head { color: var(--rose); }
.t-body { grid-column: 1; margin-top: 0.3rem; font-size: 0.8125rem; color: var(--n7); word-break: break-word; }
.t-actions { grid-column: 1 / -1; display: flex; gap: 0.4rem; margin-top: 0.6rem; }
.t-actions button { font-size: 0.75rem; padding: 0.32rem 0.65rem; }
.t-close {
  grid-row: 1; grid-column: 2; align-self: start;
  background: none; border: 0; padding: 0 0 0 0.25rem; line-height: 1;
  color: var(--n5); font-size: 0.9rem; cursor: pointer;
}
/* :not(:disabled) is not decoration - the generic button:hover rule is
   (0,2,1) and would otherwise repaint this flat button with a fill. */
.t-close:hover:not(:disabled) { background: none; color: var(--n8); }

/* ── Skeleton ──────────────────────────────────────────────────────────
   A league report is dozens of upstream calls, so the wait is real and
   the old blank panel gave no shape to it. These are the table that is
   coming, at its real geometry, so nothing jumps when the rows land.

   The pulse is staggered down the rows on the same 18ms step as the row
   entrance, so the wait and the arrival read as one gesture rather than
   two unrelated animations.                                             */
@keyframes skpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
.sk {
  display: inline-block; height: 0.6875rem; border-radius: 3px;
  background: var(--n2); vertical-align: middle;
  animation: skpulse 1.6s var(--ease) infinite;
  animation-delay: calc(var(--i, 0) * 18ms);
}
.sk.tall { height: 1.9rem; border-radius: var(--radius); }
tbody.skeleton td { border-bottom-color: color-mix(in oklch, var(--n4) 30%, transparent); }
/* A refresh that has something to keep on screen keeps it, dimmed, rather
   than replacing a full table with a full skeleton - the numbers on screen
   are a minute old, not wrong. */
.table-scroll.loading, .ladder.loading { opacity: 0.45; pointer-events: none; transition: opacity 200ms var(--ease); }

/* ── Dialog / sheet ────────────────────────────────────────────────────
   A manager used to open as a row inside the table, which meant fifteen
   player cards were laid out against a ten-column table's width instead
   of the screen's, held in place by a sticky wrapper measured in JS on
   every render. Stepping out of the table gets the full width for free
   and takes the measuring machinery with it.

   It is the native element rather than a div: showModal() carries the
   focus trap, Escape, the inert background and top-layer stacking, all of
   which a hand-rolled overlay gets subtly and invisibly wrong.

   Entry and exit are the discrete-transition idiom (@starting-style plus
   allow-discrete) rather than a class flipped from JS. Where a browser
   lacks it the dialog simply appears, which is the correct degradation:
   the animation was never the thing carrying meaning.                   */
dialog.dlg {
  border: 0; padding: 0; background: transparent; color: inherit;
  width: 100%; max-width: min(52rem, calc(100vw - 2rem));
  max-height: calc(100dvh - 4rem);
  overflow: visible;
  opacity: 0; transform: translateY(10px) scale(0.985);
  transition: opacity 220ms var(--ease), transform 220ms var(--ease),
              overlay 220ms allow-discrete, display 220ms allow-discrete;
}
dialog.dlg[open] { opacity: 1; transform: none; }
@starting-style { dialog.dlg[open] { opacity: 0; transform: translateY(10px) scale(0.985); } }

dialog.dlg::backdrop {
  background: color-mix(in oklch, var(--n0) 74%, transparent);
  backdrop-filter: blur(3px);
  opacity: 0;
  transition: opacity 220ms var(--ease), overlay 220ms allow-discrete, display 220ms allow-discrete;
}
dialog.dlg[open]::backdrop { opacity: 1; }
@starting-style { dialog.dlg[open]::backdrop { opacity: 0; } }

/* A sheet is the same element anchored to the bottom edge and entering
   along it. On a phone the manager dialog becomes one too, so there is a
   single "more, from down here" gesture on the page rather than two. */
dialog.sheet {
  margin: auto auto 0; max-width: 100%;
  max-height: 88dvh;
  transform: translateY(100%);
}
@starting-style { dialog.sheet[open] { transform: translateY(100%); } }

html.locked { overflow: hidden; }

.dlg-panel {
  display: flex; flex-direction: column;
  max-height: inherit; overflow: hidden;
  background: var(--n1);
  border: 1px solid var(--n5);
  border-radius: calc(var(--radius) * 2);
  box-shadow: 0 24px 60px -20px rgb(0 0 0 / 0.8);
}
dialog.sheet .dlg-panel {
  border-radius: calc(var(--radius) * 3) calc(var(--radius) * 3) 0 0;
  border-bottom: 0;
}
/* The grab bar is the affordance, not a control: it says which edge this
   came from. Dismissal is the backdrop, Escape and the close button. */
.sheet-grip {
  display: none;
  width: 2.25rem; height: 3px; border-radius: 3px; background: var(--n4);
  margin: 0.6rem auto 0; flex: none;
}
dialog.sheet .sheet-grip { display: block; }

.dlg-head { padding: 1rem 1.1rem 0.9rem; border-bottom: 1px solid var(--n4); flex: none; }
.dlg-id { display: flex; align-items: flex-start; gap: 0.85rem; }
.dlg-rank {
  font-family: var(--mono); font-size: 1.6rem; line-height: 1.1;
  font-variant-numeric: tabular-nums; color: var(--n6); flex: none;
}
.dlg-rank.leader { color: var(--gold); }
.dlg-titles { min-width: 0; }
.dlg-entry { font-size: 1rem; font-weight: 500; color: var(--n8); line-height: 1.3; }
.dlg-manager { font-size: 0.8125rem; color: var(--n6); }
.dlg-close {
  margin-left: auto; flex: none;
  padding: 0.3rem 0.55rem; font-size: 0.9rem; line-height: 1;
  background: transparent; border-color: var(--n4); color: var(--n6);
}
.dlg-close:hover:not(:disabled) { color: var(--n8); }
/* The row's own numbers, carried into the dialog so the squad below is
   read against the score it produced rather than in isolation. */
.dlg-stats { display: flex; flex-wrap: wrap; gap: 0.9rem 1.5rem; margin-top: 0.95rem; }
.dlg-stat .n { font-family: var(--mono); font-size: 1.05rem; color: var(--n8); font-variant-numeric: tabular-nums; line-height: 1.2; }
.dlg-stat .n.gwpts { color: var(--orange); }
.dlg-stat .n.hit { color: var(--rose); }
.dlg-stat .l { font-family: var(--mono); font-size: 0.625rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--n6); }
.dlg-body { padding: 1rem 1.1rem 1.25rem; overflow-y: auto; overscroll-behavior: contain; }

/* ── Tab indicator ─────────────────────────────────────────────────────
   The selected rule used to be an inset shadow on each button, so moving
   between views was a cut. One shared bar that travels instead makes the
   switch depict the thing it does, and it is the only element on the page
   whose position is animated rather than its opacity.                    */
.tabind {
  position: absolute; bottom: 0; left: 0; height: 2px; width: 0;
  background: var(--blue); pointer-events: none;
  transition: transform 260ms var(--ease), width 260ms var(--ease);
}
/* Before the first measurement there is nothing to slide from, so the bar
   arrives in place rather than sweeping in from the left edge. */
.tabind.init { transition: none; }

/* ── Motion ────────────────────────────────────────────────────────────
   One entrance, and what it staggers is a league table arriving row by
   row — the motion depicts its subject rather than decorating it.

   It is scoped to .fresh, which render() only sets when new data has just
   landed. render() rewrites the table's innerHTML on every sort, every row
   expand and every option tab, and without that gate each of those replayed
   a 25-row staggered entrance - half a second of wobble on interactions
   that should feel instant.                                              */
@keyframes rowin { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
tbody.fresh tr.row { animation: rowin 320ms var(--ease) both; animation-delay: calc(var(--i) * 18ms); }

/* Reorder. When the standings change, rows slide past each other rather
   than teleporting - the one piece of motion here that depicts the thing
   the whole page is about. Applied by flipRows() as a transform that is
   then released; see the JS for why it can't be a CSS transition alone. */
tbody tr.row.sliding { transition: transform 520ms var(--ease); }
/* ── Phone ─────────────────────────────────────────────────────────────
   The controls were a wrapping flex row with 8.5rem minimums, which on a
   390px screen collapsed into cramped half-width dropdowns. They become a
   two-column grid instead, with the league id, sort and view rows spanning
   the full width.

   The important number here is the 16px font on inputs and selects. Below
   16px, iOS Safari zooms the whole page in when a control takes focus and
   does not zoom back out — the single most common cause of a form feeling
   broken on an iPhone. Everything also gets a 44px minimum height, which
   is Apple's minimum touch target; the old 0.5rem padding gave 34px.     */
/* The filters toggle only exists as a mobile affordance — on desktop the
   form is always visible and this stays display:none. */
.filters-toggle { display: none; }

@media (max-width: 640px) {
  .wrap { padding: 1.25rem 0.875rem 3rem; }

  /* The form used to occupy the entire first screen, pushing the table
     below the fold on every load. It moves into a bottom sheet instead
     (see placeControls), so results are visible immediately and this
     button is the way back in to change league/gameweek/sort.

     A sheet rather than the in-place collapse it replaces: the form is
     eight controls tall, so expanding it inline pushed the table off
     screen again and left the page scrolled to nothing. */
  .filters-toggle {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; margin-top: 1.25rem;
    font-family: var(--mono); font-size: 0.75rem; font-weight: 500;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--n7);
    background: var(--n1); border: 1px solid var(--n5); border-radius: var(--radius);
    padding: 0.65rem 0.875rem; min-height: 2.75rem;
  }
  .filters-toggle .ft-caret { color: var(--n5); transition: transform 200ms var(--ease); }
  .filters-toggle[aria-expanded="true"] .ft-caret { transform: rotate(180deg); }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem 0.625rem;
    align-items: end;
    margin: 0;
  }
  .f-league, .f-sort, .f-month, .f-view, #go { grid-column: 1 / -1; }
  /* Search is free text and Position is five buttons; neither fits a
     half-width column, and Club/Playing pair up happily in one. */
  .f-search, .f-pos, #pgo { grid-column: 1 / -1; }
  .f-pos .toggle button { padding-left: 0.15rem; padding-right: 0.15rem; }

  /* The manager dialog becomes a sheet too, so both "more, from down here"
     gestures on a phone are the same gesture. */
  dialog.dlg { max-width: 100%; margin: auto auto 0; max-height: 88dvh; transform: translateY(100%); }
  @starting-style { dialog.dlg[open] { transform: translateY(100%); } }
  .dlg-panel { border-radius: calc(var(--radius) * 3) calc(var(--radius) * 3) 0 0; border-bottom: 0; }
  .dlg-head, .dlg-body { padding-left: 0.875rem; padding-right: 0.875rem; }
  .sheet-grip { display: block; }
  .dlg-stats { gap: 0.75rem 1.1rem; }

  /* Full-bleed and above the home indicator, and never wider than the
     screen - the toaster's fixed right inset would otherwise put an
     action button under a thumb reaching for the scroll edge. */
  #toaster { right: 0.75rem; left: 0.75rem; bottom: 0.75rem; width: auto; }
  .toggle button { font-size: 0.8125rem; padding: 0.5rem 0.3rem; }

  #league { width: 100%; }

  input[type="number"], select, button {
    font-size: 1rem;              /* 16px: below this iOS zooms on focus */
    min-height: 2.75rem;          /* 44px touch target */
    min-width: 0;
    width: 100%;
    padding: 0.5rem 0.7rem;
  }
  .field label, .field .lbl { font-size: 0.75rem; }

  .sortrow select { min-width: 0; flex: 1; }
  .sortrow button { width: 2.75rem; min-width: 2.75rem; flex: none; padding: 0; }

  /* Otherwise inherits the generic mobile button rule's width:100%, which
     as a flex-basis forces every option onto its own full-width row. */
  .opt-btn { width: auto; min-height: 2.375rem; padding: 0.4rem 0.65rem; }
  .dlg-close, .t-close, .t-actions button { width: auto; min-width: 0; }
  .dlg-close { min-height: 2.25rem; }

  .toggle { width: 100%; }
  .toggle button { flex: 1; }

  .mh-top { padding: 0.7rem 0.75rem 0.6rem; }
  .strip { padding: 0.5rem 0.75rem 0.55rem; font-size: 0.6875rem; }

  /* Three fields across a 402px screen is 134px each, which is not a
     layout. They stack, and each becomes one line: the caption, the team,
     the number. The manager's name goes - the ladder below carries it, and
     what this band is for is the answer, not the full identity. */
  .mh-hon { grid-template-columns: 1fr; }
  .hon { display: flex; align-items: baseline; gap: 0.6rem; padding: 0.45rem 0.75rem; }
  .hon + .hon { box-shadow: 0 -1px 0 var(--n4); }
  .hon-cap { flex: none; }
  .hon-line { margin-top: 0; flex: 1; min-width: 0; }
  .hon-n { margin-left: auto; }
  .hon-mgr { display: none; }

  /* The table does not render at this width - render() builds the ladder
     instead - so nothing here has to make ten columns fit a phone. What is
     left is the ladder's own breathing room and a type scale with no step
     below 11px, which is where the old cells and badge labels sat. */
  .ladder { margin-top: 0.25rem; }

  /* The eyebrow over the ladder only ever repeated what the masthead two
     inches above it already says, and cost a line of a small screen. The
     provisional note and the legend's headings keep theirs. */
  .panel-head { display: none; }

  /* The legend is a reference, not part of the reading, so it collapses to
     one column and gives its marks room rather than squeezing to two. */
  .legend { grid-template-columns: 1fr; gap: 0 1rem; }
  .lg-item { padding: 0.4rem 0; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

<!-- The icon set. Every mark is an object from the game rather than a UI
     metaphor, because this page has one subject and the reader already
     knows its vocabulary: the armband a captain wears, the board a fourth
     official holds up for a substitution, the card a referee shows for an
     offence, the bench, the clock. Drawn once and stroked in currentColor,
     so each one takes the hue of the badge or fact it sits in.

     Deliberately five. Every icon replaces something the phone layout was
     carrying badly - a bare name in a column with no heading, a numeral
     with nothing to say what it counted - and the moment one is added that
     merely decorates a label already doing its job, the set stops helping
     you read the rail and starts being a thing to look at. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- Captain's armband: the band, and the stripe around it. -->
    <symbol id="ic-arm" viewBox="0 0 24 24">

      <path d="M21 15H6m3.5-3.5L6 15l3.5 3.5"/>

    </symbol>
    <!-- The bench, side on: the seat and its legs. It was drawn with a
         back rail too, which at 11px collapsed into a second plank and made
         the whole thing read as an equals sign. One plank, two long legs. -->
    <symbol id="ic-bench" viewBox="0 0 24 24">

    <symbol id="ic-star" viewBox="0 0 24 24">

<!-- On a phone the form lives in here instead; placeControls() moves the one
     element between the two homes rather than keeping two copies in sync. -->

<script>
"use strict";

const $ = (id) => document.getElementById(id);
// The league this tool is for. Deliberately the only fallback: an earlier
// version also remembered the last league in localStorage, which meant one
// mistyped id (58006 is a real 2-manager league, so it loaded fine and was
// saved) silently replaced the default on every later visit with nothing on
// screen to explain it. An explicit ?league= still overrides.
const DEFAULT_LEAGUE = 580906;

const state = {
  // section is which dataset is on screen - the league or the player
  // board; view is which cut of the league, and only applies to the first.
  section: "league",
  view: "gw", sort: { key: "leagueRank", dir: 1 }, report: null,
  // The manager whose dialog is open, or null. One at a time: the dialog is
  // modal, which is the whole reason the squad gets the width it needs.
  dialog: null,
  // Which option (transfers/team/captain/toplay) that manager last had
  // showing - remembered per manager, so reopening a row lands where you
  // left it - and the /api/team responses backing team/captain/toplay,
  // cached by "entryId:gw" so switching tabs back and forth doesn't refetch.
  tab: new Map(), teamCache: new Map(),
  // entryIds whose GW score changed since the last load - set just before
  // the one render() that should flash them, then cleared, so re-sorting or
  // reopening a row afterwards doesn't replay the animation.
  flashed: null,
};

// ── status strip ──────────────────────────────────────────────────────
// setSectionStatus is setStatus for a load that may land after the reader
// has already moved on. A deep link to ?section=players starts both loads,
// so without this the slower one captions the other one's page.
function setSectionStatus(section, kind, subject, text, right) {
  if (state.section !== section) return;
  setStatus(kind, subject, text, right);
}

function setStatus(kind, subject, text, right) {
  $("dot").className = "dot" + (kind === "ok" ? "" : kind === "err" ? " err" : " stale");
  $("subject").textContent = subject;
  $("state").textContent = text;
  $("count").textContent = right || "";
}

// ── this week ─────────────────────────────────────────────────────────
// The three questions a mini-league actually argues about. All three are
// gameweek facts, so the band reads the same whichever view is open - it
// describes the report's gameweek, which the strip above it names.
//
// Each is rendered only if it has a holder: before a gameweek kicks off
// nobody has won it, and a Bench Boost week can leave nobody holding the
// bench (the bench played, so nothing was left behind). An honour with no
// holder is left out rather than shown as a dash, and if none of the three
// has one the band removes itself.
function renderHonours(rep) {
  const rows = (rep && rep.gameweek) || [];
  const host = $("honours");
  if (!rows.length) return (host.innerHTML = "");

  const field = (cls, caption, holders, value, noun) => {
    if (!holders.length) return "";
    // Named by the best figure, not by whoever sits highest in the table.
    // A genuine tie holds equal values so the order would not matter, but
    // the band must not be able to report a lower number than one of the
    // holders it is standing in for.
    const [first, ...rest] = [...holders].sort((a, b) => value(b) - value(a));
    // Ties are shared. Name the first, count the others, list them all in
    // the tooltip - three names side by side would not fit the field.
    const more = rest.length
      ? `<span class="hon-more" data-tip="${esc(`Shared with ${rest.map((r) => r.entry).join(", ")}`)}">+${rest.length}</span>`
      : "";
    return `<div class="hon ${cls}" data-tip="${esc(`${caption}: ${value(first)} ${noun}`)}">
      <div class="hon-cap">${caption}</div>
      <div class="hon-line"><span class="hon-team">${esc(first.entry)}</span>${more}<span class="hon-n">${value(first)}</span></div>
      <div class="hon-mgr">${esc(first.manager)}</div>
    </div>`;
  };

  host.innerHTML =
      field("hon-won", "Won the week", rows.filter((r) => r.wonGw), (r) => r.netPoints, "points, net of hits")
    + field("hon-top", "Top of the table", rows.filter((r) => r.leagueRank === 1), (r) => r.total, "points overall")
    + field("hon-left", "Most left behind", rows.filter((r) => r.wonBench), (r) => r.bench, "points on the bench");
}

// Only meaningful before a deadline - once it's passed there's nothing left
// to count down to, so this returns null rather than "0m to deadline".
function deadlineCountdown(iso) {
  const ms = new Date(iso) - Date.now();
  if (!isFinite(ms) || ms <= 0) return null;
  const totalMin = Math.floor(ms / 60000);
  const days = Math.floor(totalMin / 1440);
  const hours = Math.floor((totalMin % 1440) / 60);
  const mins = totalMin % 60;
  if (days > 0) return `${days}d ${hours}h to deadline`;
  if (hours > 0) return `${hours}h ${mins}m to deadline`;
  return `${mins}m to deadline`;
}

// ── tooltip ───────────────────────────────────────────────────────────
// One element for the page. Everything with data-tip is a trigger, found
// by delegation rather than by binding, because render() destroys and
// rebuilds every trigger inside the table on each sort and each open.
const TIP_DELAY = 160;
let tipTimer = 0, tipFor = null;

function tipPlace(target) {
  const el = $("tip");
  const r = target.getBoundingClientRect();
  const t = el.getBoundingClientRect();
  const M = 8;
  // Above by preference: the trigger is usually a table cell with the row's
  // other numbers to its right, and a tip below would cover the next row.
  let top = r.top - t.height - 6;
  if (top < M) top = r.bottom + 6;
  let left = r.left + r.width / 2 - t.width / 2;
  left = Math.max(M, Math.min(left, innerWidth - t.width - M));
  el.style.left = Math.round(left) + "px";
  el.style.top = Math.round(top) + "px";
}

// popover() where it exists, a class where it doesn't - the class path
// stacks below a dialog, which is the correct amount of wrong for a browser
// that is already several years behind.
function tipToggle(el, show) {
  if (!el.showPopover) return el.classList.toggle("show", show);
  try { show ? el.showPopover() : el.hidePopover(); } catch {}
}

function tipShow(target) {
  const text = target.getAttribute("data-tip");
  if (!text) return;
  const el = $("tip");
  tipFor = target;
  el.textContent = text;
  tipToggle(el, true);
  target.setAttribute("aria-describedby", "tip");
